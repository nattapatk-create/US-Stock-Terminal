    function getStockName(symbol, profileName) {
      if (profileName && profileName.trim()) return profileName;
      if (symbol && STOCK_INFO_MAP[symbol.toUpperCase()]?.name) return STOCK_INFO_MAP[symbol.toUpperCase()].name;
      return symbol || "";
    }

    function getLogoUrls(symbol, profileLogo) {
      const list = [];
      if (profileLogo) list.push(profileLogo);
      if (symbol) {
        const cleanSym = symbol.toUpperCase();
        list.push(`https://assets.parqet.com/logos/symbol/${cleanSym}`);
        list.push(`https://images.financialmodelingprep.com/symbol/${cleanSym}.png`);
        if (STOCK_INFO_MAP[cleanSym]?.domain) {
          list.push(`https://logo.clearbit.com/${STOCK_INFO_MAP[cleanSym].domain}`);
        }
      }
      return list;
    }

    const StockLogo = React.memo(function StockLogo({ symbol, logoUrl, size = 24, className = "" }) {
      const [imgIdx, setImgIdx] = useState(0);
      const [failed, setFailed] = useState(false);

      const logoUrls = useMemo(() => getLogoUrls(symbol, logoUrl), [symbol, logoUrl]);

      useEffect(() => {
        setImgIdx(0);
        setFailed(false);
      }, [symbol, logoUrl]);

      const handleError = () => {
        if (imgIdx < logoUrls.length - 1) {
          setImgIdx((prev) => prev + 1);
        } else {
          setFailed(true);
        }
      };

      if (failed || !logoUrls[imgIdx]) {
        const char = symbol ? symbol.charAt(0).toUpperCase() : "?";
        return (
          <div
            style={{ width: `${size}px`, height: `${size}px`, minWidth: `${size}px` }}
            className={`rounded-full bg-zinc-800 border border-zinc-700 flex items-center justify-center font-mono font-bold text-zinc-300 text-[10px] select-none shrink-0 ${className}`}
            title={symbol}
          >
            {char}
          </div>
        );
      }

      return (
        <div
          style={{ width: `${size}px`, height: `${size}px`, minWidth: `${size}px` }}
          className={`rounded-full overflow-hidden bg-zinc-900 border border-zinc-800 flex items-center justify-center shrink-0 p-0.5 ${className}`}
        >
          <img
            src={logoUrls[imgIdx]}
            alt={symbol}
            onError={handleError}
            className="w-full h-full object-contain rounded-full"
            loading="lazy"
          />
        </div>
      );
    });

    function createQueue(getMinIntervalMs) {

          const wait = Math.max(0, last + minIntervalMs - Date.now());
          if (wait > 0) await new Promise((r) => setTimeout(r, wait));
          last = Date.now();
          return fn();
        });
        chain = run.catch(() => {});
        return run;
      };
    }

    function ema(values, period) {
      const k = 2 / (period + 1);
      const out = new Array(values.length).fill(null);
      let prev = null;
      values.forEach((v, i) => {
        if (v == null) return;
        prev = prev == null ? v : v * k + prev * (1 - k);
        out[i] = prev;
      });
      return out;
    }

    function rsi(closes, period = 14) {
      const out = new Array(closes.length).fill(null);
      if (closes.length <= period) return out;
      let gainSum = 0, lossSum = 0;
      for (let i = 1; i <= period; i++) {
        const d = closes[i] - closes[i - 1];
        if (d >= 0) gainSum += d; else lossSum -= d;
      }
      let avgGain = gainSum / period, avgLoss = lossSum / period;
      out[period] = 100 - 100 / (1 + (avgLoss === 0 ? 100 : avgGain / avgLoss));
      for (let i = period + 1; i < closes.length; i++) {
        const d = closes[i] - closes[i - 1];
        const gain = d > 0 ? d : 0, loss = d < 0 ? -d : 0;
        avgGain = (avgGain * (period - 1) + gain) / period;
        avgLoss = (avgLoss * (period - 1) + loss) / period;
        const rs = avgLoss === 0 ? 100 : avgGain / avgLoss;
        out[i] = 100 - 100 / (1 + rs);
      }
      return out;
    }

    function macd(closes) {
      const e12 = ema(closes, 12), e26 = ema(closes, 26);
      const line = closes.map((_, i) => (e12[i] != null && e26[i] != null ? e12[i] - e26[i] : null));
      const signal = ema(line.map((v) => (v == null ? 0 : v)), 9);
      const hist = line.map((v, i) => (v != null && signal[i] != null ? v - signal[i] : null));
      return { line, signal, hist };
    }

    function findSwings(bars, window = 5) {
      const highs = [], lows = [];
      for (let i = window; i < bars.length - window; i++) {
        const slice = bars.slice(i - window, i + window + 1);
        if (bars[i].high === Math.max(...slice.map((b) => b.high))) highs.push({ price: bars[i].high, idx: i });
        if (bars[i].low === Math.min(...slice.map((b) => b.low))) lows.push({ price: bars[i].low, idx: i });
      }
      return { highs, lows };
    }

    function clusterLevels(points, tolerancePct, totalBars) {
      const sorted = [...points].sort((a, b) => a.price - b.price);
      const clusters = [];
      sorted.forEach((p) => {
        const last = clusters[clusters.length - 1];
        if (last && Math.abs(p.price - last.avg) / last.avg <= tolerancePct) {
          last.prices.push(p.price);
          last.idxs.push(p.idx);
          last.avg = last.prices.reduce((a, b) => a + b, 0) / last.prices.length;
        } else {
          clusters.push({ avg: p.price, prices: [p.price], idxs: [p.idx] });
        }
      });
      return clusters.map((c) => ({
        price: c.avg,
        touches: c.prices.length,
        strength: c.prices.length * 2 + (Math.max(...c.idxs) / totalBars),
      }));
    }

    function getSupportResistance(bars, currentPrice) {
      if (!bars || bars.length < 20) return { support: [], resistance: [] };
      const { highs, lows } = findSwings(bars, 5);
      const tolerance = 0.0002;

      const resistance = clusterLevels(highs, tolerance, bars.length)
        .filter((c) => c.price > currentPrice * 1.0001)
        .sort((a, b) => b.touches - a.touches || b.strength - a.strength)
        .slice(0, 3)
        .sort((a, b) => a.price - b.price);

      const support = clusterLevels(lows, tolerance, bars.length)
        .filter((c) => c.price < currentPrice * 0.9999)
        .sort((a, b) => b.touches - a.touches || b.strength - a.strength)
        .slice(0, 3)
        .sort((a, b) => a.price - b.price);

      return { support, resistance };
    }

    function classify(bars) {
      const closes = bars.map((b) => b.close);
      const last = closes.length - 1;
      const price = closes[last];
      const e20 = ema(closes, 20), e50 = ema(closes, 50), e200 = ema(closes, 200);
      const rsiArr = rsi(closes, 14);
      const { hist } = macd(closes);
      const rsiVal = rsiArr[last];
      const h = hist[last], hPrev = hist[last - 1];
      const has200 = closes.length > 200;

      let trend = "Sideways", trendScore = 0;
      if (e20[last] != null && e50[last] != null) {
        const alignedUp = price > e20[last] && e20[last] > e50[last] && (!has200 || e50[last] > e200[last]);
        const alignedDown = price < e20[last] && e20[last] < e50[last] && (!has200 || e50[last] < e200[last]);
        if (alignedUp) { trend = "Uptrend"; trendScore = 2; }
        else if (price > e50[last]) { trend = "Uptrend"; trendScore = 1; }
        else if (alignedDown) { trend = "Downtrend"; trendScore = -2; }
        else if (price < e50[last]) { trend = "Downtrend"; trendScore = -1; }
      }

      let momentum = "Neutral";
      if (rsiVal != null && h != null && hPrev != null) {
        if (rsiVal > 60 && h > hPrev) momentum = "Strong Bullish";
        else if (rsiVal > 50 && h > 0) momentum = "Bullish";
        else if (rsiVal < 40 && h < hPrev) momentum = "Strong Bearish";
        else if (rsiVal < 50 && h < 0) momentum = "Bearish";
      }

      return { trend, trendScore, momentum, rsi: rsiVal, macdHist: h, e20: e20[last], e50: e50[last], e200: has200 ? e200[last] : null, price };
    }

        }));
      });

      { symbol: "RTX", country: "US", sector: "Industrials", catalyst: "ธุรกิจอากาศยานและกลาโหมได้ประโยชน์จากงบทหารที่เพิ่มขึ้น" },
      { symbol: "LMT", country: "US", sector: "Industrials", catalyst: "ผู้ผลิตอาวุธและระบบป้องกันประเทศรายใหญ่ของโลก" },
      { symbol: "XOM", country: "US", sector: "Energy", catalyst: "ผู้ผลิตน้ำมันและก๊าซรายใหญ่ที่สุดของสหรัฐฯ" },
      { symbol: "CVX", country: "US", sector: "Energy", catalyst: "ธุรกิจน้ำมันครบวงจรได้ประโยชน์จากราคาพลังงาน" },
      { symbol: "COP", country: "US", sector: "Energy", catalyst: "ผู้ผลิตน้ำมันและก๊าซต้นทุนต่ำขยายแหล่งผลิตใหม่" },
      { symbol: "LIN", country: "US", sector: "Materials", catalyst: "ก๊าซอุตสาหกรรมรายใหญ่ของโลกรองรับอุตสาหกรรมเซมิคอนดักเตอร์" },
      { symbol: "PLD", country: "US", sector: "Real Estate", catalyst: "คลังสินค้าและศูนย์กระจายสินค้ารองรับอีคอมเมิร์ซ" },
      { symbol: "AMT", country: "US", sector: "Real Estate", catalyst: "เสาสัญญาณโทรคมนาคมรองรับการขยายเครือข่าย 5G" },
      { symbol: "EQIX", country: "US", sector: "Real Estate", catalyst: "ศูนย์ข้อมูลระดับโลกรองรับความต้องการ AI Cloud" },
      { symbol: "NEE", country: "US", sector: "Utilities", catalyst: "สาธารณูปโภคไฟฟ้าและพลังงานหมุนเวียนรายใหญ่ของสหรัฐฯ" }
    ];

    // กำหนดการสแกน:
    // 1. ครบ 10 ตัวก็พอ
    // 2. Strong Bullish เท่านั้น (Uptrend + Strong Bullish Momentum)
    // 3. ตั้ง Max Stocks Pool ไว้ที่ 1,000 หุ้น
    // 4. สแกนจนเจอครบ 10 ตัวแล้วให้หยุดสแกนทันที (Fast Stop)
    const WEEKLY_PICK_COUNT = 10;
    const MAX_SCAN_POOL = 1000;

    function isWeeklyPickEligible(cls) {
      if (!cls) return false;
      // ยึดเกณฑ์เดิม: ขาขึ้น (Uptrend) และ โมเมนตัมบวกแรงเท่านั้น (Strong Bullish Only!)
      return cls.trend === "Uptrend" && cls.momentum === "Strong Bullish";
    }

    function getCapTier(mktCapB) {
      if (!mktCapB || mktCapB <= 0) return null;
      if (mktCapB >= 10) return "Large";
      if (mktCapB >= 2) return "Mid";
      return "Small";
    }
    const CAP_TIER_TH = { Large: "Large Cap", Mid: "Mid Cap", Small: "Small Cap" };
    const CAP_TIER_STYLE = {
      Large: "text-blue-300 bg-blue-500/10 border-blue-500/30",
      Mid: "text-purple-300 bg-purple-500/10 border-purple-500/30",
      Small: "text-pink-300 bg-pink-500/10 border-pink-500/30",
    };

    function getWeeklyRotationOrder(weekKeyStr) {
      const dateObj = weekKeyStr ? new Date(weekKeyStr) : new Date();
      const weekKey = Math.floor(dateObj.getTime() / (1000 * 60 * 60 * 24 * 7));
      const pool = TRENDING_UNIVERSE.slice(0, MAX_SCAN_POOL);
      const poolLen = pool.length;
      if (poolLen === 0) return [];
      const start = weekKey % poolLen;
      return Array.from({ length: poolLen }, (_, i) => pool[(start + i) % poolLen]);
    }

    function WeeklyRecommendedPanel({ tdKey, fhKey, dataMap, loadSymbol, symbols, onAdd }) {
      const [loading, setLoading] = useState(false);
      const [scanProgress, setScanProgress] = useState({ done: 0, total: 0, found: 0 });
      const dataMapRef = useRef(dataMap);
      useEffect(() => {
        dataMapRef.current = dataMap;
      }, [dataMap]);

      const today = useMemo(() => {
        const d = new Date();
        const formattedDate = d.toISOString().slice(0, 10);
        const dayOfWeek = d.getDay();
        const diffToMonday = (dayOfWeek + 6) % 7;
        const monday = new Date(d);
        monday.setDate(d.getDate() - diffToMonday);
        const sunday = new Date(monday);
        sunday.setDate(monday.getDate() + 6);
        const weekKey = monday.toISOString().slice(0, 10);
        return {
          date: formattedDate,
          weekKey,
          displayDate: `${monday.toLocaleDateString("th-TH", { day: "numeric", month: "short" })} - ${sunday.toLocaleDateString("th-TH", { day: "numeric", month: "short", year: "numeric" })}`,
          rotation: getWeeklyRotationOrder(weekKey),
        };
      }, []);

      const scanCandidates = useCallback(async () => {
        if (!tdKey) return;
        setLoading(true);
        const rotationPool = today.rotation;
        setScanProgress({ done: 0, total: rotationPool.length, found: 0 });

        try {
          let doneCount = 0;
          let foundCount = 0;

          // ตรวจสอบหุ้นที่มีข้อมูลอยู่ในเครื่องแล้วก่อน
          for (const item of rotationPool) {
            const cached = dataMapRef.current[item.symbol];
            if (cached && cached.series && cached.series.length >= 20) {
              const cls = classify(cached.series);
              if (isWeeklyPickEligible(cls)) {
                foundCount++;
              }
            }
          }

          // หากพบครบ 10 ตัวแล้ว ไม่ต้องสแกนเพิ่ม
          if (foundCount >= WEEKLY_PICK_COUNT) {
            setScanProgress({ done: rotationPool.length, total: rotationPool.length, found: foundCount });
            return;
          }

          // ไล่สแกนทีละตัว หากพบครบ 10 ตัวที่เข้าเกณฑ์ Strong Bullish + Uptrend ให้หยุดสแกนทันที
          for (const item of rotationPool) {
            if (foundCount >= WEEKLY_PICK_COUNT) {
              console.log(`[Scanner] พบหุ้น Strong Bullish ครบ ${WEEKLY_PICK_COUNT} ตัวแล้ว หยุดการสแกนทันที`);
              break;
            }

            const cached = dataMapRef.current[item.symbol];
            const needsFundamentals = !!fhKey && !cached?.fundamentals;
            const alreadyFresh = cached && !cached.stale && cached.series && cached.series.length >= 20 && !needsFundamentals;

            if (!alreadyFresh) {
              await loadSymbol(item.symbol, true);
            }

            const entry = dataMapRef.current[item.symbol];
            if (entry && entry.series && entry.series.length >= 20) {
              const cls = classify(entry.series);
              if (isWeeklyPickEligible(cls)) {
                foundCount++;
              }
            }

            doneCount++;
            setScanProgress({ done: doneCount, total: rotationPool.length, found: foundCount });
          }
        } finally {
          setLoading(false);
        }
      }, [tdKey, fhKey, today, loadSymbol]);

      useEffect(() => {
        scanCandidates();
      }, [today.weekKey, tdKey, fhKey]);

      const recommended = useMemo(() => {
        const candidates = [];
        for (const item of today.rotation) {
          const entry = dataMap[item.symbol];
          if (!entry || !entry.series || entry.series.length < 20) continue;
          const cls = classify(entry.series);
          if (!isWeeklyPickEligible(cls)) continue;
          const mktCapB = ((pick(entry.fundamentals, ["marketCapitalization"]) || entry.profile?.marketCapitalization || 0) * 1e6) / 1e9;
          const countryMeta = getCountryMeta(item.country);
          candidates.push({
            ...item,
            cls,
            mktCapB,
            capTier: getCapTier(mktCapB),
            countryMeta,
            region: countryMeta.region,
            quote: entry.quote,
            profile: entry.profile,
          });
        }

        // เรียงตามความแข็งแรงของสัญญาณ RSI & Trend Score
        const strength = (c) => c.cls.trendScore + (c.cls.rsi || 0) / 100;
        candidates.sort((a, b) => strength(b) - strength(a));

        // กระจายหุ้นให้อยู่หลายภูมิภาค
        const regionsOrder = [...new Set(candidates.map((c) => c.region))];
        const picked = [];
        const usedSymbols = new Set();
        let guard = 0;
        while (picked.length < WEEKLY_PICK_COUNT && guard < candidates.length + 1) {
          let addedThisRound = false;
          for (const region of regionsOrder) {
            if (picked.length >= WEEKLY_PICK_COUNT) break;
            const next = candidates.find((c) => !usedSymbols.has(c.symbol) && c.region === region);
            if (next) {
              picked.push(next);
              usedSymbols.add(next.symbol);
              addedThisRound = true;
            }
          }
          guard++;
          if (!addedThisRound) break;
        }
        for (const c of candidates) {
          if (picked.length >= WEEKLY_PICK_COUNT) break;
          if (!usedSymbols.has(c.symbol)) {
            picked.push(c);
            usedSymbols.add(c.symbol);
          }
        }
        return picked.slice(0, WEEKLY_PICK_COUNT);
      }, [today, dataMap]);

      return (
        <div className="bg-gradient-to-r from-amber-500/10 via-zinc-900 to-emerald-500/10 border border-amber-500/30 rounded-lg p-4 space-y-4">
          <div className="flex flex-wrap items-center justify-between gap-3">
            <div>
              <div className="flex items-center gap-2 text-amber-400 font-bold text-base">
                <Zap className="fill-amber-400" size={18} />
                <span>หุ้นแนะนำประจำสัปดาห์ 🌐 ทั่วโลก (Strong Bullish Only - {WEEKLY_PICK_COUNT} ตัว)</span>
              </div>
              <div className="text-xs text-zinc-400 mt-0.5">
                เกณฑ์: คัดกรองจากพูลหุ้นสูงสุด <strong className="text-zinc-200">1,000 ตัวทั่วโลก</strong> ครอบคลุม{" "}
                <strong className="text-zinc-200">Small / Mid / Large Cap</strong> ทุกภูมิภาค โดยยึดเฉพาะหุ้นที่เป็น{" "}
                <strong className="text-emerald-400">ขาขึ้น (Uptrend)</strong> และ{" "}
                <strong className="text-emerald-400">โมเมนตัมบวกแรง (Strong Bullish) เท่านั้น</strong> • เมื่อสแกนเจอครบ {WEEKLY_PICK_COUNT} ตัวจะหยุดสแกนทันที • เปลี่ยนชุดสแกนใหม่อัตโนมัติทุกสัปดาห์
              </div>
            </div>
            <div className="flex items-center gap-2">
              <span className="text-xs font-mono bg-zinc-950 border border-zinc-800 text-amber-400 px-3 py-1 rounded-md font-bold">
                📅 {today.displayDate}
              </span>
              <button
                onClick={scanCandidates}
                disabled={loading || !tdKey}
                className="flex items-center gap-1.5 text-xs bg-zinc-900 border border-zinc-700 text-zinc-200 hover:bg-zinc-800 px-3 py-1 rounded-md font-medium transition disabled:opacity-50"
              >
                <RefreshCw size={13} className={loading ? "animate-spin" : ""} />
                สแกนค้นหาหุ้นแนะนำ
              </button>
            </div>
          </div>

          {!tdKey && (
            <div className="bg-amber-500/10 border border-amber-500/30 rounded-lg p-2.5 text-[11px] text-amber-300 flex items-start gap-2">
              <span>⚠️</span>
              <span>
                ต้องตั้งค่า <strong>Twelve Data API Key</strong> ก่อน จึงจะสแกนเพื่อหาหุ้นแนะนำประจำสัปดาห์ได้ — ตั้งค่าได้ที่เมนู ⚙ มุมขวาบน
              </span>
            </div>
          )}

          {loading && (
            <div className="bg-zinc-950/80 border border-zinc-800 rounded-lg p-3 text-center text-xs text-amber-300 font-mono">
              ⚡ กำลังสแกนจากพูลหุ้นทั่วโลก... พบแล้ว {scanProgress.found}/{WEEKLY_PICK_COUNT} ตัว (เช็กไปแล้ว {scanProgress.done} ตัว)
            </div>
          )}

          {!loading && recommended.length === 0 && (
            <div className="text-xs text-zinc-500 text-center py-6">
              {tdKey
                ? "ยังไม่พบหุ้นที่ตรงเกณฑ์ Uptrend + Strong Bullish ในสัปดาห์นี้"
                : "กรุณาตั้งค่า Twelve Data API Key เพื่อเริ่มใช้งานหุ้นแนะนำประจำสัปดาห์"}
            </div>
          )}

          {recommended.length > 0 && (
            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3">
              {recommended.map((rec, idx) => {
                const alreadyAdded = symbols.includes(rec.symbol);
                return (
                  <div key={rec.symbol} className="bg-zinc-900 border border-zinc-800 hover:border-amber-500/40 rounded-lg p-3 flex flex-col justify-between transition">
                    <div>
                      <div className="flex items-start justify-between gap-1.5 mb-2">
                        <div className="flex items-center gap-2">
                          <StockLogo symbol={rec.symbol} logoUrl={rec.profile?.logo} size={28} />
                          <div>
                            <div className="flex items-center gap-1">
                              <span title={rec.countryMeta?.name}>{rec.countryMeta?.flag}</span>
                              <span className="font-mono font-bold text-sm text-zinc-100">{rec.symbol}</span>
                              <span className="text-[9px] font-bold px-1 py-0.1 rounded bg-amber-500/20 text-amber-300 border border-amber-500/30">
                                #{idx + 1}
                              </span>
                            </div>
                            <div className="text-[10px] text-zinc-400 truncate max-w-[100px]">
                              {getStockName(rec.symbol, rec.profile?.name)}
                            </div>
                          </div>
                        </div>
                      </div>

                      {rec.quote && (
                        <div className="font-mono mb-2">
                          <span className="text-sm font-bold text-zinc-100">${fmtPrice(+rec.quote.close)}</span>
                          <span className={`ml-1.5 text-[11px] font-semibold ${+rec.quote.percent_change >= 0 ? "text-emerald-400" : "text-red-400"}`}>
                            {fmtPct(+rec.quote.percent_change)}
                          </span>
                        </div>
                      )}

                      <div className="mb-1.5 flex flex-wrap gap-1">
                        <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded border ${TREND_STYLE[rec.cls.trend]}`}>
                          {TREND_TH[rec.cls.trend]}
                        </span>
                        <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded border ${MOM_STYLE[rec.cls.momentum]}`}>
                          {MOM_TH[rec.cls.momentum]}
                        </span>
                        {rec.capTier && (
                          <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded border ${CAP_TIER_STYLE[rec.capTier]}`}>
                            {CAP_TIER_TH[rec.capTier]}
                          </span>
                        )}
                      </div>
                      <div className="text-[9px] text-zinc-500 mb-2">
                        {rec.countryMeta?.name} ({rec.region}) • RSI {rec.cls.rsi != null ? rec.cls.rsi.toFixed(1) : "—"}
                        {rec.mktCapB > 0 && <> • Mkt Cap ${rec.mktCapB.toFixed(1)}B</>}
                      </div>

                      <div className="bg-zinc-950/80 border border-zinc-800/80 rounded p-2 text-[10px] text-zinc-300">
                        <div className="text-amber-400 font-bold mb-0.5">💡 Catalyst</div>
                        <div>{rec.catalyst}</div>
                      </div>
                    </div>

                    <div className="pt-2 mt-2 border-t border-zinc-800">
                      <button
                        onClick={() => onAdd(rec.symbol)}
                        disabled={alreadyAdded}
                        className="w-full py-1 bg-blue-600/20 hover:bg-blue-600/30 disabled:opacity-50 disabled:cursor-not-allowed text-blue-400 border border-blue-500/30 rounded text-[11px] font-semibold flex items-center justify-center gap-1 transition"
                      >
                        {alreadyAdded ? "อยู่ใน Watchlist แล้ว" : (<><Plus size={12} /> เพิ่มเข้า Watchlist</>)}
                      </button>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
    }

    /* ============================================================
       PRICE CHART
       ============================================================ */
    function PriceChart({ series, support, resistance, timeframe = "1week" }) {
      const tfObj = TIMEFRAMES.find((t) => t.id === timeframe) || TIMEFRAMES[1];

      const data = useMemo(() => {
        const closes = series.map((b) => b.close);
        const e200Arr = ema(closes, 200);

        return series.slice(-90).map((b, idx) => {
          const originalIdx = series.length - 90 + idx;
          return {
            date: b.date.slice(0, 16),
            close: b.close,
            ema200: e200Arr[originalIdx],
          };
        });
      }, [series]);

      const levels = [
        ...support.map((s) => s.price),
        ...resistance.map((r) => r.price),
        ...data.map((d) => d.close),
        ...data.map((d) => d.ema200).filter(Boolean)
      ];
      const min = Math.min(...levels) * 0.985;
      const max = Math.max(...levels) * 1.015;

      return (
        <ResponsiveContainer width="100%" height={230}>
          <ComposedChart data={data} margin={{ top: 6, right: 52, left: 0, bottom: 0 }}>
            <CartesianGrid strokeDasharray="3 3" stroke="#27272a" vertical={false} />
            <XAxis dataKey="date" tick={{ fill: "#71717a", fontSize: 10 }} axisLine={{ stroke: "#3f3f46" }} tickLine={false} minTickGap={28} />
            <YAxis domain={[min, max]} tick={{ fill: "#71717a", fontSize: 10 }} axisLine={false} tickLine={false} width={46} tickFormatter={(v) => v.toFixed(0)} />
            <Tooltip
              contentStyle={{ background: "#18181b", border: "1px solid #3f3f46", borderRadius: 6, fontSize: 12 }}
              labelStyle={{ color: "#a1a1aa" }}
              formatter={(v, name) => [`$${v ? v.toFixed(2) : "—"}`, name === "close" ? `ราคาปิด (${tfObj.label})` : name]}
            />
            {resistance.map((r, i) => (
              <ReferenceLine key={`r${i}`} y={r.price} stroke="#f87171" strokeDasharray="4 3" strokeOpacity={0.9 - i * 0.2}
                label={{ value: `R${i + 1} ${r.price.toFixed(2)} (${r.touches}x)`, position: "right", fill: "#f87171", fontSize: 10 }} />
            ))}
            {support.map((s, i) => (
              <ReferenceLine key={`s${i}`} y={s.price} stroke="#34d399" strokeDasharray="4 3" strokeOpacity={0.9 - i * 0.2}
                label={{ value: `S${i + 1} ${s.price.toFixed(2)} (${s.touches}x)`, position: "right", fill: "#34d399", fontSize: 10 }} />
            ))}
            <Line type="monotone" dataKey="close" stroke="#60a5fa" strokeWidth={1.75} dot={false} isAnimationActive={false} name="close" />
            <Line type="monotone" dataKey="ema200" stroke="#a855f7" strokeWidth={1.5} strokeDasharray="3 3" dot={false} isAnimationActive={false} name="EMA200" />
          </ComposedChart>
        </ResponsiveContainer>
      );
    }

    /* ============================================================
       MULTI-PORTFOLIO VIEW
       ============================================================ */
    function PortfolioView({ tdKey, dataMap, loadSymbol }) {
      const [portfolios, setPortfolios] = useState([]);
      const [activePortId, setActivePortId] = useState("");
      const [newPortName, setNewPortName] = useState("");
      const [showNewPortInput, setShowNewPortInput] = useState(false);

      const [actionType, setActionType] = useState("BUY");
      const [symbol, setSymbol] = useState("");
      const [shares, setShares] = useState("");
      const [costPrice, setCostPrice] = useState("");
      const [targetPctInput, setTargetPctInput] = useState("");
      const [loadingQuotes, setLoadingQuotes] = useState(false);

      const [sortField, setSortField] = useState("currVal");
      const [sortAsc, setSortAsc] = useState(false);
      const [expandedSymbol, setExpandedSymbol] = useState(null);

      useEffect(() => {
        (async () => {
          let ports = await loadStore("us-dash-portfolios-v3", null);
          if (!ports || ports.length === 0) {
            const legacy = await loadStore("us-dash-portfolio-v2", []);
            ports = [
              {
                id: "port-" + Date.now(),
                name: "พอร์ตหลัก (Main Portfolio)",
                items: Array.isArray(legacy) ? legacy : []
              }
            ];
            saveStore("us-dash-portfolios-v3", ports);
          }
          setPortfolios(ports);
          if (ports.length > 0) {
            setActivePortId(ports[0].id);
          }
        })();
      }, []);

      const savePortfolios = (updated) => {
        setPortfolios(updated);
        saveStore("us-dash-portfolios-v3", updated);
      };

      const activePort = useMemo(() => {
        return portfolios.find((p) => p.id === activePortId) || portfolios[0] || { id: "def", name: "Default", items: [] };
      }, [portfolios, activePortId]);

      const portfolio = activePort.items || [];

      const updateActiveItems = (updatedItems) => {
        const updatedPorts = portfolios.map((p) => {
          if (p.id === activePort.id) {
            return { ...p, items: updatedItems };
          }
          return p;
        });
        savePortfolios(updatedPorts);
      };

      const handleCreatePortfolio = (e) => {
        e.preventDefault();
        const name = newPortName.trim();
        if (!name) return;

        const newPort = {
          id: "port-" + Date.now(),
          name,
          items: []
        };
        const updated = [...portfolios, newPort];
        savePortfolios(updated);
        setActivePortId(newPort.id);
        setNewPortName("");
        setShowNewPortInput(false);
      };

      const handleDeletePortfolio = (portId) => {
        if (portfolios.length <= 1) {
          alert("ไม่สามารถลบพอร์ตทั้งหมดได้ ต้องมีอย่างน้อย 1 พอร์ตในระบบ");
          return;
        }
        const target = portfolios.find((p) => p.id === portId);
        if (confirm(`คุณต้องการลบพอร์ต "${target?.name}" ออกใช่หรือไม่?`)) {
          const updated = portfolios.filter((p) => p.id !== portId);
          savePortfolios(updated);
          if (activePortId === portId) {
            setActivePortId(updated[0].id);
          }
        }
      };

      const refreshPortfolioQuotes = useCallback(async () => {
        if (!tdKey) return;
        const allSymbols = [...new Set(portfolios.flatMap((p) => (p.items || []).map((item) => item.symbol)))];
        if (allSymbols.length === 0) return;

        setLoadingQuotes(true);
        await Promise.all(allSymbols.map((s) => loadSymbol(s, false)));
        setLoadingQuotes(false);
      }, [portfolios, tdKey, loadSymbol]);

      useEffect(() => {
        if (portfolios.length > 0 && tdKey) {
          refreshPortfolioQuotes();
        }
      }, [portfolios.length, tdKey]);

      const handleTransaction = (e) => {
        e.preventDefault();
        const s = symbol.trim().toUpperCase();
        const numShares = parseFloat(shares);
        const price = parseFloat(costPrice);
        const targetPct = parseFloat(targetPctInput);

        if (!s || isNaN(numShares) || numShares <= 0) {
          alert("กรุณากรอก Symbol และจำนวนหุ้นให้ถูกต้อง");
          return;
        }

        const existingIndex = portfolio.findIndex((item) => item.symbol === s);

        if (actionType === "BUY") {
          if (isNaN(price) || price <= 0) {
            alert("กรุณากรอกราคาต้นทุนซื้อให้ถูกต้อง");
            return;
          }

          let updated = [...portfolio];
          if (existingIndex >= 0) {
            const existing = updated[existingIndex];
            const oldTotalCost = existing.shares * existing.avgCost;
            const newBuyCost = numShares * price;
            const newTotalShares = existing.shares + numShares;
            const newAvgCost = (oldTotalCost + newBuyCost) / newTotalShares;

            updated[existingIndex] = {
              ...existing,
              shares: newTotalShares,
              avgCost: newAvgCost,
              targetPct: !isNaN(targetPct) && targetPct >= 0 ? targetPct : (existing.targetPct || 0)
            };
          } else {
            updated.push({
              symbol: s,
              shares: numShares,
              avgCost: price,
              targetPct: !isNaN(targetPct) && targetPct >= 0 ? targetPct : 0
            });
          }
          updateActiveItems(updated);
          if (tdKey) loadSymbol(s, false);

        } else if (actionType === "TRIM") {
          if (existingIndex < 0) {
            alert(`ไม่พบหุ้น ${s} ในพอร์ต "${activePort.name}"`);
            return;
          }
          const existing = portfolio[existingIndex];
          if (numShares > existing.shares) {
            alert(`จำนวนหุ้นที่ต้องการขาย (${numShares}) มากกว่าหุ้นที่มีอยู่ (${existing.shares})`);
            return;
          }

          let updated = [...portfolio];
          if (Math.abs(numShares - existing.shares) < 1e-6) {
            updated.splice(existingIndex, 1);
          } else {
            updated[existingIndex] = {
              ...existing,
              shares: existing.shares - numShares
            };
          }
          updateActiveItems(updated);
        }

        setSymbol("");
        setShares("");
        setCostPrice("");
        setTargetPctInput("");
      };

      const updateTargetPct = (sym, newPct) => {
        const val = parseFloat(newPct);
        const updated = portfolio.map((item) => {
          if (item.symbol === sym) {
            return { ...item, targetPct: !isNaN(val) && val >= 0 ? val : 0 };
          }
          return item;
        });
        updateActiveItems(updated);
      };

      const deletePosition = (sym) => {
        if (confirm(`คุณต้องการลบหุ้น ${sym} ออกจากพอร์ต "${activePort.name}" ใช่หรือไม่?`)) {
          const updated = portfolio.filter((item) => item.symbol !== sym);
          updateActiveItems(updated);
        }
      };

      const quickAction = (sym, type) => {
        setSymbol(sym);
        setActionType(type);
        const existing = portfolio.find((p) => p.symbol === sym);
        if (existing && existing.targetPct != null) {
          setTargetPctInput(existing.targetPct.toString());
        }
        if (type === "BUY") {
          const currQuote = dataMap[sym]?.quote?.close;
          if (currQuote) setCostPrice(currQuote.toString());
        }
      };

      const totalPortfolioVal = useMemo(() => {
        return portfolio.reduce((acc, item) => {
          const quote = dataMap[item.symbol]?.quote;
          const currPrice = quote?.close ? parseFloat(quote.close) : null;
          const currVal = currPrice != null ? item.shares * currPrice : item.shares * item.avgCost;
          return acc + currVal;
        }, 0);
      }, [portfolio, dataMap]);

      const processedPortfolio = useMemo(() => {
        return portfolio.map((item) => {
          const quote = dataMap[item.symbol]?.quote;
          const currPrice = quote?.close ? parseFloat(quote.close) : null;
          const totalCost = item.shares * item.avgCost;
          const currVal = currPrice != null ? item.shares * currPrice : totalCost;
          const pl = currPrice != null ? currVal - totalCost : 0;
          const plPct = currPrice != null && totalCost > 0 ? (pl / totalCost) * 100 : 0;

          const targetPct = item.targetPct != null ? parseFloat(item.targetPct) : 0;
          const actualPct = totalPortfolioVal > 0 ? (currVal / totalPortfolioVal) * 100 : 0;
          const maxAllowedVal = totalPortfolioVal * (targetPct / 100);
          const excessVal = maxAllowedVal > 0 ? currVal - maxAllowedVal : 0;
          const excessPct = actualPct - targetPct;
          const isOver = targetPct > 0 && excessVal > 0.01;

          return {
            ...item,
            currPrice,
            totalCost,
            currVal,
            pl,
            plPct,
            targetPct,
            actualPct,
            maxAllowedVal,
            excessVal,
            excessPct,
            isOver
          };
        });
      }, [portfolio, dataMap, totalPortfolioVal]);

      const sortedPortfolio = useMemo(() => {
        return [...processedPortfolio].sort((a, b) => {
          let valA = a[sortField];
          let valB = b[sortField];

          if (typeof valA === "string") {
            return sortAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
          }
          return sortAsc ? (valA ?? 0) - (valB ?? 0) : (valB ?? 0) - (valA ?? 0);
        });
      }, [processedPortfolio, sortField, sortAsc]);

      const handleSort = (field) => {
        if (sortField === field) {
          setSortAsc(!sortAsc);
        } else {
          setSortField(field);
          setSortAsc(false);
        }
      };

      const summary = useMemo(() => {
        let totalCost = 0;
        let totalCurrentVal = 0;
        let totalTargetPctAllocated = 0;
        let totalOverAllocatedCount = 0;

        processedPortfolio.forEach((item) => {
          totalCost += item.totalCost;
          totalCurrentVal += item.currVal;
          totalTargetPctAllocated += item.targetPct;
          if (item.isOver) totalOverAllocatedCount++;
        });

        const totalPL = totalCurrentVal - totalCost;
        const totalPLPct = totalCost > 0 ? (totalPL / totalCost) * 100 : 0;

        return { totalCost, totalCurrentVal, totalPL, totalPLPct, totalTargetPctAllocated, totalOverAllocatedCount };
      }, [processedPortfolio]);

      return (
        <div className="space-y-4">
          <div className="bg-zinc-900 border border-zinc-800 rounded-lg p-3 flex flex-wrap items-center justify-between gap-3">
            <div className="flex items-center gap-2 flex-wrap">
              <span className="text-xs font-semibold text-zinc-300 flex items-center gap-1.5 mr-1">
                <Briefcase className="text-blue-400" size={16} /> เลือกพอร์ตลงทุน:
              </span>
              <div className="flex items-center gap-1.5 flex-wrap">
                {portfolios.map((p) => (
                  <button
                    key={p.id}
                    onClick={() => setActivePortId(p.id)}
                    className={`px-3 py-1.5 rounded-md text-xs font-medium transition flex items-center gap-2 ${
                      p.id === activePort.id
                        ? "bg-blue-600 text-white font-bold shadow-sm"
                        : "bg-zinc-950 text-zinc-400 hover:text-zinc-200 border border-zinc-800"
                    }`}
                  >
                    <span>{p.name}</span>
                    <span className="text-[10px] px-1.5 py-0.2 rounded-full bg-zinc-900/60 text-zinc-300">
                      {p.items?.length || 0}
                    </span>
                  </button>
                ))}
              </div>
            </div>

            <div className="flex items-center gap-2">
              {!showNewPortInput ? (
                <button
                  onClick={() => setShowNewPortInput(true)}
                  className="flex items-center gap-1 px-3 py-1.5 rounded bg-emerald-600/20 text-emerald-400 border border-emerald-500/30 hover:bg-emerald-600/30 text-xs font-medium transition"
                >
                  <Plus size={14} /> สร้างพอร์ตใหม่
                </button>
              ) : (
                <form onSubmit={handleCreatePortfolio} className="flex items-center gap-1.5">
                  <input
                    type="text"
                    placeholder="ชื่อพอร์ต เช่น พอร์ตเกษียณ"
                    value={newPortName}
                    onChange={(e) => setNewPortName(e.target.value)}
                    className="bg-zinc-950 border border-emerald-500/50 rounded px-2.5 py-1 text-xs text-zinc-100 font-mono w-44 focus:outline-none"
                    autoFocus
                  />
                  <button
                    type="submit"
                    className="px-2.5 py-1 rounded bg-emerald-600 text-white text-xs font-medium hover:bg-emerald-500"
                  >
                    สร้าง
                  </button>
                  <button
                    type="button"
                    onClick={() => { setShowNewPortInput(false); setNewPortName(""); }}
                    className="px-2 py-1 rounded bg-zinc-800 text-zinc-400 text-xs hover:text-zinc-200"
                  >
                    ยกเลิก
                  </button>
                </form>
              )}

              {portfolios.length > 1 && (
                <button
                  onClick={() => handleDeletePortfolio(activePort.id)}
                  className="flex items-center gap-1 px-2.5 py-1.5 rounded bg-red-500/10 text-red-400 border border-red-500/30 hover:bg-red-500/20 text-xs transition"
                  title="ลบพอร์ตปัจจุบัน"
                >
                  <Trash2 size={13} /> ลบพอร์ต
                </button>
              )}
            </div>
          </div>

          <div className="bg-zinc-900 border border-zinc-800 rounded-lg p-4">
            <div className="text-sm font-semibold text-zinc-100 flex items-center justify-between mb-3">
              <span className="flex items-center gap-2">
                <span>⚡</span>
                จัดการหุ้นใน <span className="text-blue-400">"{activePort.name}"</span>
              </span>
              <button
                onClick={refreshPortfolioQuotes}
                disabled={loadingQuotes}
                className="flex items-center gap-1.5 text-xs text-blue-400 hover:text-blue-300 disabled:opacity-50"
              >
                <RefreshCw size={13} className={loadingQuotes ? "animate-spin" : ""} />
                อัปเดตราคาราคาเรียลไทม์ (Twelve Data)
              </button>
            </div>

            <form onSubmit={handleTransaction} className="space-y-3">
              <div className="flex items-center gap-2 mb-2">
                <button
                  type="button"
                  onClick={() => setActionType("BUY")}
                  className={`px-3 py-1 text-xs rounded font-medium border ${actionType === "BUY" ? "bg-emerald-500/20 text-emerald-300 border-emerald-500/50" : "bg-zinc-950 text-zinc-400 border-zinc-800"}`}
                >
                  <Plus size={12} className="inline mr-1" /> ซื้อเพิ่ม / บันทึกหุ้น (Buy)
                </button>
                <button
                  type="button"
                  onClick={() => setActionType("TRIM")}
                  className={`px-3 py-1 text-xs rounded font-medium border ${actionType === "TRIM" ? "bg-amber-500/20 text-amber-300 border-amber-500/50" : "bg-zinc-950 text-zinc-400 border-zinc-800"}`}
                >
                  <MinusCircle size={12} className="inline mr-1" /> ขายบางส่วน (Trim/Sell)
                </button>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-5 gap-3 items-end">
                <div>
                  <label className="text-[11px] text-zinc-400 block mb-1">ชื่อหุ้น (Symbol)</label>
                  <input
                    type="text"
                    placeholder="เช่น NVDA"
                    value={symbol}
                    onChange={(e) => setSymbol(e.target.value)}
                    className="w-full bg-zinc-950 border border-zinc-800 rounded px-3 py-1.5 text-xs font-mono text-zinc-100 uppercase"
                  />
                </div>
                <div>
                  <label className="text-[11px] text-zinc-400 block mb-1">
                    {actionType === "BUY" ? "จำนวนหุ้นซื้อเพิ่ม" : "จำนวนหุ้นขาย"}
                  </label>
                  <input
                    type="number"
                    step="any"
                    placeholder="เช่น 10 หรือ 0.52"
                    value={shares}
                    onChange={(e) => setShares(e.target.value)}
                    className="w-full bg-zinc-950 border border-zinc-800 rounded px-3 py-1.5 text-xs font-mono text-zinc-100"
                  />
                </div>
                {actionType === "BUY" && (
                  <>
                    <div>
                      <label className="text-[11px] text-zinc-400 block mb-1">ราคาซื้อต่อหุ้น ($)</label>
                      <input
                        type="number"
                        step="any"
                        placeholder="เช่น 120.50"
                        value={costPrice}
                        onChange={(e) => setCostPrice(e.target.value)}
                        className="w-full bg-zinc-950 border border-zinc-800 rounded px-3 py-1.5 text-xs font-mono text-zinc-100"
                      />
                    </div>
                    <div>
                      <label className="text-[11px] text-zinc-400 block mb-1">ล็อกสัดส่วนเป้าหมาย (% พอร์ตนี้)</label>
                      <input
                        type="number"
                        step="any"
                        placeholder="เช่น 50"
                        value={targetPctInput}
                        onChange={(e) => setTargetPctInput(e.target.value)}
                        className="w-full bg-zinc-950 border border-zinc-800 rounded px-3 py-1.5 text-xs font-mono text-blue-400 font-bold"
                      />
                    </div>
                  </>
                )}
                <div className={actionType === "TRIM" ? "sm:col-span-3" : ""}>
                  <button
                    type="submit"
                    className={`w-full flex items-center justify-center gap-1.5 px-4 py-1.5 rounded font-medium text-xs text-white transition ${actionType === "BUY" ? "bg-emerald-600 hover:bg-emerald-500" : "bg-amber-600 hover:bg-amber-500"}`}
                  >
                    {actionType === "BUY" ? <Plus size={14} /> : <MinusCircle size={14} />}
                    {actionType === "BUY" ? `เพิ่มเข้าพอร์ต ${activePort.name}` : "ตัดขาย (Trim)"}
                  </button>
                </div>
              </div>
            </form>
          </div>

          <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
            <div className="bg-zinc-900 border border-zinc-800 rounded-lg p-3">
              <div className="text-[11px] text-zinc-500">ต้นทุนรวม ({activePort.name})</div>
              <div className="text-base font-mono font-bold text-zinc-100 mt-1">${fmtPrice(summary.totalCost)}</div>
            </div>
            <div className="bg-zinc-900 border border-zinc-800 rounded-lg p-3">
              <div className="text-[11px] text-zinc-500">มูลค่าปัจจุบันรวม</div>
              <div className="text-base font-mono font-bold text-zinc-100 mt-1">${fmtPrice(summary.totalCurrentVal)}</div>
            </div>
            <div className="bg-zinc-900 border border-zinc-800 rounded-lg p-3">
              <div className="text-[11px] text-zinc-500">กำไร/ขาดทุน รวม ($)</div>
              <div className={`text-base font-mono font-bold mt-1 ${summary.totalPL >= 0 ? "text-emerald-400" : "text-red-400"}`}>
                {summary.totalPL >= 0 ? "+" : ""}${fmtPrice(summary.totalPL)}
              </div>
            </div>
            <div className="bg-zinc-900 border border-zinc-800 rounded-lg p-3">
              <div className="text-[11px] text-zinc-500">สถานะล็อกสัดส่วนพอร์ตนี้</div>
              <div className="text-sm font-mono font-bold mt-1">
                {summary.totalOverAllocatedCount > 0 ? (
                  <span className="text-red-400 flex items-center gap-1">
                    <AlertTriangle size={14} /> เกินโควตา {summary.totalOverAllocatedCount} รายการ
                  </span>
                ) : (
                  <span className="text-emerald-400">✓ สัดส่วนสมดุลดี</span>
                )}
              </div>
            </div>
          </div>

          {summary.totalCurrentVal > 0 && (
            <div className="bg-zinc-900 border border-zinc-800 rounded-lg p-3">
              <div className="text-xs text-zinc-400 mb-2 font-medium flex justify-between items-center">
                <span>📊 สัดส่วนถือครองของพอร์ต "{activePort.name}"</span>
                <span className="text-[11px] font-mono text-zinc-500">
                  เป้าหมายรวม: {summary.totalTargetPctAllocated.toFixed(1)}% / 100%
                </span>
              </div>
              <div className="h-3.5 w-full bg-zinc-950 rounded-full overflow-hidden flex border border-zinc-800">
                {processedPortfolio.map((item, idx) => {
                  if (item.actualPct <= 0) return null;
                  const colors = [
                    "bg-blue-500", "bg-emerald-500", "bg-purple-500", "bg-amber-500", 
                    "bg-indigo-500", "bg-rose-500", "bg-cyan-500", "bg-teal-500"
                  ];
                  return (
                    <div
                      key={item.symbol}
                      style={{ width: `${item.actualPct}%` }}
                      className={`${item.isOver ? "bg-red-500" : colors[idx % colors.length]} h-full transition-all border-r border-zinc-950`}
                      title={`${item.symbol}: ปัจจุบัน ${item.actualPct.toFixed(1)}% | เป้าหมาย ${item.targetPct}% ${item.isOver ? `(เกิน $${fmtPrice(item.excessVal)})` : ""}`}
                    />
                  );
                })}
              </div>
              <div className="flex flex-wrap gap-2 mt-2.5 text-[11px] font-mono">
                {processedPortfolio.map((item) => (
                  <div key={item.symbol} className="flex items-center gap-1.5 bg-zinc-950 px-2 py-1 rounded border border-zinc-800">
                    <StockLogo symbol={item.symbol} logoUrl={dataMap[item.symbol]?.profile?.logo} size={16} />
                    <span className="font-bold text-zinc-200">{item.symbol}:</span>
                    <span className={item.isOver ? "text-red-400 font-bold" : "text-zinc-400"}>
                      {item.actualPct.toFixed(1)}% {item.targetPct > 0 ? `(เป้า ${item.targetPct}%)` : ""}
                    </span>
                  </div>
                ))}
              </div>
            </div>
          )}

          <div className="bg-zinc-900 border border-zinc-800 rounded-lg p-4 overflow-x-auto">
            <div className="text-sm font-semibold text-zinc-200 mb-3 flex items-center justify-between">
              <span>📋 รายชื่อหุ้นในพอร์ต "{activePort.name}" ({portfolio.length} รายการ)</span>
              <span className="text-[11px] text-zinc-500 font-normal">แก้ไข % เป้าหมายในตารางเพื่อคำนวณโควตาใหม่ได้ทันที</span>
            </div>

            {portfolio.length === 0 ? (
              <div className="text-center text-zinc-500 py-8 text-xs">
                ยังไม่มีรายการหุ้นในพอร์ต "{activePort.name}" กรอกข้อมูลด้านบนเพื่อเริ่มบันทึกหุ้นเข้าพอร์ตนี้
              </div>
            ) : (
              <table className="w-full text-left text-xs font-mono">
                <thead>
                  <tr className="border-b border-zinc-800 text-zinc-400">
                    <th className="pb-2 cursor-pointer hover:text-zinc-200 select-none" onClick={() => handleSort('symbol')}>
                      ชื่อหุ้น {sortField === 'symbol' ? (sortAsc ? '▲' : '▼') : ''}
                    </th>
                    <th className="pb-2 text-right cursor-pointer hover:text-zinc-200 select-none" onClick={() => handleSort('currVal')}>
                      มูลค่า {sortField === 'currVal' ? (sortAsc ? '▲' : '▼') : ''}
                    </th>
                    <th className="pb-2 text-right cursor-pointer hover:text-zinc-200 select-none" onClick={() => handleSort('shares')}>
                      จำนวนหุ้น {sortField === 'shares' ? (sortAsc ? '▲' : '▼') : ''}
                    </th>
                    <th className="pb-2 text-right cursor-pointer hover:text-zinc-200 select-none" onClick={() => handleSort('pl')}>
                      กำไร/ขาดทุน {sortField === 'pl' ? (sortAsc ? '▲' : '▼') : ''}
                    </th>
                    <th className="pb-2 text-right cursor-pointer hover:text-zinc-200 select-none" onClick={() => handleSort('currPrice')}>
                      ราคาล่าสุด/ต้นทุน {sortField === 'currPrice' ? (sortAsc ? '▲' : '▼') : ''}
                    </th>
                    <th className="pb-2 text-center">จัดการ</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-zinc-800/60">
                  {sortedPortfolio.map((item) => {
                    const isExpanded = expandedSymbol === item.symbol;
                    return (
                    <React.Fragment key={item.symbol}>
                    <tr className={`hover:bg-zinc-800/40 transition ${item.isOver ? "bg-red-500/5" : ""}`}>
                      <td className="py-2.5">
                        <div className="flex items-center gap-2.5">
                          <StockLogo symbol={item.symbol} logoUrl={dataMap[item.symbol]?.profile?.logo} size={28} />
                          <div className="min-w-0">
                            <div className="font-bold text-zinc-100 flex items-center gap-1.5 font-mono">
                              {item.symbol}
                            </div>
                            <div className="text-[10px] text-zinc-400 truncate max-w-[140px] sm:max-w-[200px] font-sans">
                              {getStockName(item.symbol, dataMap[item.symbol]?.profile?.name)}
                            </div>
                          </div>
                        </div>
                      </td>
                      <td className="py-2.5 text-right font-bold text-zinc-100">${fmtPrice(item.currVal)}</td>
                      <td className="py-2.5 text-right text-zinc-200 font-semibold">{item.shares}</td>
                      <td className="py-2.5 text-right">
                        <div className={`font-bold ${item.pl >= 0 ? "text-emerald-400" : "text-red-400"}`}>
                          {item.pl >= 0 ? "+" : ""}${fmtPrice(item.pl)}
                        </div>
                        <div className={`text-[10px] ${item.pl >= 0 ? "text-emerald-400" : "text-red-400"}`}>
                          {fmtPct(item.plPct)}
                        </div>
                      </td>
                      <td className="py-2.5 text-right">
                        <div className="font-bold text-zinc-100">
                          {item.currPrice != null ? `$${fmtPrice(item.currPrice)}` : <span className="text-zinc-500">กำลังโหลด...</span>}
                        </div>
                        <div className="text-[10px] text-zinc-500">ต้นทุน ${fmtPrice(item.avgCost)}</div>
                      </td>
                      <td className="py-2.5 text-center">
                        <button
                          onClick={() => setExpandedSymbol(isExpanded ? null : item.symbol)}
                          className={`px-2.5 py-1 rounded border text-[11px] font-medium inline-flex items-center gap-1 transition ${
                            isExpanded

    /* ============================================================
       WATCHLIST POSITION & PROFIT CALCULATOR
       ============================================================ */
    function WatchlistCalculator({ currentPrice, support = [], resistance = [] }) {
      const [showCalc, setShowCalc] = useState(false);
      const [capital, setCapital] = useState(1000);
      const [entryPrice, setEntryPrice] = useState("");
      const [stopLoss, setStopLoss] = useState("");

      useEffect(() => {
        const s1 = support.length > 0 ? support[0].price : currentPrice;
        const s2 = support.length > 1 ? support[1].price : (s1 ? s1 * 0.95 : 0);

        if (s1) setEntryPrice(s1.toFixed(2));
        if (s2) setStopLoss(s2.toFixed(2));
      }, [support, currentPrice]);

      const cap = parseFloat(capital) || 0;
      const entry = parseFloat(entryPrice) || 0;
      const sl = parseFloat(stopLoss) || 0;

      const shares = entry > 0 ? cap / entry : 0;
      const maxLoss = entry > 0 && sl > 0 ? cap - (shares * sl) : 0;
      const riskAmount = entry - sl;

      const targets = useMemo(() => {
        const base = entry > 0 ? entry : currentPrice;
        return [0, 1, 2].map((i) => {
          const r = resistance[i];
          const price = r ? r.price : (base ? base * (1 + 0.1 * (i + 1)) : 0);
          const totalVal = shares * price;
          const profit = totalVal - cap;
          const profitPct = entry > 0 ? ((price - entry) / entry) * 100 : 0;
          const rewardAmount = price - entry;
          const rr = riskAmount > 0 && rewardAmount > 0 ? (rewardAmount / riskAmount).toFixed(2) : null;
          return {
            key: `R${i + 1}`,
            price,
            touches: r ? r.touches : null,
            isEstimate: !r,
            totalVal,
            profit,
            profitPct,
            rr,
          };
        });
      }, [resistance, entry, currentPrice, shares, cap, riskAmount]);

      return (
        <div className="mt-3">
          <button
            type="button"
            onClick={() => setShowCalc((v) => !v)}
            className="w-full flex items-center justify-between bg-zinc-950/80 border border-zinc-800 hover:border-zinc-700 hover:bg-zinc-900/60 rounded-lg px-3 py-2 transition-colors"
          >
            <span className="text-xs font-semibold text-zinc-200 flex items-center gap-1.5">
              <span>🧮</span> เครื่องมือคำนวณกำไร & Risk/Reward (Position Sizing)
            </span>
            <span className="flex items-center gap-1.5 text-[10px] text-zinc-500">
              {showCalc ? "ซ่อนเครื่องมือ" : "คลิกเพื่อเปิดเครื่องมือ"}
              {showCalc ? <ChevronDown size={14} /> : <ChevronRight size={14} />}
            </span>
          </button>

          {showCalc && (
            <div className="mt-2 bg-zinc-950/80 border border-zinc-800 rounded-lg p-3">
              <div className="text-[10px] text-zinc-500 font-mono text-right mb-2.5">Auto Technical Support/Resistance</div>

              <div className="grid grid-cols-1 sm:grid-cols-3 gap-2 mb-3">
                <div>
                  <label className="text-[10px] text-zinc-400 block mb-1">เงินทุนที่ลง ($)</label>
                  <input
                    type="number"
                    value={capital}
                    onChange={(e) => setCapital(e.target.value)}
                    className="w-full bg-zinc-900 border border-zinc-800 rounded px-2 py-1 text-xs font-mono text-zinc-100"
                    placeholder="1000"
                  />
                </div>

                <div>
                  <label className="text-[10px] text-zinc-400 block mb-1">จุดซื้อ / แนวรับ ($)</label>
                  <input
                    type="number"
                    value={entryPrice}
                    onChange={(e) => setEntryPrice(e.target.value)}
                    className="w-full bg-zinc-900 border border-zinc-800 rounded px-2 py-1 text-xs font-mono text-emerald-400 font-bold"
                    placeholder="0.00"
                  />
                  <div className="flex gap-1 mt-1 flex-wrap">
                    {support.map((s, idx) => (
                      <button
                        key={idx}
                        type="button"
                        onClick={() => setEntryPrice(s.price.toFixed(2))}
                        className="text-[9px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-1 py-0.5 rounded hover:bg-emerald-500/20"
                      >
                        S{idx+1}: {s.price.toFixed(1)}
                      </button>
                    ))}
                    {currentPrice && (
                      <button
                        type="button"
                        onClick={() => setEntryPrice(currentPrice.toFixed(2))}
                        className="text-[9px] bg-zinc-800 text-zinc-300 border border-zinc-700 px-1 py-0.5 rounded hover:bg-zinc-700"
                      >
                        ปัจจุบัน
                      </button>
                    )}
                  </div>
                </div>

                <div>
                  <label className="text-[10px] text-zinc-400 block mb-1">ตัดขาดทุน Stop Loss ($)</label>
                  <input
                    type="number"
                    value={stopLoss}
                    onChange={(e) => setStopLoss(e.target.value)}
                    className="w-full bg-zinc-900 border border-zinc-800 rounded px-2 py-1 text-xs font-mono text-red-400"
                    placeholder="0.00"
                  />
                </div>
              </div>

              {cap > 0 && entry > 0 ? (
                <>
                  <div className="text-[10px] text-zinc-500 mb-1.5">
                    กำไรคาดการณ์อัตโนมัติ 3 ช่วง ตามแนวต้าน — เงินทุน ${fmtPrice(cap)} → {shares.toFixed(2)} หุ้น @ ${fmtPrice(entry)}
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                    {targets.map((t) => (
                      <div key={t.key} className="bg-zinc-900/90 border border-zinc-800/80 rounded p-2.5 font-mono text-xs">
                        <div className="flex items-center justify-between mb-1.5">
                          <span className="text-[10px] font-semibold text-blue-400">
                            เป้าหมาย {t.key} {t.isEstimate ? "(ประมาณการ)" : `(${t.touches}x)`}
                          </span>
                          <span className="text-zinc-200 font-bold">${fmtPrice(t.price)}</span>
                        </div>
                        <div className={`font-bold ${t.profit >= 0 ? "text-emerald-400" : "text-red-400"}`}>
                          {t.profit >= 0 ? "+" : ""}${fmtPrice(t.profit)} ({fmtPct(t.profitPct)})
                        </div>
                        <div className="text-[10px] text-zinc-500 mt-1">
                          R:R {t.rr ? `1 : ${t.rr}` : "—"}
                        </div>
                      </div>
                    ))}
                  </div>
                  {maxLoss > 0 && (
                    <div className="text-[10px] text-red-400 mt-2">
                      ⚠️ หากชน Stop Loss (${fmtPrice(sl)}) จะขาดทุนประมาณ ${fmtPrice(maxLoss)}
                    </div>
                  )}
                </>
              ) : (
                <div className="text-[11px] text-zinc-500 text-center py-3">
                  กรอก "เงินทุนที่ลง" และ "จุดซื้อ" เพื่อคำนวณกำไรคาดการณ์อัตโนมัติ 3 ช่วงตามแนวต้าน
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    /* ============================================================
       SECTOR ROTATION VIEW
       ============================================================ */
    function SectorRotationView({ tdKey }) {
      const [sectorData, setSectorData] = useState([]);
      const [loading, setLoading] = useState(false);
      const [progress, setProgress] = useState(0);
      const [error, setError] = useState(null);

      const [sortField, setSortField] = useState("score");
      const [sortAsc, setSortAsc] = useState(false);

      const scanSectors = useCallback(async () => {
        if (!tdKey || !tdKey.trim()) {
          setError("โปรดใส่ Twelve Data API key ในเมนู ⚙ เพื่อเริ่มการสแกนอัตโนมัติ");
          return;
        }
        setLoading(true);
        setError(null);
        setProgress(0);

        const results = [];
        let spySeries = null;

        try {
          try {
            spySeries = await fetchSeries("SPY", tdKey, "1week", 70);
          } catch (e) {
            console.warn("Couldn't fetch SPY, using absolute sector metrics.");
          }

          const spyReturns = spySeries && spySeries.length >= 20 ? {
            r1w: ((spySeries[spySeries.length - 1].close - spySeries[spySeries.length - 2].close) / spySeries[spySeries.length - 2].close) * 100,
            r1m: ((spySeries[spySeries.length - 1].close - spySeries[Math.max(0, spySeries.length - 5)].close) / spySeries[Math.max(0, spySeries.length - 5)].close) * 100,
            r3m: ((spySeries[spySeries.length - 1].close - spySeries[0].close) / spySeries[0].close) * 100,
          } : { r1w: 0, r1m: 0, r3m: 0 };

          for (let i = 0; i < SECTOR_ETFS.length; i++) {
            const sec = SECTOR_ETFS[i];
            setProgress(Math.round(((i + 1) / SECTOR_ETFS.length) * 100));

            try {
              const series = await fetchSeries(sec.symbol, tdKey, "1week", 70);
              if (series && series.length >= 12) {
                const len = series.length;
                const pNow = series[len - 1].close;
                const p1w = series[Math.max(0, len - 2)].close;
                const p1m = series[Math.max(0, len - 5)].close;
                const p3m = series[0].close;

                const r1w = ((pNow - p1w) / p1w) * 100;
                const r1m = ((pNow - p1m) / p1m) * 100;
                const r3m = ((pNow - p3m) / p3m) * 100;

                const rel1w = r1w - spyReturns.r1w;
                const rel1m = r1m - spyReturns.r1m;
                const rel3m = r3m - spyReturns.r3m;

                let quadrant = "Lagging";
                if (rel1m >= 0 && rel1w >= 0) quadrant = "Leading";
                else if (rel1m >= 0 && rel1w < 0) quadrant = "Weakening";
                else if (rel1m < 0 && rel1w >= 0) quadrant = "Improving";
                else quadrant = "Lagging";

                const score = (rel1w * 0.4) + (rel1m * 0.4) + (rel3m * 0.2);

                results.push({
                  ...sec,
                  price: pNow,
                  r1w, r1m, r3m,
                  rel1w, rel1m, rel3m,
                  quadrant,
                  score
                });
              }
            } catch (err) {
              console.error(`Failed to fetch ${sec.symbol}`, err);
            }
          }

          results.sort((a, b) => b.score - a.score);
          setSectorData(results);
          saveStore("us-dash-sector-data", results);
        } catch (e) {
          setError(e.message || "เกิดข้อผิดพลาดในการโหลดข้อมูล Sector");
        } finally {
          setLoading(false);
        }
      }, [tdKey]);

      useEffect(() => {
        loadStore("us-dash-sector-data", []).then((cached) => {
          if (cached && cached.length) setSectorData(cached);
        });

        if (tdKey && tdKey.trim() && !sectorAutoScanned) {
          sectorAutoScanned = true;
          scanSectors();
        }
      }, [tdKey, scanSectors]);

      const sortedSectorData = useMemo(() => {
        return [...sectorData].sort((a, b) => {
          const valA = a[sortField] ?? 0;
          const valB = b[sortField] ?? 0;
          return sortAsc ? valA - valB : valB - valA;
        });
      }, [sectorData, sortField, sortAsc]);

      const handleSort = (field) => {
        if (sortField === field) {
          setSortAsc(!sortAsc);
        } else {
          setSortField(field);
          setSortAsc(false);
        }
      };

      const quadrants = useMemo(() => {
        const groups = { Leading: [], Weakening: [], Improving: [], Lagging: [] };
        sectorData.forEach((s) => {
          if (groups[s.quadrant]) groups[s.quadrant].push(s);
        });
        return groups;
      }, [sectorData]);

      const QUAD_STYLE = {
        Leading: "text-emerald-400 bg-emerald-500/10 border-emerald-500/30",
        Weakening: "text-amber-400 bg-amber-500/10 border-amber-500/30",
        Improving: "text-blue-400 bg-blue-500/10 border-blue-500/30",
        Lagging: "text-red-400 bg-red-500/10 border-red-500/30",
      };

      return (
        <div className="space-y-4">
          <div className="bg-zinc-900 border border-zinc-800 rounded-lg p-4 flex flex-wrap items-center justify-between gap-3">
            <div>

    /* ============================================================
       SCREENER — AUTOMATED 10x-100x S-CURVE ALGORITHM
       ============================================================ */
    const S_CURVE_RULES = [
      { key: "s1", label: "1. S-Curve & Runway", desc: "เทรนด์ใหญ่โลกเลี่ยงไม่ได้ + อยู่ต้น S-Curve ลู่วิ่งโต 5-10 ปี" },
      { key: "s2", label: "2. Scalable Moat", desc: "ยิ่งโตยิ่งต้นทุนถูกลง + คูเมืองปกป้องธุรกิจ (Gross Margin สูง)" },
      { key: "s3", label: "3. Founder-Driven", desc: "บริหารด้วย Founder DNA กล้าเดิมพัน เน้นการเติบโตเชิงรุก" },
      { key: "s4", label: "4. Reality & Catalyst", desc: "ลูกค้ายอมจ่ายเงินจริง (รายได้โต) + มี Catalyst เร่งราคา" },
    ];

    function calculateAutoSCurve(entry) {
      if (!entry) return null;
      const { series, fundamentals, profile } = entry;
      if (!series || series.length < 20) return null;

      const cls = classify(series);
      
      const rawRevGrowth = pick(fundamentals, ["revenueGrowthTTMYoy", "revenueGrowth3Y", "revenueGrowthQuarterlyYoy"]);
      const revGrowthPct = rawRevGrowth == null ? null : (Math.abs(rawRevGrowth) < 3 ? rawRevGrowth * 100 : rawRevGrowth);

      const rawGrossMargin = pick(fundamentals, ["grossMarginTTM", "grossMarginAnnual"]);
      const grossMarginPct = rawGrossMargin == null ? null : (Math.abs(rawGrossMargin) < 3 ? rawGrossMargin * 100 : rawGrossMargin);

      const mktCap = (pick(fundamentals, ["marketCapitalization"]) || profile?.marketCapitalization || 0) * 1e6;
      const mktCapB = mktCap / 1e9;

      let s1 = 0;
      let s1Notes = [];
      if (revGrowthPct != null) {
        if (revGrowthPct >= 35) { s1 += 2; s1Notes.push(`รายได้โตจัด ${revGrowthPct.toFixed(1)}% YoY (Finnhub)`); }
        else if (revGrowthPct >= 15) { s1 += 1; s1Notes.push(`รายได้เติบโตดี ${revGrowthPct.toFixed(1)}% YoY (Finnhub)`); }
      }
      if (mktCapB > 0 && mktCapB <= 20) { s1 += 2; s1Notes.push(`Mkt Cap $${mktCapB.toFixed(1)}B (ลู่วิ่งยาว)`); }
      else if (mktCapB > 20 && mktCapB <= 100) { s1 += 1; s1Notes.push(`Mkt Cap $${mktCapB.toFixed(1)}B (Mid-Cap)`); }
      if (cls.trend === "Uptrend") { s1 += 1; s1Notes.push("กราฟ Uptrend หนุนเทรนด์ใหญ่ (TD)"); }
      s1 = Math.min(5, s1);

      let s2 = 0;
      let s2Notes = [];
      if (grossMarginPct != null) {
        if (grossMarginPct >= 65) { s2 += 3; s2Notes.push(`Gross Margin สูงมาก ${grossMarginPct.toFixed(1)}% (Finnhub)`); }
        else if (grossMarginPct >= 45) { s2 += 2; s2Notes.push(`Gross Margin แข็งแกร่ง ${grossMarginPct.toFixed(1)}% (Finnhub)`); }
        else if (grossMarginPct >= 25) { s2 += 1; s2Notes.push(`Gross Margin ${grossMarginPct.toFixed(1)}% (Finnhub)`); }
      } else { s2 += 1; }
      if (revGrowthPct != null && revGrowthPct > 20 && grossMarginPct > 50) {
        s2 += 2; s2Notes.push("Scalable Moat (รายได้โตขนาน Margin สูง)");
      } else if (grossMarginPct > 40) {
        s2 += 1; s2Notes.push("มี Pricing Power จาก Gross Margin");
      }
      s2 = Math.min(5, s2);

      let s3 = 0;
      let s3Notes = [];
      if (revGrowthPct != null && revGrowthPct >= 25) { s3 += 2; s3Notes.push("กล้าเดิมพัน R&D/การเติบโตเชิงรุก"); }
      if (mktCapB > 0 && mktCapB <= 50) { s3 += 2; s3Notes.push("โครงสร้างคล่องตัวสไตล์ Founder"); } else { s3 += 1; }
      if (cls.momentum === "Strong Bullish" || cls.momentum === "Bullish") {
        s3 += 1; s3Notes.push("วิสัยทัศน์ผู้บริหารหนุนความเชื่อมั่น (TD)");
      }
      s3 = Math.min(5, s3);

      let s4 = 0;
      let s4Notes = [];
      if (revGrowthPct != null && revGrowthPct > 0) { s4 += 2; s4Notes.push("มีลูกค้ายอมจ่ายเงินจริง (รายได้เป็นบวก)"); }
      if (cls.trend === "Uptrend") { s4 += 2; s4Notes.push("มี Catalyst ทางเทคนิค Uptrend (TD)"); }
      else if (cls.momentum === "Bullish" || cls.momentum === "Strong Bullish") { s4 += 1; s4Notes.push("แรงซื้อโมเมนตัมฟื้นตัว (TD)"); }
      if (cls.rsi > 50) { s4 += 1; s4Notes.push("RSI > 50 ตลาดเริ่มให้มูลค่า (TD)"); }
      s4 = Math.min(5, s4);

      const total = s1 + s2 + s3 + s4;
      return { s1, s2, s3, s4, total, notes: { s1: s1Notes, s2: s2Notes, s3: s3Notes, s4: s4Notes }, revGrowthPct, grossMarginPct, mktCapB };
    }

    function autoVerdict(total) {
      if (total >= 16) return { label: "🔥 ตัวเต็ง S-Curve 10x", style: "text-emerald-400 border-emerald-500/40 bg-emerald-500/10" };
      if (total >= 11) return { label: "👀 น่าจับตาเกณฑ์ผ่าน 60%+", style: "text-amber-400 border-amber-500/40 bg-amber-500/10" };
      return { label: "⚠️ ยังไม่เข้าเกณฑ์ S-Curve", style: "text-zinc-400 border-zinc-700 bg-zinc-800/40" };
    }

    function ScreenerRow({ symbol, entry }) {
      const [expanded, setExpanded] = useState(false);
      const { series, loading } = entry || {};

      const evalData = useMemo(() => calculateAutoSCurve(entry), [entry]);
      const cls = series && series.length > 20 ? classify(series) : null;

      if (loading && !evalData) {
        return (
          <div className="px-4 py-3 border-b border-zinc-800 text-xs text-zinc-500 flex items-center gap-2">
            <RefreshCw size={12} className="animate-spin" /> กำลังประเมินเกณฑ์ S-Curve สำหรับ {symbol}...
          </div>
        );
      }

      const totalScore = evalData ? evalData.total : 0;
      const verdict = autoVerdict(totalScore);

      return (
        <div className="border-b border-zinc-800 last:border-b-0">
          <button onClick={() => setExpanded((e) => !e)} className="w-full flex items-center gap-3 px-3 py-3 hover:bg-zinc-900/60 text-left transition">
            {expanded ? <ChevronDown size={14} className="text-zinc-500 shrink-0" /> : <ChevronRight size={14} className="text-zinc-500 shrink-0" />}
            
            <div className="flex items-center gap-3 min-w-[180px] sm:min-w-[240px] shrink-0">
              <StockLogo symbol={symbol} logoUrl={entry?.profile?.logo} size={28} />
              <div className="min-w-0">
                <div className="font-mono font-bold text-zinc-100 text-sm leading-tight">{symbol}</div>
                <div className="text-[11px] text-zinc-400 truncate max-w-[120px] sm:max-w-[180px] font-sans">
                  {getStockName(symbol, entry?.profile?.name)}
                </div>
              </div>
            </div>

            <div className="flex flex-wrap items-center gap-x-4 gap-y-1 text-[11px] sm:text-xs font-mono text-zinc-400 flex-1 min-w-[180px]">
              <span>รายได้โต: <strong className={evalData?.revGrowthPct >= 20 ? "text-emerald-400" : "text-zinc-200"}>{evalData?.revGrowthPct != null ? `${evalData.revGrowthPct.toFixed(1)}%` : "—"}</strong></span>
              <span>Margin: <strong className={evalData?.grossMarginPct >= 50 ? "text-emerald-400" : "text-zinc-200"}>{evalData?.grossMarginPct != null ? `${evalData.grossMarginPct.toFixed(1)}%` : "—"}</strong></span>
              <span>Mkt Cap: <strong className="text-zinc-200">{evalData?.mktCapB ? `$${evalData.mktCapB.toFixed(1)}B` : "—"}</strong></span>
            </div>

            {cls && (
              <span className={`text-[11px] px-2 py-0.5 rounded border shrink-0 ${TREND_STYLE[cls.trend]}`}>
                {TREND_TH[cls.trend]}
              </span>
            )}

            <div className="flex items-center gap-2 ml-auto shrink-0">
              <span className="font-mono text-base font-bold text-zinc-100 bg-zinc-950 px-2.5 py-0.5 rounded border border-zinc-800">
                {totalScore}<span className="text-xs font-normal text-zinc-500">/20</span>
              </span>
              <span className={`text-xs px-2.5 py-1 rounded border font-medium ${verdict.style}`}>
                {verdict.label}
              </span>
            </div>
          </button>

          {expanded && evalData && (
            <div className="px-4 pb-4 pt-2 bg-zinc-950/60 border-t border-zinc-800/60 space-y-3">
              <div className="text-xs text-zinc-400 flex items-center justify-between">
                <span>📊 ข้อมูลพื้นฐานหลัก (Key Fundamentals)</span>
                <span className="font-mono text-[11px] text-zinc-500">ที่มา: Finnhub / Twelve Data</span>
              </div>

              <div className="grid grid-cols-3 gap-2.5">
                <div className="bg-zinc-900 border border-zinc-800 rounded p-3">
                  <div className="text-[10px] text-zinc-500 mb-1">รายได้เติบโต YoY (Revenue Growth)</div>
                  <div className={`font-mono font-bold text-base sm:text-lg ${evalData.revGrowthPct >= 20 ? "text-emerald-400" : "text-zinc-100"}`}>
                    {evalData.revGrowthPct != null ? `${evalData.revGrowthPct.toFixed(1)}%` : "—"}
                  </div>
                </div>
                <div className="bg-zinc-900 border border-zinc-800 rounded p-3">
                  <div className="text-[10px] text-zinc-500 mb-1">Gross Margin</div>
                  <div className={`font-mono font-bold text-base sm:text-lg ${evalData.grossMarginPct >= 50 ? "text-emerald-400" : "text-zinc-100"}`}>
                    {evalData.grossMarginPct != null ? `${evalData.grossMarginPct.toFixed(1)}%` : "—"}
                  </div>
                </div>
                <div className="bg-zinc-900 border border-zinc-800 rounded p-3">
                  <div className="text-[10px] text-zinc-500 mb-1">Market Cap</div>
                  <div className="font-mono font-bold text-base sm:text-lg text-zinc-100">
                    {evalData.mktCapB ? `$${evalData.mktCapB.toFixed(1)}B` : "—"}
                  </div>
                </div>
              </div>

              <div className="text-xs text-zinc-400 flex items-center justify-between pt-1">
                <span>🔥 รายละเอียดการวิเคราะห์อัลกอริทึม S-Curve สแกนอัตโนมัติ:</span>
                <span className="font-mono text-[11px] text-zinc-500">Auto Score Breakdown</span>
              </div>

              <div className="grid sm:grid-cols-2 gap-2.5">
                {S_CURVE_RULES.map((rule) => {
                  const scoreKey = rule.key;
                  const scoreVal = evalData[scoreKey];
                  const notes = evalData.notes[scoreKey] || [];

                  return (
                    <div key={rule.key} className="bg-zinc-900 border border-zinc-800 rounded p-3">
                      <div className="flex items-center justify-between mb-1">
                        <span className="text-xs font-semibold text-zinc-200">{rule.label}</span>
                        <span className={`font-mono text-xs font-bold px-2 py-0.5 rounded ${scoreVal >= 4 ? "bg-emerald-500/20 text-emerald-400 border border-emerald-500/30" : "bg-zinc-800 text-zinc-300"}`}>
                          {scoreVal} / 5 คะแนน
                        </span>
                      </div>
                      <div className="text-[11px] text-zinc-500 mb-2">{rule.desc}</div>
                      
                      <div className="flex flex-wrap gap-1">
                        {notes.map((n, i) => (
                          <span key={i} className="text-[10px] bg-zinc-950 text-emerald-400 border border-emerald-500/20 px-1.5 py-0.5 rounded">
                            ✓ {n}
                          </span>
                        ))}
                        {notes.length === 0 && (
                          <span className="text-[10px] text-zinc-600 italic">ไม่พบตัวเร่งตามเกณฑ์ข้อนี้</span>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      );
    }
