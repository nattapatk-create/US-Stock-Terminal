      if (profileName && profileName.trim()) return profileName;
      if (symbol && STOCK_INFO_MAP[symbol.toUpperCase()]?.name) return STOCK_INFO_MAP[symbol.toUpperCase()].name;
      return symbol || "";
    }

    function getLogoUrls(symbol, profileLogo) {
      const list = [];
      if (profileLogo) list.push(profileLogo);
      if (symbol) {
        const cleanSym = symbol.toUpperCase();
        list.push(`https://assets.parqet.com/logos/symbol/${cleanSym}`);
        list.push(`https://images.financialmodelingprep.com/symbol/${cleanSym}.png`);
        if (STOCK_INFO_MAP[cleanSym]?.domain) {
          list.push(`https://logo.clearbit.com/${STOCK_INFO_MAP[cleanSym].domain}`);
        }
      }
      return list;
    }

    const StockLogo = React.memo(function StockLogo({ symbol, logoUrl, size = 24, className = "" }) {
      const [imgIdx, setImgIdx] = useState(0);
      const [failed, setFailed] = useState(false);

      const logoUrls = useMemo(() => getLogoUrls(symbol, logoUrl), [symbol, logoUrl]);

      useEffect(() => {
        setImgIdx(0);
        setFailed(false);
      }, [symbol, logoUrl]);

      const handleError = () => {
        if (imgIdx < logoUrls.length - 1) {
          setImgIdx((prev) => prev + 1);
        } else {
          setFailed(true);
        }
      };

      if (failed || !logoUrls[imgIdx]) {
        const char = symbol ? symbol.charAt(0).toUpperCase() : "?";
        return (
          <div
            style={{ width: `${size}px`, height: `${size}px`, minWidth: `${size}px` }}
            className={`rounded-full bg-zinc-800 border border-zinc-700 flex items-center justify-center font-mono font-bold text-zinc-300 text-[10px] select-none shrink-0 ${className}`}
            title={symbol}
          >
            {char}
          </div>
        );
      }

      return (
        <div
          style={{ width: `${size}px`, height: `${size}px`, minWidth: `${size}px` }}
          className={`rounded-full overflow-hidden bg-zinc-900 border border-zinc-800 flex items-center justify-center shrink-0 p-0.5 ${className}`}
        >
          <img
            src={logoUrls[imgIdx]}
            alt={symbol}
            onError={handleError}
            className="w-full h-full object-contain rounded-full"
            loading="lazy"
          />
        </div>
      );
    });

    function createQueue(getMinIntervalMs) {
      let last = 0;
      let chain = Promise.resolve();
      return (fn) => {
        const run = chain.then(async () => {
          const minIntervalMs = typeof getMinIntervalMs === "function" ? getMinIntervalMs() : getMinIntervalMs;
          const wait = Math.max(0, last + minIntervalMs - Date.now());
          if (wait > 0) await new Promise((r) => setTimeout(r, wait));
          last = Date.now();
          return fn();
        });
        chain = run.catch(() => {});
        return run;
      };
    }

        const data = await res.json();

    async function extractPortfolioFromImage(base64Data, mediaType, apiKey) {
      const res = await fetch(`${GEMINI_API_BASE}?key=${encodeURIComponent(apiKey)}`, {
        method: "POST",
        headers: {
          "content-type": "application/json"
        },
        body: JSON.stringify({
          contents: [
            {
              role: "user",
              parts: [
                { inline_data: { mime_type: mediaType, data: base64Data } },
                { text: PORTFOLIO_EXTRACT_PROMPT }
              ]
            }
          ],
          generationConfig: {
            maxOutputTokens: 32768,
            temperature: 0,
            thinkingConfig: {
              // gemini-3.x ใช้ thinkingLevel ไม่ใช่ thinkingBudget (แบบ gemini-2.5) — ส่ง thinkingBudget
              // ไปจะโดน 400 Request contains an invalid argument ทันที เพราะพารามิเตอร์ไม่ตรงกับรุ่นโมเดล
              // "low" คือระดับต่ำสุดที่ใช้ได้โดยไม่ต้องจัดการ thought signature เพิ่ม (ต่างจาก "minimal")
              thinkingLevel: "low"
            },
            // บังคับให้ Gemini ตอบเป็น JSON ล้วน ๆ ผ่าน structured output ของ API โดยตรง
            // แทนที่จะพึ่งแค่คำสั่งในพรอมต์ ป้องกันกรณีโมเดลแถมคำอธิบายหรือ markdown มาด้วย
            // จนทำให้ parse เป็น JSON ไม่ได้
            // หมายเหตุ: เคยลองใส่ responseSchema (ARRAY of OBJECT) เพิ่มเข้าไปด้วย แต่พบว่าโมเดลจะหยุด
            // สร้างรายการหลังจากได้แค่ 1 รายการแรกทุกครั้ง (เพราะ schema ไม่ได้กำหนด minItems ไว้ อาเรย์ 1
            // รายการก็ถือว่า "valid" ตาม schema แล้ว โมเดลเลยหยุดเร็วกว่าที่ควร) จึงตัด responseSchema ออก
            // เหลือแค่บังคับ mime type เป็น JSON พอ ให้พรอมต์ (ข้างล่าง) เป็นตัวกำหนดว่าต้องดึงให้ครบทุกแถว
            responseMimeType: "application/json"
          }
        })
      });

      if (!res.ok) {
        let detail = "";
        try {
          const errBody = await res.json();
          detail = errBody?.error?.message || "";
        } catch {}
        throw new Error(`Gemini API error (${res.status}) ${detail}`.trim());
      }

      const data = await res.json();
      const candidate = data?.candidates?.[0];
      const parts = candidate?.content?.parts || [];
      // ตัด part ที่เป็น "thought" (ความคิดระหว่างประมวลผล) ออก เอาเฉพาะข้อความคำตอบจริง
      const textParts = parts.filter((p) => typeof p.text === "string" && p.text.trim() && !p.thought);
      const raw0 = textParts.map((p) => p.text).join("\n").trim();

      if (!raw0) {
        const finishReason = candidate?.finishReason;
        if (finishReason === "MAX_TOKENS") {
          throw new Error("Gemini ตอบไม่ครบเพราะยาวเกินไป ลองใช้รูปที่มีรายการน้อยลงหรือครอปเฉพาะส่วนที่ต้องการ");
        }
        throw new Error("ไม่ได้รับข้อความตอบกลับจาก Gemini");
      }

      let raw = raw0.replace(/^```(?:json)?/i, "").replace(/```$/i, "").trim();
      const rawSnippet = raw.length > 300 ? `${raw.slice(0, 300)}…` : raw;

      let parsed;
      try {
        parsed = JSON.parse(raw);
      } catch (e) {
        // เผื่อ Gemini แถมข้อความอื่นมาด้วยนอกเหนือจาก JSON array ให้ลองตัดเอาเฉพาะช่วง [ ... ] ออกมา
        const start = raw.indexOf("[");
        const end = raw.lastIndexOf("]");
        if (start >= 0 && end > start) {
          try {
            parsed = JSON.parse(raw.slice(start, end + 1));
          } catch (e2) {
            throw new Error(`ไม่สามารถแปลงผลลัพธ์เป็น JSON ได้ (${e2.message}) — สิ่งที่ Gemini ตอบกลับมา: "${rawSnippet}"`);
          }
        } else {
          throw new Error(`ไม่สามารถแปลงผลลัพธ์เป็น JSON ได้ — สิ่งที่ Gemini ตอบกลับมา: "${rawSnippet}"`);
        }
      }
      if (!Array.isArray(parsed)) {
        throw new Error("รูปแบบข้อมูลที่ได้ไม่ถูกต้อง");
      }

      const todayStr = new Date().toISOString().slice(0, 10);
      const rows = parsed
        .map((r) => ({
          symbol: String(r.symbol || "").toUpperCase().trim(),
          action: String(r.action || "BUY").toUpperCase().trim() === "SELL" ? "SELL" : "BUY",
          shares: r.shares === null || r.shares === undefined || r.shares === "" ? null : parseFloat(r.shares),
          price: r.price === null || r.price === undefined || r.price === "" ? null : parseFloat(r.price),
          amount: r.amount === null || r.amount === undefined || r.amount === "" ? null : Math.abs(parseFloat(r.amount)),
          date: (typeof r.date === "string" && /^\d{4}-\d{2}-\d{2}$/.test(r.date.trim())) ? r.date.trim() : todayStr
        }))
        .map((r) => ({
          ...r,
          shares: Number.isFinite(r.shares) && r.shares > 0 ? r.shares : null,
          price: Number.isFinite(r.price) && r.price > 0 ? r.price : null,
          amount: Number.isFinite(r.amount) && r.amount > 0 ? r.amount : null
        }))
        .filter((r) => r.symbol);

      // finishReason "MAX_TOKENS" ที่นี่หมายความว่า Gemini ถูกตัดจบก่อนอ่านครบทุกแถวในภาพ
      // (structured output จะปิด JSON array ให้ถูกไวยากรณ์เสมอ ต่อให้ถูกตัดจบ จึง parse ผ่านได้
      // ทั้งที่ข้อมูลไม่ครบ — ต้องเช็ค finishReason แยกต่างหากถึงจะรู้)
      const truncated = candidate?.finishReason === "MAX_TOKENS";
      return { rows, truncated };
    }

    function symbolCacheKey(symbol) {
      return `us-dash-cache-${symbol}`;
    }
    function loadCachedEntry(symbol) {
      try {
        const raw = localStorage.getItem(symbolCacheKey(symbol));
        return raw ? JSON.parse(raw) : null;
      } catch {
        return null;
      }
    }
    function saveCachedEntry(symbol, { quote, series, timeframe, fundamentals, profile }) {
      try {
        localStorage.setItem(
          symbolCacheKey(symbol),
          JSON.stringify({ quote, series, timeframe, fundamentals, profile, cachedAt: Date.now() })
        );
      } catch (e) {
        console.error("cache save failed", e);
      }
    }

    // ระยะเวลาที่ถือว่าแคชยัง "สด" อยู่ — ข้อมูลเป็นกราฟรายสัปดาห์/รายวันเป็นหลัก จึงไม่จำเป็นต้อง
    // ยิง API ใหม่ทุกครั้งที่เปิดแอปหรือสแกนซ้ำภายในวันเดียวกัน ค่านี้ช่วยลดจำนวนการเรียก Twelve
    // Data / Finnhub ลงอย่างมากเมื่อผู้ใช้เปิด/ปิดแอปหรือกดสแกนซ้ำ ๆ ในช่วงเวลาสั้น ๆ
    const CACHE_TTL_MS = 6 * 60 * 60 * 1000; // 6 ชั่วโมง

    function isCacheEntryFresh(entry, timeframe, needsFundamentals) {
      if (!entry) return false;
      if (entry.timeframe !== timeframe) return false;
      if (!entry.series || entry.series.length < 20) return false;
      if (needsFundamentals && !entry.fundamentals) return false;
      const age = Date.now() - (entry.cachedAt || 0);
      return age >= 0 && age < CACHE_TTL_MS;
    }

    // ตัวนับจำนวนคำขอรายวันแบบ generic ใช้ร่วมกันทั้ง Twelve Data และ Finnhub เพื่อให้เห็น
    // "สัดส่วนภาระ" ของแต่ละ API ชัดเจน — เดิมมีแค่ตัวนับของ Twelve Data ตัวเดียว ทำให้มองไม่ออกว่า
    // Finnhub ถูกใช้งานคุ้มโควตาหรือไม่ (ส่วนใหญ่ปล่อยว่างขณะที่ Twelve Data ถูกรัดคอด้วย rate limit)
    function apiCounterKey(provider) {
      return `${provider}-calls-${new Date().toISOString().slice(0, 10)}`;
    }
    function bumpApiCalls(provider) {
      try {
        const k = apiCounterKey(provider);
        const next = (parseInt(localStorage.getItem(k), 10) || 0) + 1;
        localStorage.setItem(k, String(next));
        return next;
      } catch {
        return null;
      }
    }
    function getApiCallsToday(provider) {
      try {
        return parseInt(localStorage.getItem(apiCounterKey(provider)), 10) || 0;
      } catch {
        return 0;
      }
    }
    function bumpTdCalls() { return bumpApiCalls("td"); }
    function getTdCallsToday() { return getApiCallsToday("td"); }
    function bumpFhCalls() { return bumpApiCalls("fh"); }
    function getFhCallsToday() { return getApiCallsToday("fh"); }

    let sectorAutoScanned = false;

    /* ============================================================
       TECHNICAL ENGINE
       ============================================================ */
    // EMA แบบ "SMA-seeded" — มาตรฐานเดียวกับ StockCharts/แพลตฟอร์มกราฟหุ้นส่วนใหญ่:
    // ค่า EMA ตัวแรกที่คำนวณได้ = ค่าเฉลี่ยเลขคณิต (SMA) ของ `period` แท่งแรกที่มีข้อมูลครบ
    // จากนั้นจึงใช้สูตร EMA แบบวนซ้ำต่อจากจุดนั้น (ก่อนหน้านั้นเป็น null เพราะข้อมูลไม่พอ)
    // วิธีเดิม (seed = แท่งแรกสุดของราคาที่มี) ทำให้ EMA คลาดเคลื่อนจากค่าที่แพลตฟอร์มอื่นแสดง
    // มากในช่วงแรก และคลาดเคลื่อนต่อเนื่องไปเรื่อย ๆ โดยเฉพาะ EMA200 ถ้าข้อมูลย้อนหลังมีไม่มากพอ
    function ema(values, period) {
      const k = 2 / (period + 1);
      const out = new Array(values.length).fill(null);
      let count = 0, sum = 0, seedIdx = -1, prev = null;
      for (let i = 0; i < values.length; i++) {
        const v = values[i];
        if (v == null) { count = 0; sum = 0; continue; }
        if (seedIdx === -1) {
          count++; sum += v;
          if (count === period) {
            seedIdx = i;
            prev = sum / period; // seed = SMA ของ `period` แท่งแรกที่มีข้อมูลครบ
            out[i] = prev;
          }
          continue;
        }
        prev = v * k + prev * (1 - k);
        out[i] = prev;
      }
      return out;
    }

    function rsi(closes, period = 14) {
      const out = new Array(closes.length).fill(null);
      if (closes.length <= period) return out;
      let gainSum = 0, lossSum = 0;
      for (let i = 1; i <= period; i++) {
        const d = closes[i] - closes[i - 1];
        if (d >= 0) gainSum += d; else lossSum -= d;
      }
      let avgGain = gainSum / period, avgLoss = lossSum / period;
      out[period] = 100 - 100 / (1 + (avgLoss === 0 ? 100 : avgGain / avgLoss));
      for (let i = period + 1; i < closes.length; i++) {
        const d = closes[i] - closes[i - 1];
        const gain = d > 0 ? d : 0, loss = d < 0 ? -d : 0;
        avgGain = (avgGain * (period - 1) + gain) / period;
        avgLoss = (avgLoss * (period - 1) + loss) / period;
        const rs = avgLoss === 0 ? 100 : avgGain / avgLoss;
        out[i] = 100 - 100 / (1 + rs);
      }
      return out;
    }

    function macd(closes) {
      const e12 = ema(closes, 12), e26 = ema(closes, 26);
      const line = closes.map((_, i) => (e12[i] != null && e26[i] != null ? e12[i] - e26[i] : null));
      const signal = ema(line.map((v) => (v == null ? 0 : v)), 9);
      const hist = line.map((v, i) => (v != null && signal[i] != null ? v - signal[i] : null));
      return { line, signal, hist };
    }

    function findSwings(bars, window = 5) {
      const highs = [], lows = [];
      for (let i = window; i < bars.length - window; i++) {
        const slice = bars.slice(i - window, i + window + 1);
        if (bars[i].high === Math.max(...slice.map((b) => b.high))) highs.push({ price: bars[i].high, idx: i });
        if (bars[i].low === Math.min(...slice.map((b) => b.low))) lows.push({ price: bars[i].low, idx: i });
      }
      return { highs, lows };
    }

    function clusterLevels(points, tolerancePct, totalBars) {
      const sorted = [...points].sort((a, b) => a.price - b.price);
      const clusters = [];
      sorted.forEach((p) => {
        const last = clusters[clusters.length - 1];
        if (last && Math.abs(p.price - last.avg) / last.avg <= tolerancePct) {
          last.prices.push(p.price);
          last.idxs.push(p.idx);
          last.avg = last.prices.reduce((a, b) => a + b, 0) / last.prices.length;
        } else {
          clusters.push({ avg: p.price, prices: [p.price], idxs: [p.idx] });
        }
      });
      return clusters.map((c) => ({
        price: c.avg,
        touches: c.prices.length,
        strength: c.prices.length * 2 + (Math.max(...c.idxs) / totalBars),
      }));
    }

    function getSupportResistance(bars, currentPrice) {
      if (!bars || bars.length < 20) return { support: [], resistance: [] };
      const { highs, lows } = findSwings(bars, 5);
      const tolerance = 0.0002;

      const resistance = clusterLevels(highs, tolerance, bars.length)
        .filter((c) => c.price > currentPrice * 1.0001)
        .sort((a, b) => b.touches - a.touches || b.strength - a.strength)
        .slice(0, 3)
        .sort((a, b) => a.price - b.price);

      const support = clusterLevels(lows, tolerance, bars.length)
        .filter((c) => c.price < currentPrice * 0.9999)
        .sort((a, b) => b.touches - a.touches || b.strength - a.strength)
        .slice(0, 3)
        .sort((a, b) => a.price - b.price);

      return { support, resistance };
    }

    function classify(bars) {
      const closes = bars.map((b) => b.close);
      const last = closes.length - 1;
      const price = closes[last];
      const e20 = ema(closes, 20), e50 = ema(closes, 50), e200 = ema(closes, 200);
      const rsiArr = rsi(closes, 14);
      const { hist } = macd(closes);
      const rsiVal = rsiArr[last];
      const h = hist[last], hPrev = hist[last - 1];
      // เดิมเช็คแค่ closes.length > 200 (จำนวนแท่งทั้งหมด) ซึ่งไม่รับประกันว่า ema(closes,200)
      // จะคำนวณค่าออกมาได้จริง (ฟังก์ชัน ema แบบ SMA-seeded ต้องการ 200 แท่ง "ต่อเนื่องไม่มีช่องว่าง")
      // เช็คจากผลลัพธ์จริง e200[last] != null แม่นยำกว่าและกันเคส EMA200 เป็น null หลุดไปแสดงผลผิด
      const has200 = e200[last] != null;

      let trend = "Sideways", trendScore = 0;
      if (e20[last] != null && e50[last] != null) {
        const alignedUp = price > e20[last] && e20[last] > e50[last] && (!has200 || e50[last] > e200[last]);
        const alignedDown = price < e20[last] && e20[last] < e50[last] && (!has200 || e50[last] < e200[last]);
        if (alignedUp) { trend = "Uptrend"; trendScore = 2; }
        else if (price > e50[last]) { trend = "Uptrend"; trendScore = 1; }
        else if (alignedDown) { trend = "Downtrend"; trendScore = -2; }
        else if (price < e50[last]) { trend = "Downtrend"; trendScore = -1; }
      }

      let momentum = "Neutral";
      if (rsiVal != null && h != null && hPrev != null) {
        if (rsiVal > 60 && h > hPrev) momentum = "Strong Bullish";
        else if (rsiVal > 50 && h > 0) momentum = "Bullish";
        else if (rsiVal < 40 && h < hPrev) momentum = "Strong Bearish";
        else if (rsiVal < 50 && h < 0) momentum = "Bearish";
      }

      return { trend, trendScore, momentum, rsi: rsiVal, macdHist: h, e20: e20[last], e50: e50[last], e200: has200 ? e200[last] : null, price };
    }

    /* ============================================================
       API LAYER
       ============================================================ */
    // จำนวนแท่งที่ดึงต่อ Timeframe — เดิมใช้ 220 แท่งตายตัวทุก interval ซึ่งไม่พอสำหรับ EMA200
    // (ฟังก์ชัน ema ต้องเห็น 200 แท่งก่อนจะเริ่ม "seed" ได้ เหลือ margin แค่ ~20 แท่งให้ EMA200
    // ลู่เข้าค่าจริง ทำให้ตัวเลขคลาดเคลื่อนจากแพลตฟอร์มอื่นได้มาก) เพิ่ม buffer ให้มากพอ:
    // - 1day: 500 แท่ง (~200 แท่งสำหรับ seed + ~300 แท่ง buffer ให้ EMA200 ลู่เข้า)
    // - 1week: 300 แท่ง (~200 สัปดาห์สำหรับ seed + ~100 สัปดาห์ buffer)
    const OUTPUTSIZE_BY_INTERVAL = { "1day": 500, "1week": 300 };
    const MIN_BARS_FOR_FULL_INDICATORS = 20; // ต่ำกว่านี้ยังพอมองเทรนด์คร่าว ๆ ได้ แต่ EMA/RSI/MACD จะไม่ครบ

    function isTransientTdError(data, res) {
      const msg = (data?.message || "").toLowerCase();
      return res.status === 429 || data?.code === 429 ||
        msg.includes("run out of api credits") || msg.includes("too many requests") || msg.includes("limit");
    }

    async function fetchSeries(symbol, tdKey, interval = "1week", outputsize = null) {
      const size = outputsize || OUTPUTSIZE_BY_INTERVAL[interval] || 220;
      return tdQueue(async () => {
        bumpTdCalls();
        let data, res;
        for (let attempt = 0; attempt < 2; attempt++) {
          res = await fetch(`${TD_BASE}/time_series?symbol=${encodeURIComponent(symbol)}&interval=${interval}&outputsize=${size}&apikey=${tdKey}`);
          data = await res.json();
          if (data.values) break;
          // เจอ rate limit / credit หมดชั่วคราว → รอแล้วลองใหม่อีก 1 ครั้งก่อนจะฟ้อง error จริง ๆ
          // (ปัญหาเดิม: บางหุ้นสลับ TF แล้ว "กราฟไม่ขึ้น" เพราะโดน rate limit แล้วไม่ retry เลย)
          if (attempt === 0 && isTransientTdError(data, res)) {
            await new Promise((r) => setTimeout(r, tdMinIntervalMs * 2));
            continue;
          }
          break;
        }
        if (!data.values) {
          const reason = data.message || `ไม่พบข้อมูลราคาย้อนหลังของ ${symbol} ที่ Timeframe นี้ (Twelve Data)`;
          throw new Error(reason);
        }
        const bars = data.values.slice().reverse().map((v) => ({
          date: v.datetime, open: +v.open, high: +v.high, low: +v.low, close: +v.close, volume: +v.volume,
        }));
        if (bars.length < MIN_BARS_FOR_FULL_INDICATORS) {
          throw new Error(`${symbol}: มีข้อมูลย้อนหลังที่ Timeframe นี้แค่ ${bars.length} แท่ง (ต้องการอย่างน้อย ${MIN_BARS_FOR_FULL_INDICATORS} แท่งขึ้นไปจึงจะคำนวณแนวรับ/แนวต้าน/EMA/RSI/MACD ได้)`);
        }
        return bars;
      });
    }

    // เดิม fetchQuote() ยิง Twelve Data /quote แยกต่างหาก (เปลือง credit ซ้ำซ้อนกับ /time_series
    // ที่ยิงอยู่แล้ว) — ตอนนี้คำนวณ "quote" จากแท่งราคาล่าสุดใน series แทน ทำให้แต่ละสัญลักษณ์
    // ใช้ Twelve Data credit เหลือแค่ 1 ครั้ง/รอบ (จากเดิม 2 ครั้ง) เร็วขึ้น ~2 เท่า และประหยัด
    // โควตาลงครึ่งหนึ่งโดยไม่เสียข้อมูลที่หน้าจอใช้จริง (close, percent_change, volume)
    function deriveQuoteFromSeries(series) {
      if (!series || series.length === 0) return null;
      const last = series[series.length - 1];
      const prev = series.length > 1 ? series[series.length - 2] : null;
      const prevClose = prev ? prev.close : last.open;
      const percentChange = prevClose ? ((last.close - prevClose) / prevClose) * 100 : 0;
      return {
        close: last.close,
        percent_change: percentChange,
        open: last.open,
        high: last.high,
        low: last.low,
        previous_close: prevClose,
        volume: last.volume ?? null,
      };
    }

    // เก็บ fetchQuote ไว้เผื่ออนาคตต้องการราคาสด real-time แยกจากกราฟ แต่ตอน initial/refresh
    // load ปกติจะไม่เรียกใช้แล้ว (ดู loadSymbol/loadSeries ด้านล่าง) — ใช้เป็น fallback สุดท้าย
    // เมื่อไม่มี Finnhub key เท่านั้น (ดู fetchQuoteBalanced ด้านล่าง)
    async function fetchQuote(symbol, tdKey) {
      return tdQueue(async () => {
        bumpTdCalls();
        const res = await fetch(`${TD_BASE}/quote?symbol=${encodeURIComponent(symbol)}&apikey=${tdKey}`);
        const data = await res.json();
        if (data.status === "error" || !data.close) throw new Error(data.message || "ดึงราคาล่าสุดจาก Twelve Data ไม่สำเร็จ");
        return {
          close: +data.close,
          percent_change: +data.percent_change,
          open: +data.open,
          high: +data.high,
          low: +data.low,
          previous_close: +data.previous_close,
          volume: data.volume ? +data.volume : null,
        };
      });
    }

    // ============================================================
    // จุดสมดุลภาระระหว่าง Twelve Data กับ Finnhub
    // ------------------------------------------------------------
    // เดิม "ราคาล่าสุด" (quote) ถูกคำนวณจากแท่งราคาใน series ที่ดึงจาก Twelve Data เท่านั้น
    // (deriveQuoteFromSeries) ทำให้ทุกครั้งที่อยากได้ราคาสดขึ้น ต้องยิง /time_series ของ
    // Twelve Data ใหม่ทั้งเส้น (แพงและช้าเพราะโดน rate limit เข้ม ~8 คำขอ/นาทีในแผนฟรี) ทั้งที่
    // Finnhub มีเอนด์พอยต์ /quote ที่เบามาก คืนแค่ราคาล่าสุด/เปลี่ยนแปลง% และโควตาฟรีสูงกว่ามาก
    // (~60 คำขอ/นาที) แต่กลับแทบไม่ถูกใช้เลยนอกจากตอนดึง fundamentals ของหุ้นที่ผ่านเกณฑ์แล้ว
    //
    // fetchQuoteBalanced() คือจุดตัดสินใจกลางว่า "ราคาล่าสุด" ควรมาจากไหน โดยเรียงลำดับ:
    //   1) มี Finnhub key → ใช้ Finnhub /quote (เบา เร็ว ไม่แตะโควตา Twelve Data เลย)
    //   2) ไม่มี Finnhub key แต่มี series สดอยู่แล้ว → คำนวณจาก series เดิม (ไม่ยิง API เพิ่ม)
    //   3) ไม่มีทั้งคู่ → ยิง Twelve Data /quote เป็นทางเลือกสุดท้ายเท่านั้น
    // ผลคือภาระการ "รีเฟรชราคา" ส่วนใหญ่ย้ายไปอยู่ที่ Finnhub ซึ่งมีโควตาเหลือเฟือ เหลือให้
    // Twelve Data ทำหน้าที่เดียวที่มันจำเป็นจริง ๆ คือดึงแท่งราคาย้อนหลัง (candles) สำหรับคำนวณ
    // แนวรับ/แนวต้าน/EMA/RSI/MACD เท่านั้น ซึ่งไม่จำเป็นต้องอัปเดตถี่เท่าราคาล่าสุด
    async function fetchFinnhubQuote(symbol, fhKey) {
      return fhQueue(async () => {
        bumpFhCalls();
        const res = await fetch(`${FH_BASE}/quote?symbol=${encodeURIComponent(symbol)}&token=${fhKey}`);
        const data = await res.json();
        // Finnhub คืน c=0 เมื่อไม่พบสัญลักษณ์ หรือ error/limit — ถือว่าใช้ไม่ได้ ให้ผู้เรียก fallback ต่อ
        if (data == null || !data.c) throw new Error("ดึงราคาล่าสุดจาก Finnhub ไม่สำเร็จ");
        return {
          close: +data.c,
          percent_change: data.dp != null ? +data.dp : (data.pc ? ((data.c - data.pc) / data.pc) * 100 : 0),
          open: +data.o,
          high: +data.h,
          low: +data.l,
          previous_close: +data.pc,
          volume: null, // Finnhub /quote แผนฟรีไม่มี volume — จะคง volume เดิมจาก series ไว้แทน (ดูผู้เรียก)
        };
      });
    }

    async function fetchQuoteBalanced(symbol, { tdKey, fhKey, fallbackSeries } = {}) {
      const fh = (fhKey || "").trim();
      if (fh) {
        try {
          const q = await fetchFinnhubQuote(symbol, fh);
          // Finnhub ไม่ให้ volume มา ถ้ามี series เดิมอยู่ ใช้ volume แท่งล่าสุดของ series เสริมให้ครบ
          const lastVol = fallbackSeries && fallbackSeries.length ? fallbackSeries[fallbackSeries.length - 1].volume : null;
          return { ...q, volume: q.volume ?? lastVol ?? null, source: "finnhub" };
        } catch (e) {
          console.warn(`Finnhub quote ล้มเหลวสำหรับ ${symbol}, fallback ไปทาง series/Twelve Data:`, e.message);
        }
      }
      if (fallbackSeries && fallbackSeries.length) {
        return { ...deriveQuoteFromSeries(fallbackSeries), source: "series" };
      }
      const td = (tdKey || "").trim();
      if (td) {
        const q = await fetchQuote(symbol, td);
        return { ...q, source: "twelvedata" };
      }
      return null;
    }

       ============================================================ */
    const UNIVERSE_CACHE_KEY = "us-dash-global-universe-v1";
    const UNIVERSE_CACHE_TTL_MS = 24 * 60 * 60 * 1000; // 24 ชั่วโมง

    // ประเทศ/ภูมิภาคหลักที่ใช้ดึงรายชื่อหุ้น — ครอบคลุมอเมริกาเหนือ ยุโรป เอเชีย โอเชียเนีย ลาตินอเมริกา
    const UNIVERSE_COUNTRIES = [
      "United States", "Canada", "United Kingdom", "Germany", "France",
      "Japan", "China", "India", "South Korea", "Taiwan",
      "Singapore", "Australia", "Brazil", "Netherlands", "Switzerland",
    ];
    const COUNTRY_NAME_TO_CODE = {
      "United States": "US", "Canada": "CA", "United Kingdom": "GB", "Germany": "DE",
      "France": "FR", "Japan": "JP", "China": "CN", "India": "IN", "South Korea": "KR",

    async function fetchStocksByCountry(country, tdKey) {
      return tdQueue(async () => {
        bumpTdCalls(); // นับเป็น 1 เครดิตต่อคำขอ (ไม่ใช่ต่อสัญลักษณ์) — ได้หุ้นนับพันตัวในราคาถูกมาก
        const res = await fetch(
          `${TD_BASE}/stocks?type=${encodeURIComponent("Common Stock")}&country=${encodeURIComponent(country)}&apikey=${tdKey}`
        );

    // ดึง+รวมรายชื่อหุ้นจริงจากหลายประเทศ พร้อมแคช 24 ชม. เพื่อไม่ต้องยิงซ้ำทุกครั้งที่เปิดแอป
    async function fetchGlobalUniverse(tdKey) {
      try {
        const raw = localStorage.getItem(UNIVERSE_CACHE_KEY);
        if (raw) {
          const cached = JSON.parse(raw);
          const age = Date.now() - (cached.cachedAt || 0);
          if (age >= 0 && age < UNIVERSE_CACHE_TTL_MS && Array.isArray(cached.items) && cached.items.length > 0) {
            return cached.items;
          }
        }
      } catch {
        /* แคชเสีย ข้ามไปดึงใหม่ */
      }

      if (!tdKey) return [];

      const collected = [];
      const seen = new Set();
      for (const country of UNIVERSE_COUNTRIES) {
        try {
          const rows = await fetchStocksByCountry(country, tdKey);
          rows.forEach((item) => {
            const sym = item.symbol;
            // ตัดสัญลักษณ์ที่มีจุด/เว้นวรรค/สแลช (มักเป็นหุ้นบุริมสิทธิ, คลาสพิเศษ, ใบสำคัญแสดงสิทธิ) เพื่อความเรียบง่าย
            if (!sym || /[.\s/]/.test(sym) || seen.has(sym)) return;
            seen.add(sym);
            collected.push({
              symbol: sym,
              country: COUNTRY_NAME_TO_CODE[item.country] || item.country || COUNTRY_NAME_TO_CODE[country] || country,
              sector: null,
              catalyst: null,
            });
          });
        } catch (e) {
          console.warn(`โหลดรายชื่อหุ้นจากประเทศ ${country} ไม่สำเร็จ:`, e);
        }
      }

      try {
        localStorage.setItem(UNIVERSE_CACHE_KEY, JSON.stringify({ items: collected, cachedAt: Date.now() }));
      } catch (e) {
        console.error("บันทึกแคชรายชื่อหุ้นทั่วโลกไม่สำเร็จ", e);
      }
      return collected;
    }

    function pick(obj, keys) {
      if (!obj) return null;
      for (const k of keys) if (obj[k] != null && !Number.isNaN(obj[k])) return obj[k];

    const fmtPrice = (n) => (n == null || isNaN(n) ? "—" : n.toFixed(2));
    const fmtPct = (n) => (n == null || isNaN(n) ? "—" : `${n >= 0 ? "+" : ""}${n.toFixed(2)}%`);
    const fmtBig = (n) => {
      if (n == null || isNaN(n)) return "—";
      const abs = Math.abs(n);
      if (abs >= 1e12) return (n / 1e12).toFixed(2) + "T";
      if (abs >= 1e9) return (n / 1e9).toFixed(2) + "B";
      if (abs >= 1e6) return (n / 1e6).toFixed(2) + "M";
      return n.toLocaleString();
    };

    // (เดิมแอปมี timestamp เก็บอยู่แล้ว (cachedAt/scannedAt) แต่ไม่เคยแสดงผลบน UI เลย)
    function formatRelativeTime(ts) {
      if (!ts) return null;
      const diffMs = Date.now() - ts;
      if (diffMs < 0) return "เมื่อสักครู่";
      const sec = Math.floor(diffMs / 1000);
      if (sec < 15) return "เมื่อสักครู่";
      if (sec < 60) return `${sec} วินาทีที่แล้ว`;
      const min = Math.floor(sec / 60);
      if (min < 60) return `${min} นาทีที่แล้ว`;
      const hr = Math.floor(min / 60);
      if (hr < 24) return `${hr} ชั่วโมงที่แล้ว`;
      const day = Math.floor(hr / 24);
      return `${day} วันที่แล้ว`;
    }

      { symbol: "AMT", country: "US", sector: "Real Estate", catalyst: "เสาสัญญาณโทรคมนาคมรองรับการขยายเครือข่าย 5G" },
      { symbol: "EQIX", country: "US", sector: "Real Estate", catalyst: "ศูนย์ข้อมูลระดับโลกรองรับความต้องการ AI Cloud" },
      { symbol: "NEE", country: "US", sector: "Utilities", catalyst: "สาธารณูปโภคไฟฟ้าและพลังงานหมุนเวียนรายใหญ่ของสหรัฐฯ" }
    ];

    // กำหนดการสแกน:
    // 1. แนะนำสุดท้าย 10 ตัว
    // 2. Strong Bullish เท่านั้น (Uptrend + Strong Bullish Momentum)
    // 3. Pool หุ้นทั่วโลกสูงสุด 2,000 ตัว (ผสม Pool คัดสรร TRENDING_UNIVERSE + Pool หุ้นจริงจาก
    //    Twelve Data ครอบคลุมหลายประเทศ/sector/ขนาดกิจการ ดู fetchGlobalUniverse ด้านบน)
    // 4. สแกนจนพบหุ้นที่เข้าเกณฑ์ครบ SCAN_BUFFER ตัวแล้วให้ "หยุดสแกนทันที" (Fast Stop) — เผื่อ
    //    ตัวเลือกไว้มากกว่า 10 เล็กน้อยเพื่อให้คัดกรอง 10 ตัวสุดท้ายแบบคละ Small/Mid/Large Cap ได้จริง
    //    (เดิมมีบั๊ก: เช็คผลลัพธ์จาก state/ref ที่อัปเดตช้ากว่ารอบสแกน ทำให้นับจำนวนที่เจอผิดพลาด
    //    และสแกนไม่ยอมหยุดแม้เจอครบแล้ว — แก้โดยใช้ค่าที่ loadSymbol() คืนกลับมาโดยตรงแทน)
    const WEEKLY_PICK_COUNT = 10;
    const SCAN_BUFFER = 30;
    const MAX_SCAN_POOL = 2000;
    // เก็บ "ผลสแกน" (ลิสต์หุ้นที่เข้าเกณฑ์) ของแต่ละสัปดาห์ไว้ใน localStorage โดยคีย์ด้วย weekKey
    // เพื่อให้สแกนพูลทั้งหมดแค่ "ครั้งเดียวต่อสัปดาห์" — เปิดเว็บใหม่หรือสลับแท็บกี่ครั้งก็ตาม
    // จะไม่ไล่สแกนพูลซ้ำอีก จนกว่าจะขึ้นสัปดาห์ใหม่ (weekKey เปลี่ยน) ถึงจะสแกนชุดใหม่โดยอัตโนมัติ
    const WEEKLY_PICKS_STORE_KEY = "us-dash-weekly-picks-v1";

    function isWeeklyPickEligible(cls) {
      if (!cls) return false;
      // ยึดเกณฑ์เดิม: ขาขึ้น (Uptrend) และ โมเมนตัมบวกแรงเท่านั้น (Strong Bullish Only!)
      return cls.trend === "Uptrend" && cls.momentum === "Strong Bullish";
    }

    function getCapTier(mktCapB) {
      if (!mktCapB || mktCapB <= 0) return null;
      if (mktCapB >= 10) return "Large";
      if (mktCapB >= 2) return "Mid";
      return "Small";
    }
    const CAP_TIER_TH = { Large: "Large Cap", Mid: "Mid Cap", Small: "Small Cap" };
    const CAP_TIER_STYLE = {
      Large: "text-blue-300 bg-blue-500/10 border-blue-500/30",
      Mid: "text-purple-300 bg-purple-500/10 border-purple-500/30",
      Small: "text-pink-300 bg-pink-500/10 border-pink-500/30",
    };

    function getWeeklyRotationOrder(weekKeyStr, poolArr) {
      const dateObj = weekKeyStr ? new Date(weekKeyStr) : new Date();
      const weekKey = Math.floor(dateObj.getTime() / (1000 * 60 * 60 * 24 * 7));
      const pool = (poolArr && poolArr.length ? poolArr : TRENDING_UNIVERSE).slice(0, MAX_SCAN_POOL);
      const poolLen = pool.length;
      if (poolLen === 0) return [];
      const start = weekKey % poolLen;
      return Array.from({ length: poolLen }, (_, i) => pool[(start + i) % poolLen]);
    }

    /* ============================================================
       RECOMMENDED STOCK CARD + CAROUSEL
       ============================================================ */
    function RecommendedStockCard({ rec, idx, alreadyAdded, onAdd }) {
      const isUp = rec.quote ? +rec.quote.percent_change >= 0 : true;
      return (
        <div
          className="group relative w-[248px] sm:w-[264px] shrink-0 snap-start bg-zinc-900 border border-zinc-800 hover:border-amber-500/50 rounded-xl p-3.5 flex flex-col justify-between transition-all duration-200 hover:-translate-y-1 hover:shadow-lg hover:shadow-amber-500/10"
        >
          <div className="absolute -top-2.5 -left-2.5 w-7 h-7 rounded-full bg-gradient-to-br from-amber-400 to-amber-600 text-zinc-950 text-[11px] font-extrabold flex items-center justify-center shadow-md shadow-amber-500/30 ring-2 ring-zinc-950">
            {idx + 1}
          </div>
          <div>
            <div className="flex items-start justify-between gap-1.5 mb-2.5 pl-1">
              <div className="flex items-center gap-2">
                <StockLogo symbol={rec.symbol} logoUrl={rec.profile?.logo} size={30} />
                <div>
                  <div className="flex items-center gap-1.5">
                    <span title={rec.countryMeta?.name}>{rec.countryMeta?.flag}</span>
                    <span className="font-mono font-bold text-sm text-zinc-100">{rec.symbol}</span>
                  </div>
                  <div className="text-[10px] text-zinc-400 truncate max-w-[130px]">
                    {getStockName(rec.symbol, rec.profile?.name)}
                  </div>
                </div>
              </div>
            </div>

            {rec.quote && (
              <div className="font-mono mb-2.5 flex items-baseline gap-1.5">
                <span className="text-lg font-bold text-zinc-100">${fmtPrice(+rec.quote.close)}</span>
                <span className={`text-[11px] font-bold px-1.5 py-0.5 rounded ${isUp ? "text-emerald-400 bg-emerald-500/10" : "text-red-400 bg-red-500/10"}`}>
                  {isUp ? "▲" : "▼"} {fmtPct(+rec.quote.percent_change)}
                </span>
              </div>
            )}

            <div className="mb-2 flex flex-wrap gap-1">
              <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded border ${TREND_STYLE[rec.cls.trend]}`}>
                {TREND_TH[rec.cls.trend]}
              </span>
              <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded border ${MOM_STYLE[rec.cls.momentum]}`}>
                {MOM_TH[rec.cls.momentum]}
              </span>
              {rec.capTier && (
                <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded border ${CAP_TIER_STYLE[rec.capTier]}`}>
                  {CAP_TIER_TH[rec.capTier]}
                </span>
              )}
            </div>
            <div className="text-[9px] text-zinc-500 mb-2.5">
              {rec.countryMeta?.name} ({rec.region}) • RSI {rec.cls.rsi != null ? rec.cls.rsi.toFixed(1) : "—"}
              {rec.mktCapB > 0 && <> • Mkt Cap ${rec.mktCapB.toFixed(1)}B</>}
            </div>

            <div className="bg-zinc-950/80 border border-zinc-800/80 rounded-lg p-2.5 text-[10px] text-zinc-300 min-h-[54px]">
              <div className="text-amber-400 font-bold mb-0.5 flex items-center gap-1">💡 Catalyst</div>
              <div className="line-clamp-3">{rec.catalyst}</div>
            </div>
          </div>

          <div className="pt-2.5 mt-2.5 border-t border-zinc-800">
            <button
              onClick={() => onAdd(rec.symbol)}
              disabled={alreadyAdded}
              className="w-full py-1.5 bg-blue-600/20 hover:bg-blue-600/30 disabled:opacity-50 disabled:cursor-not-allowed text-blue-400 border border-blue-500/30 rounded-lg text-[11px] font-semibold flex items-center justify-center gap-1 transition"
            >
              {alreadyAdded ? "อยู่ใน Watchlist แล้ว" : (<><Plus size={12} /> เพิ่มเข้า Watchlist</>)}
            </button>
          </div>
        </div>
      );
    }

    function RecommendedCarousel({ items, symbols, onAdd }) {
      const trackRef = useRef(null);
      const [canLeft, setCanLeft] = useState(false);
      const [canRight, setCanRight] = useState(true);
      const [activeDot, setActiveDot] = useState(0);

      const updateScrollState = useCallback(() => {
        const el = trackRef.current;
        if (!el) return;
        setCanLeft(el.scrollLeft > 4);
        setCanRight(el.scrollLeft < el.scrollWidth - el.clientWidth - 4);
        const cardW = el.firstChild ? el.firstChild.getBoundingClientRect().width + 12 : 1;
        setActiveDot(Math.round(el.scrollLeft / cardW));
      }, []);

      useEffect(() => {
        updateScrollState();
      }, [items, updateScrollState]);

      const scrollByCards = (dir) => {
        const el = trackRef.current;
        if (!el) return;
        const cardW = el.firstChild ? el.firstChild.getBoundingClientRect().width + 12 : 260;
        el.scrollBy({ left: dir * cardW * 2, behavior: "smooth" });
      };

      const scrollToIndex = (i) => {
        const el = trackRef.current;
        if (!el || !el.children[i]) return;
        el.children[i].scrollIntoView({ behavior: "smooth", block: "nearest", inline: "start" });
      };

      return (
        <div className="relative">
          <button
            onClick={() => scrollByCards(-1)}
            disabled={!canLeft}
            aria-label="เลื่อนซ้าย"
            className="hidden sm:flex items-center justify-center absolute -left-3 top-1/2 -translate-y-1/2 z-10 w-8 h-8 rounded-full bg-zinc-900 border border-zinc-700 text-zinc-300 shadow-lg shadow-black/40 hover:bg-zinc-800 hover:text-amber-400 disabled:opacity-0 disabled:pointer-events-none transition"
          >
            <ChevronLeft size={16} />
          </button>
          <button
            onClick={() => scrollByCards(1)}
            disabled={!canRight}
            aria-label="เลื่อนขวา"
            className="hidden sm:flex items-center justify-center absolute -right-3 top-1/2 -translate-y-1/2 z-10 w-8 h-8 rounded-full bg-zinc-900 border border-zinc-700 text-zinc-300 shadow-lg shadow-black/40 hover:bg-zinc-800 hover:text-amber-400 disabled:opacity-0 disabled:pointer-events-none transition"
          >
            <ChevronRight size={16} />
          </button>

          <div
            ref={trackRef}
            onScroll={updateScrollState}
            className="flex gap-3 overflow-x-auto no-scrollbar snap-x-mandatory scroll-pl-1 pb-1 pt-2.5 px-1"
          >
            {items.map((rec, idx) => (
              <RecommendedStockCard
                key={rec.symbol}
                rec={rec}
                idx={idx}
                alreadyAdded={symbols.includes(rec.symbol)}
                onAdd={onAdd}
              />
            ))}
          </div>

          {items.length > 1 && (
            <div className="flex items-center justify-center gap-1.5 mt-3">
              {items.map((rec, i) => (
                <button
                  key={rec.symbol}
                  onClick={() => scrollToIndex(i)}
                  aria-label={`ไปที่หุ้น #${i + 1}`}
                  className={`h-1.5 rounded-full transition-all ${i === activeDot ? "w-5 bg-amber-400" : "w-1.5 bg-zinc-700 hover:bg-zinc-600"}`}
                />
              ))}
            </div>
          )}
        </div>
      );
    }

    function WeeklyRecommendedPanel({ tdKey, fhKey, dataMap, loadSymbol, loadFundamentalsOnly, symbols, onAdd }) {
      const [loading, setLoading] = useState(false);
      const [scanProgress, setScanProgress] = useState({ done: 0, total: 0, found: 0 });
      // Pool เริ่มต้นด้วยลิสต์คัดสรร (TRENDING_UNIVERSE) ใช้งานได้ทันที ระหว่างรอโหลด Pool หุ้นทั่วโลก
      // จริงจาก Twelve Data (ดึงครั้งเดียว แคช 24 ชม. — ดู fetchGlobalUniverse) มาผสมเพิ่มเป็น ~2,000 ตัว
      const [universe, setUniverse] = useState(TRENDING_UNIVERSE);
      const [universeReady, setUniverseReady] = useState(false);

      useEffect(() => {
        let cancelled = false;
        if (!tdKey) return undefined;
        (async () => {
          const dynamic = await fetchGlobalUniverse(tdKey);
          if (cancelled || dynamic.length === 0) return;
          const seen = new Set(TRENDING_UNIVERSE.map((s) => s.symbol));
          const merged = [...TRENDING_UNIVERSE];
          for (const item of dynamic) {
            if (merged.length >= MAX_SCAN_POOL) break;
            if (seen.has(item.symbol)) continue;
            seen.add(item.symbol);
            merged.push(item);
          }
          setUniverse(merged);
          setUniverseReady(true);
        })();
        return () => { cancelled = true; };
      }, [tdKey]);

      const today = useMemo(() => {
        const d = new Date();
        const formattedDate = d.toISOString().slice(0, 10);
        const dayOfWeek = d.getDay();
        const diffToMonday = (dayOfWeek + 6) % 7;
        const monday = new Date(d);
        monday.setDate(d.getDate() - diffToMonday);
        const sunday = new Date(monday);
        sunday.setDate(monday.getDate() + 6);
        const weekKey = monday.toISOString().slice(0, 10);
        return {
          date: formattedDate,
          weekKey,
          displayDate: `${monday.toLocaleDateString("th-TH", { day: "numeric", month: "short" })} - ${sunday.toLocaleDateString("th-TH", { day: "numeric", month: "short", year: "numeric" })}`,
          rotation: getWeeklyRotationOrder(weekKey, universe),
        };
      }, [universe]);

      const scanCandidates = useCallback(async () => {
        if (!tdKey) return;
        setLoading(true);
        const rotationPool = today.rotation;

        try {
          // เช็คก่อนเสมอว่าสัปดาห์นี้ (weekKey ปัจจุบัน) เคยสแกนอัตโนมัติจนได้ผลลัพธ์แล้วหรือยัง
          // (เก็บไว้ใน localStorage) — ถ้าเคยแล้ว ให้ใช้ชุดหุ้นเดิมที่ "ล็อก" ไว้ทันที โดยไม่ไล่สแกน
          // พูลทั้งหมดซ้ำอีกเลย (สแกนแค่ครั้งเดียวต่อสัปดาห์จริง ๆ ไม่มีปุ่มให้กดสแกนซ้ำเองแล้ว)
          const locked = await loadStore(WEEKLY_PICKS_STORE_KEY, null);
          if (locked && locked.weekKey === today.weekKey && Array.isArray(locked.symbols) && locked.symbols.length > 0) {
            setScanProgress({ done: locked.symbols.length, total: locked.symbols.length, found: locked.symbols.length });
            await Promise.all(
              locked.symbols.map((sym) => loadSymbol(sym, true, DEFAULT_TIMEFRAME, { skipFundamentals: true }))
            );
            if (fhKey && loadFundamentalsOnly) {
              await Promise.all(locked.symbols.map((sym) => loadFundamentalsOnly(sym)));
            }
            return;
          }

          setScanProgress({ done: 0, total: rotationPool.length, found: 0 });

          let doneCount = 0;
          let foundCount = 0;
          const foundSymbols = [];

          // รอบที่ 1: เช็คเฉพาะหุ้นที่มีข้อมูล (series) แคชสดอยู่ในเครื่องแล้ว — ไม่ต้องยิง API เลย
          for (const item of rotationPool) {
            const cached = dataMap[item.symbol];
            if (cached && cached.series && cached.series.length >= 20) {
              const cls = classify(cached.series);
              if (isWeeklyPickEligible(cls)) foundSymbols.push(item.symbol);
            }
          }
          foundCount = foundSymbols.length;

          // หากพบครบตามเป้า (SCAN_BUFFER) จากแคชอยู่แล้ว ไม่ต้องสแกนเพิ่มเลย
          if (foundCount < SCAN_BUFFER) {
            // รอบที่ 2: ไล่สแกนทีละตัวเฉพาะที่ยังไม่มีข้อมูล/ข้อมูลเก่า โดย "ข้ามการดึงข้อมูล
            // พื้นฐาน (Finnhub) ระหว่างสแกน" เพื่อประหยัดโควตา Finnhub อย่างมาก (เดิมยิง Finnhub
            // ทุกตัวที่สแกนแม้จะไม่ผ่านเกณฑ์ก็ตาม) — จะไปดึงเฉพาะตัวที่ผ่านเกณฑ์ในรอบถัดไปแทน
            const foundSet = new Set(foundSymbols);
            for (const item of rotationPool) {
              if (foundCount >= SCAN_BUFFER) {
                console.log(`[Scanner] พบหุ้นเข้าเกณฑ์ครบ ${SCAN_BUFFER} ตัวแล้ว หยุดการสแกนทันที (ประหยัดโควตา API)`);
                break;
              }
              if (foundSet.has(item.symbol)) { doneCount++; continue; }

              const cachedFresh = dataMap[item.symbol];
              const alreadyFresh = cachedFresh && !cachedFresh.stale && cachedFresh.series && cachedFresh.series.length >= 20;

              // จุดที่แก้บั๊กสำคัญ: เดิมโค้ดอ่านผลลัพธ์จาก dataMap/ref ของ React ทันทีหลัง await ซึ่ง
              // อาจยังอัปเดตไม่ทันภายในรอบ loop เดียวกัน (state update เป็น async) ทำให้นับจำนวนที่
              // เจอผิดพลาดและสแกนไม่ยอมหยุดแม้เจอครบแล้ว — ตอนนี้ใช้ค่าที่ loadSymbol() "คืนกลับมา
              // โดยตรง" แทน จึงได้ข้อมูลล่าสุดที่ถูกต้องเสมอ
              const entry = alreadyFresh
                ? cachedFresh
                : await loadSymbol(item.symbol, true, DEFAULT_TIMEFRAME, { skipFundamentals: true });

              if (entry && entry.series && entry.series.length >= 20) {
                const cls = classify(entry.series);
                if (isWeeklyPickEligible(cls)) {
                  foundSet.add(item.symbol);
                  foundSymbols.push(item.symbol);
                  foundCount++;
                }
              }

              doneCount++;
              setScanProgress({ done: doneCount, total: rotationPool.length, found: foundCount });
            }
          } else {
            setScanProgress({ done: rotationPool.length, total: rotationPool.length, found: foundCount });
          }

          // รอบที่ 3: ดึงข้อมูลพื้นฐาน (Finnhub) เฉพาะหุ้นที่ "ผ่านเกณฑ์แล้วเท่านั้น" เพื่อทราบ
          // Market Cap สำหรับจัดกลุ่ม Small/Mid/Large Cap — ลดจำนวนเรียก Finnhub จากหลักพันเหลือ
          // แค่หลักสิบ (เท่าจำนวนหุ้นที่ผ่านเกณฑ์จริง) ต่อรอบสแกน
          // ยิงทุกตัวพร้อมกัน (Promise.all) แทนการ await ทีละตัวตามลำดับ — fhQueue ยังคุมอัตรา
          // การยิงจริงให้ไม่เกิน fhMinIntervalMs ต่อคำขอเหมือนเดิมทุกประการ แค่ตัดเวลารอผลลัพธ์
          // (network round-trip) ที่เคยต้องต่อคิวกันทีละตัวออกไป ทำให้รอบนี้เสร็จเร็วขึ้น
          if (fhKey && loadFundamentalsOnly && foundSymbols.length > 0) {
            await Promise.all(foundSymbols.map((sym) => loadFundamentalsOnly(sym)));
          }

          // "ล็อก" ผลสแกนของสัปดาห์นี้ไว้ใน localStorage — ครั้งต่อไปที่เปิดเว็บมาดูหรือสลับแท็บ
          // (หรือแม้แต่มาเปิดใหม่ทั้งแอปในสัปดาห์เดียวกัน) จะใช้ชุดหุ้นนี้ทันทีโดยไม่สแกนซ้ำ จนกว่า
          // จะขึ้นสัปดาห์ใหม่ (weekKey เปลี่ยน) ถึงจะสแกนชุดใหม่โดยอัตโนมัติ
          await saveStore(WEEKLY_PICKS_STORE_KEY, {
            weekKey: today.weekKey,
            symbols: foundSymbols,
            savedAt: Date.now(),
          });
        } finally {
          setLoading(false);
        }
      }, [tdKey, fhKey, today, loadSymbol, loadFundamentalsOnly, dataMap]);

      useEffect(() => {
        scanCandidates();
        // eslint-disable-next-line react-hooks/exhaustive-deps
      }, [today.weekKey, tdKey, fhKey, universeReady]);

      const recommended = useMemo(() => {
        const candidates = [];
        for (const item of today.rotation) {
          const entry = dataMap[item.symbol];
          if (!entry || !entry.series || entry.series.length < 20) continue;
          const cls = classify(entry.series);
          if (!isWeeklyPickEligible(cls)) continue;
          const mktCapB = ((pick(entry.fundamentals, ["marketCapitalization"]) || entry.profile?.marketCapitalization || 0) * 1e6) / 1e9;
          const countryMeta = getCountryMeta(item.country);
          candidates.push({
            ...item,
            cls,
            mktCapB,
            capTier: getCapTier(mktCapB),
            countryMeta,
            region: countryMeta.region,
            quote: entry.quote,
            profile: entry.profile,
          });
        }

        // เรียงตามความแข็งแรงของสัญญาณ RSI & Trend Score
        const strength = (c) => c.cls.trendScore + (c.cls.rsi || 0) / 100;
        candidates.sort((a, b) => strength(b) - strength(a));

        // คัดหุ้นแนะนำสุดท้ายแบบ "คละ Cap Tier" (Large / Mid / Small / ไม่ทราบ) ก่อน เพื่อไม่ให้
        // ได้แต่หุ้น Large Cap ล้วน ๆ ตามที่ผู้ใช้ต้องการ — วนหยิบตัวที่แข็งแรงที่สุดจากแต่ละกลุ่ม
        // ทีละรอบ (round-robin) จนครบ WEEKLY_PICK_COUNT ตัว
        const tierOrder = ["Large", "Mid", "Small", null];
        const byTier = {};
        tierOrder.forEach((t) => { byTier[t] = candidates.filter((c) => c.capTier === t); });

        const picked = [];
        const usedSymbols = new Set();
        let guard = 0;
        while (picked.length < WEEKLY_PICK_COUNT && guard < candidates.length + 1) {
          let addedThisRound = false;
          for (const t of tierOrder) {
            if (picked.length >= WEEKLY_PICK_COUNT) break;
            const next = byTier[t].find((c) => !usedSymbols.has(c.symbol));
            if (next) {
              picked.push(next);
              usedSymbols.add(next.symbol);
              addedThisRound = true;
            }
          }
          guard++;
          if (!addedThisRound) break;
        }
        for (const c of candidates) {
          if (picked.length >= WEEKLY_PICK_COUNT) break;
          if (!usedSymbols.has(c.symbol)) {
            picked.push(c);
            usedSymbols.add(c.symbol);
          }
        }
        return picked.slice(0, WEEKLY_PICK_COUNT);
      }, [today, dataMap]);

      return (
        <div className="bg-gradient-to-r from-amber-500/10 via-zinc-900 to-emerald-500/10 border border-amber-500/30 rounded-lg p-4 space-y-4">
          <div className="flex flex-wrap items-center justify-between gap-3">

                <strong className="text-zinc-200">Small / Mid / Large Cap คละกัน</strong> ทุกภูมิภาค โดยยึดเฉพาะหุ้นที่เป็น{" "}
                <strong className="text-emerald-400">ขาขึ้น (Uptrend)</strong> และ{" "}
                <strong className="text-emerald-400">โมเมนตัมบวกแรง (Strong Bullish) เท่านั้น</strong> • เมื่อสแกนเจอผู้เข้าเกณฑ์ครบ {SCAN_BUFFER} ตัว (มากกว่า {WEEKLY_PICK_COUNT} ตัวสุดท้ายเล็กน้อย เผื่อคละ Cap Tier) จะหยุดสแกนทันที • สแกนเพียง{" "}
                <strong className="text-zinc-200">ครั้งเดียวต่อสัปดาห์โดยอัตโนมัติ</strong> แล้วจดจำชุดหุ้นนี้ไว้ ไม่ว่าจะเปิดเว็บใหม่หรือสลับแท็บกี่ครั้งก็ยังเป็นชุดเดิม จนกว่าจะขึ้นสัปดาห์ใหม่ถึงจะสแกนชุดใหม่ให้อัตโนมัติ
              </div>
            </div>
            <div className="flex items-center gap-2">
              <span className="text-xs font-mono bg-zinc-950 border border-zinc-800 text-amber-400 px-3 py-1 rounded-md font-bold">
                📅 {today.displayDate}
              </span>
            </div>
          </div>

          {!tdKey && (
            <div className="bg-amber-500/10 border border-amber-500/30 rounded-lg p-2.5 text-[11px] text-amber-300 flex items-start gap-2">

    // จำนวนแท่งที่แสดงบนกราฟ (ของเดิมตัดแค่ 90 แท่งสุดท้ายเพื่อความเร็ว) — EMA/RSI/MACD ยังคำนวณ
    // จาก series เต็มเสมอ (ไม่ใช่แค่ 90 แท่งที่ตัดมาโชว์) เพื่อไม่ให้ค่าเพี้ยนจากการตัดข้อมูลทิ้ง
    const CHART_VISIBLE_BARS = 90;

    function PriceChart({ series, support, resistance, timeframe = "1week" }) {
      const tfObj = TIMEFRAMES.find((t) => t.id === timeframe) || TIMEFRAMES[1];

      const data = useMemo(() => {
        const closes = series.map((b) => b.close);
        const e20Arr = ema(closes, 20);
        const e50Arr = ema(closes, 50);
        const e200Arr = ema(closes, 200);
        const rsiArr = rsi(closes, 14);
        const { line: macdLine, signal: macdSignal, hist: macdHist } = macd(closes);

        const start = Math.max(0, series.length - CHART_VISIBLE_BARS);
        return series.slice(start).map((b, idx) => {
          const originalIdx = start + idx;
          const prevClose = originalIdx > 0 ? series[originalIdx - 1].close : b.close;
          return {
            date: b.date.slice(0, 16),
            close: b.close,
            ema20: e20Arr[originalIdx],
            ema50: e50Arr[originalIdx],
            ema200: e200Arr[originalIdx],
            volume: b.volume,
            volUp: b.close >= prevClose,
            rsi: rsiArr[originalIdx],
            macdLine: macdLine[originalIdx],
            macdSignal: macdSignal[originalIdx],
            macdHist: macdHist[originalIdx],
          };
        });
      }, [series]);

      const levels = [
        ...support.map((s) => s.price),
        ...resistance.map((r) => r.price),
        ...data.map((d) => d.close),
        ...data.map((d) => d.ema20).filter(Boolean),
        ...data.map((d) => d.ema50).filter(Boolean),
        ...data.map((d) => d.ema200).filter(Boolean),
      ];
      const min = Math.min(...levels) * 0.985;
      const max = Math.max(...levels) * 1.015;
      const maxVolume = Math.max(1, ...data.map((d) => d.volume || 0));

      return (
        <div className="space-y-1.5">
          {/* ราคา + แนวรับ/แนวต้าน + EMA 20/50/200 */}
          <ResponsiveContainer width="100%" height={230}>
            <ComposedChart data={data} margin={{ top: 6, right: 52, left: 0, bottom: 0 }}>
              <CartesianGrid strokeDasharray="3 3" stroke="#1e1f33" vertical={false} />
              <XAxis dataKey="date" tick={{ fill: "#7d7fa1", fontSize: 10 }} axisLine={{ stroke: "#31324a" }} tickLine={false} minTickGap={28} />
              <YAxis domain={[min, max]} tick={{ fill: "#7d7fa1", fontSize: 10 }} axisLine={false} tickLine={false} width={46} tickFormatter={(v) => v.toFixed(0)} />
              <Tooltip
                contentStyle={{ background: "#141526", border: "1px solid #31324a", borderRadius: 10, fontSize: 12, boxShadow: "0 8px 24px rgba(0,0,0,0.45)" }}
                labelStyle={{ color: "#a6a8c4" }}
                formatter={(v, name) => [
                  `$${v != null ? (+v).toFixed(2) : "—"}`,
                  name === "close" ? `ราคาปิด (${tfObj.label})` : name,
                ]}
              />
              <Legend wrapperStyle={{ fontSize: 10 }} formatter={(v) => <span style={{ color: "#a6a8c4" }}>{v}</span>} />
              {resistance.map((r, i) => (
                <ReferenceLine key={`r${i}`} y={r.price} stroke="#f87171" strokeDasharray="4 3" strokeOpacity={0.9 - i * 0.2}
                  label={{ value: `R${i + 1} ${r.price.toFixed(2)} (${r.touches}x)`, position: "right", fill: "#f87171", fontSize: 10 }} />
              ))}
              {support.map((s, i) => (
                <ReferenceLine key={`s${i}`} y={s.price} stroke="#34d399" strokeDasharray="4 3" strokeOpacity={0.9 - i * 0.2}
                  label={{ value: `S${i + 1} ${s.price.toFixed(2)} (${s.touches}x)`, position: "right", fill: "#34d399", fontSize: 10 }} />
              ))}
              <Line type="monotone" dataKey="close" stroke="#8087f8" strokeWidth={1.75} dot={false} isAnimationActive={false} name="ราคาปิด" />
              <Line type="monotone" dataKey="ema20" stroke="#facc15" strokeWidth={1.25} dot={false} isAnimationActive={false} name="EMA20" connectNulls />
              <Line type="monotone" dataKey="ema50" stroke="#38bdf8" strokeWidth={1.25} dot={false} isAnimationActive={false} name="EMA50" connectNulls />
              <Line type="monotone" dataKey="ema200" stroke="#c084fc" strokeWidth={1.5} strokeDasharray="3 3" dot={false} isAnimationActive={false} name="EMA200" connectNulls />
            </ComposedChart>
          </ResponsiveContainer>

          {/* Volume */}
          <ResponsiveContainer width="100%" height={64}>
            <ComposedChart data={data} margin={{ top: 0, right: 52, left: 0, bottom: 0 }}>
              <XAxis dataKey="date" hide />
              <YAxis domain={[0, maxVolume * 1.1]} tick={{ fill: "#7d7fa1", fontSize: 9 }} axisLine={false} tickLine={false} width={46} tickFormatter={fmtBig} />
              <Tooltip
                contentStyle={{ background: "#141526", border: "1px solid #31324a", borderRadius: 10, fontSize: 12 }}
                labelStyle={{ color: "#a6a8c4" }}
                formatter={(v) => [fmtBig(v), "Volume"]}
              />
              <Bar dataKey="volume" name="Volume" isAnimationActive={false}>
                {data.map((d, i) => (
                  <Cell key={i} fill={d.volUp ? "#34d39980" : "#f8717180"} />
                ))}
              </Bar>
            </ComposedChart>
          </ResponsiveContainer>

          {/* RSI(14) */}
          <ResponsiveContainer width="100%" height={70}>
            <ComposedChart data={data} margin={{ top: 4, right: 52, left: 0, bottom: 0 }}>
              <XAxis dataKey="date" hide />
              <YAxis domain={[0, 100]} ticks={[30, 50, 70]} tick={{ fill: "#7d7fa1", fontSize: 9 }} axisLine={false} tickLine={false} width={46} />
              <Tooltip
                contentStyle={{ background: "#141526", border: "1px solid #31324a", borderRadius: 10, fontSize: 12 }}
                labelStyle={{ color: "#a6a8c4" }}
                formatter={(v) => [v != null ? (+v).toFixed(1) : "—", "RSI(14)"]}
              />
              <ReferenceLine y={70} stroke="#f87171" strokeDasharray="3 3" strokeOpacity={0.6} />
              <ReferenceLine y={30} stroke="#34d399" strokeDasharray="3 3" strokeOpacity={0.6} />
              <Line type="monotone" dataKey="rsi" stroke="#fbbf24" strokeWidth={1.5} dot={false} isAnimationActive={false} name="RSI(14)" connectNulls />
            </ComposedChart>
          </ResponsiveContainer>

          {/* MACD(12,26,9) */}
          <ResponsiveContainer width="100%" height={80}>
            <ComposedChart data={data} margin={{ top: 4, right: 52, left: 0, bottom: 0 }}>
              <XAxis dataKey="date" tick={{ fill: "#7d7fa1", fontSize: 9 }} axisLine={{ stroke: "#31324a" }} tickLine={false} minTickGap={28} />
              <YAxis tick={{ fill: "#7d7fa1", fontSize: 9 }} axisLine={false} tickLine={false} width={46} tickFormatter={(v) => v.toFixed(1)} />
              <Tooltip
                contentStyle={{ background: "#141526", border: "1px solid #31324a", borderRadius: 10, fontSize: 12 }}
                labelStyle={{ color: "#a6a8c4" }}
                formatter={(v, name) => [v != null ? (+v).toFixed(3) : "—", name]}
              />
              <ReferenceLine y={0} stroke="#454764" />
              <Bar dataKey="macdHist" name="Histogram" isAnimationActive={false}>
                {data.map((d, i) => (
                  <Cell key={i} fill={(d.macdHist || 0) >= 0 ? "#34d399" : "#f87171"} />
                ))}
              </Bar>
              <Line type="monotone" dataKey="macdLine" stroke="#8087f8" strokeWidth={1.25} dot={false} isAnimationActive={false} name="MACD" connectNulls />
              <Line type="monotone" dataKey="macdSignal" stroke="#fbbf24" strokeWidth={1.25} dot={false} isAnimationActive={false} name="Signal" connectNulls />
            </ComposedChart>
          </ResponsiveContainer>
        </div>
      );
    }

    /* ============================================================
