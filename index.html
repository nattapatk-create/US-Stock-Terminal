    function PortfolioView({ tdKey, geminiKey, dataMap, loadSymbol }) {
      const [portfolios, setPortfolios] = useState([]);
      const [activePortId, setActivePortId] = useState("");
      const [newPortName, setNewPortName] = useState("");
      const [showNewPortInput, setShowNewPortInput] = useState(false);

      const [loadingQuotes, setLoadingQuotes] = useState(false);

      const [showImportModal, setShowImportModal] = useState(false);
      const [importPreview, setImportPreview] = useState(null);
      const [importLoading, setImportLoading] = useState(false);
      const [importError, setImportError] = useState("");
      const [importRows, setImportRows] = useState([]);
      const importFileRef = useRef(null);

      const [sortField, setSortField] = useState("currVal");
      const [sortAsc, setSortAsc] = useState(false);
      const [expandedSymbol, setExpandedSymbol] = useState(null);

      // เงินสด (Cash) — เป็นก้อนเดียวรวมกันทั้งหมด แยกจากทุกพอร์ต ไม่ผูกกับ portfolio ใดพอร์ตหนึ่ง
      const [cashAmount, setCashAmount] = useState(0);
      const [cashAmountInput, setCashAmountInput] = useState("0");
      const [cashIncluded, setCashIncluded] = useState(false);

      // สกุลเงินที่แสดง (USD/THB) และอัตราแลกเปลี่ยนปัจจุบัน
      const [displayCurrency, setDisplayCurrency] = useState("USD");
      const [usdThbRate, setUsdThbRate] = useState(null);
      const [rateLoading, setRateLoading] = useState(false);
      const [rateUpdatedAt, setRateUpdatedAt] = useState(null);
      const [rateError, setRateError] = useState("");

      // เป้าหมายมูลค่าพอร์ต (เก็บภายในเป็น USD เสมอ)
      const [portfolioGoal, setPortfolioGoal] = useState(0);
      const [goalInput, setGoalInput] = useState("");

      // เป้าหมายมูลค่าแยกรายพอร์ต (เก็บเป็น map { [portfolioId]: usdGoal })
      const [portfolioGoals, setPortfolioGoals] = useState({});
      const [portGoalInput, setPortGoalInput] = useState("");

      const refreshExchangeRate = useCallback(async () => {
        setRateLoading(true);
        setRateError("");
        const result = await fetchUsdThbRate();
        if (result) {
          setUsdThbRate(result.rate);
          setRateUpdatedAt(result.updatedAt);
          saveStore("us-dash-usdthb-rate-v1", result);
        } else {
          setRateError("ดึงอัตราแลกเปลี่ยนล่าสุดไม่สำเร็จ ใช้ค่าล่าสุดที่มีอยู่แทน");
        }
        setRateLoading(false);
      }, []);

      const fmtMoney = useCallback((usdVal) => {
        if (usdVal == null || isNaN(usdVal)) return "—";
        if (displayCurrency === "THB") {
          if (!usdThbRate) return `≈$${fmtPrice(usdVal)}`;
          const thb = usdVal * usdThbRate;
          return `฿${thb.toLocaleString("th-TH", { maximumFractionDigits: 0 })}`;
        }
        return `$${fmtPrice(usdVal)}`;
      }, [displayCurrency, usdThbRate]);

      const toggleCurrency = (target) => {
        const next = target || (displayCurrency === "USD" ? "THB" : "USD");
        if (next === displayCurrency) return;
        setDisplayCurrency(next);
        saveStore("us-dash-currency-v1", next);
        if (portfolioGoal > 0) {
          const displayVal = next === "THB" && usdThbRate ? portfolioGoal * usdThbRate : portfolioGoal;
          setGoalInput(next === "THB" ? String(Math.round(displayVal)) : displayVal.toFixed(2));
        }
      };

      const handleGoalCommit = () => {
        const val = parseFloat(goalInput);
        let usdVal = Number.isFinite(val) && val > 0 ? val : 0;
        if (displayCurrency === "THB" && usdThbRate) {
          usdVal = usdVal / usdThbRate;
        }
        setPortfolioGoal(usdVal);
        saveStore("us-dash-portfolio-goal-v1", usdVal);
        if (usdVal > 0) {
          const displayVal = displayCurrency === "THB" && usdThbRate ? usdVal * usdThbRate : usdVal;
          setGoalInput(displayCurrency === "THB" ? String(Math.round(displayVal)) : displayVal.toFixed(2));
        } else {
          setGoalInput("");
        }
      };

      const handlePortGoalCommit = () => {
        const val = parseFloat(portGoalInput);
        let usdVal = Number.isFinite(val) && val > 0 ? val : 0;
        if (displayCurrency === "THB" && usdThbRate) {
          usdVal = usdVal / usdThbRate;
        }
        const updatedGoals = { ...portfolioGoals, [activePort.id]: usdVal };
        setPortfolioGoals(updatedGoals);
        saveStore("us-dash-portfolio-goals-v1", updatedGoals);
      };

      // ซิงก์ค่าที่แสดงในช่องเป้าหมายรายพอร์ตเมื่อสลับพอร์ต / สลับสกุลเงิน / เรตเปลี่ยน (ย้ายไปไว้หลัง activePort ถูกประกาศ ด้านล่าง)

      useEffect(() => {
        (async () => {
          const savedCurrency = await loadStore("us-dash-currency-v1", "USD");
          setDisplayCurrency(savedCurrency === "THB" ? "THB" : "USD");

          const savedGoal = await loadStore("us-dash-portfolio-goal-v1", 0);
          const g = Number(savedGoal);
          const goalUsd = Number.isFinite(g) && g > 0 ? g : 0;
          setPortfolioGoal(goalUsd);

          const savedPortGoals = await loadStore("us-dash-portfolio-goals-v1", {});
          setPortfolioGoals(savedPortGoals && typeof savedPortGoals === "object" ? savedPortGoals : {});

          const cachedRate = await loadStore("us-dash-usdthb-rate-v1", null);
          if (cachedRate?.rate) {
            setUsdThbRate(cachedRate.rate);
            setRateUpdatedAt(cachedRate.updatedAt);
            if (goalUsd > 0) {
              const displayVal = savedCurrency === "THB" ? goalUsd * cachedRate.rate : goalUsd;
              setGoalInput(savedCurrency === "THB" ? String(Math.round(displayVal)) : displayVal.toFixed(2));
            }
          } else if (goalUsd > 0) {
            setGoalInput(goalUsd.toFixed(2));
          }

          refreshExchangeRate();
        })();
      }, []);

      useEffect(() => {
        (async () => {
          let ports = await loadStore("us-dash-portfolios-v3", null);
          if (!ports || ports.length === 0) {
            const legacy = await loadStore("us-dash-portfolio-v2", []);
            ports = [
              {
                id: "port-" + Date.now(),
                name: "พอร์ตหลัก (Main Portfolio)",
                items: Array.isArray(legacy) ? legacy : []
              }
            ];
            saveStore("us-dash-portfolios-v3", ports);
          }
          setPortfolios(ports);
          if (ports.length > 0) {
            setActivePortId(ports[0].id);
          }

          const savedCash = await loadStore("us-dash-cash-v1", { amount: 0, included: false });
          const amt = Number(savedCash?.amount);
          setCashAmount(Number.isFinite(amt) ? amt : 0);
          setCashAmountInput(Number.isFinite(amt) ? String(amt) : "0");
          setCashIncluded(!!savedCash?.included);
        })();
      }, []);

      const savePortfolios = (updated) => {
        setPortfolios(updated);
        saveStore("us-dash-portfolios-v3", updated);
      };

      const saveCash = (amount, included) => {
        setCashAmount(amount);
        setCashIncluded(included);
        saveStore("us-dash-cash-v1", { amount, included });
      };

      const handleCashAmountCommit = () => {
        const val = parseFloat(cashAmountInput);
        const amount = Number.isFinite(val) ? val : 0;
        setCashAmountInput(String(amount));
        saveCash(amount, cashIncluded);
      };

      const toggleCashIncluded = () => {
        saveCash(cashAmount, !cashIncluded);
      };

      const activePort = useMemo(() => {
        return portfolios.find((p) => p.id === activePortId) || portfolios[0] || { id: "def", name: "Default", items: [] };
      }, [portfolios, activePortId]);

      // ซิงก์ค่าที่แสดงในช่องเป้าหมายรายพอร์ตเมื่อสลับพอร์ต / สลับสกุลเงิน / เรตเปลี่ยน
      useEffect(() => {
        const usdVal = portfolioGoals[activePort.id] || 0;
        if (usdVal > 0) {
          const displayVal = displayCurrency === "THB" && usdThbRate ? usdVal * usdThbRate : usdVal;
          setPortGoalInput(displayCurrency === "THB" ? String(Math.round(displayVal)) : displayVal.toFixed(2));
        } else {
          setPortGoalInput("");
        }
      }, [activePort.id, portfolioGoals, displayCurrency, usdThbRate]);

      const portfolio = activePort.items || [];

      const updateActiveItems = (updatedItems) => {
        const updatedPorts = portfolios.map((p) => {
          if (p.id === activePort.id) {
            return { ...p, items: updatedItems };
          }
          return p;
        });
        savePortfolios(updatedPorts);
      };

      const resetImportState = () => {
        setImportPreview(null);
        setImportLoading(false);
        setImportError("");
        setImportRows([]);
        if (importFileRef.current) importFileRef.current.value = "";
      };

      const closeImportModal = () => {
        setShowImportModal(false);
        resetImportState();
      };

      const handleImportButtonClick = () => {
        if (!geminiKey || !geminiKey.trim()) {
          alert("กรุณาตั้งค่า Gemini API Key ก่อน (เมนู ⚙ มุมขวาบน) เพื่อใช้ฟีเจอร์อ่านรูปพอร์ตอัตโนมัติ");
          return;
        }
        setShowImportModal(true);
        setTimeout(() => importFileRef.current?.click(), 0);
      };

      const handleImportFileChange = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;

        setImportError("");
        setImportRows([]);
        setImportLoading(true);

        const reader = new FileReader();
        reader.onload = async (event) => {
          const dataUrl = event.target.result;
          const match = /^data:([^;]+);base64,(.*)$/.exec(dataUrl);
          if (!match) {
            setImportError("ไม่สามารถอ่านไฟล์รูปภาพนี้ได้");
            setImportLoading(false);
            return;
          }
          const mediaType = match[1];
          const base64Data = match[2];
          setImportPreview(dataUrl);

          try {
            const { rows, truncated } = await extractPortfolioFromImage(base64Data, mediaType, geminiKey.trim());
            if (rows.length === 0) {
              setImportError("ไม่พบรายการซื้อขายหุ้นในภาพนี้ ลองใช้ภาพที่เห็นชื่อหุ้นและระบุได้ว่าเป็นการซื้อหรือขายชัดเจนกว่านี้");
            } else if (truncated) {
              setImportError(
                `อ่านได้ ${rows.length} รายการ แต่ AI อาจตัดจบก่อนอ่านครบทุกแถวในภาพ (ข้อความยาวเกินไป) — ตรวจสอบด้านล่างว่าครบตามภาพหรือไม่ ถ้าไม่ครบลองครอปภาพให้เหลือรายการน้อยลงแล้วอัปโหลดเพิ่มเติมทีหลัง`
              );
            }
            setImportRows(rows.map((r) => ({ ...r, include: true })));
          } catch (err) {
            setImportError(err.message || "เกิดข้อผิดพลาดระหว่างอ่านภาพ");
          } finally {
            setImportLoading(false);
          }
        };
        reader.onerror = () => {
          setImportError("ไม่สามารถอ่านไฟล์รูปภาพนี้ได้");
          setImportLoading(false);
        };
        reader.readAsDataURL(file);
      };

      const updateImportRow = (idx, patch) => {
        setImportRows((prev) => prev.map((r, i) => {
          if (i !== idx) return r;
          const merged = { ...r, ...patch };
          // ถ้ามียอดรวมของรายการ (amount) อยู่แล้ว และผู้ใช้เพิ่งกรอก/แก้จำนวนหุ้น แต่ยังไม่มีราคาต่อหุ้น
          // ให้คำนวณราคาต่อหุ้นให้อัตโนมัติจาก amount / shares
          if (
            "shares" in patch &&
            Number.isFinite(merged.amount) && merged.amount > 0 &&
            Number.isFinite(merged.shares) && merged.shares > 0 &&
            (merged.price === null || merged.price === undefined || Number.isNaN(merged.price))
          ) {
            merged.price = Math.round((merged.amount / merged.shares) * 10000) / 10000;
          }
          return merged;
        }));
      };

      const removeImportRow = (idx) => {
        setImportRows((prev) => prev.filter((_, i) => i !== idx));
      };

      const confirmImportRows = () => {
        const missingShares = importRows.filter((r) => r.include && r.symbol && !(Number.isFinite(r.shares) && r.shares > 0));
        const toApply = importRows.filter(
          (r) => r.include && r.symbol && Number.isFinite(r.shares) && r.shares > 0
        );
        if (toApply.length === 0) {
          alert("ไม่มีรายการที่พร้อมนำเข้า กรุณากรอกจำนวนหุ้นให้ครบทุกแถวก่อนยืนยัน");
          return;
        }
        if (missingShares.length > 0) {
          const proceed = confirm(
            `มี ${missingShares.length} รายการ (${missingShares.map((r) => r.symbol).join(", ")}) ที่ยังไม่ได้กรอกจำนวนหุ้น จะถูกข้ามไปก่อน ต้องการยืนยันเฉพาะรายการที่กรอกครบแล้วหรือไม่?`
          );
          if (!proceed) return;
        }

        const skippedSells = [];
        let updated = [...portfolio];

        toApply.forEach((row) => {
          const s = row.symbol.toUpperCase().trim();
          const numShares = row.shares;
          const price = Number.isFinite(row.price) ? row.price : null;
          const txDate = row.date || new Date().toISOString().slice(0, 10);
          const existingIndex = updated.findIndex((item) => item.symbol === s);

          if (row.action === "SELL") {
            // ตัดขาย/Trim หุ้นที่มีอยู่แล้วในพอร์ตโดยอัตโนมัติ
            if (existingIndex < 0) {
              skippedSells.push(s);
              return;
            }
            const existing = updated[existingIndex];
            const sellShares = Math.min(numShares, existing.shares);
            if (Math.abs(sellShares - existing.shares) < 1e-6) {
              updated.splice(existingIndex, 1);
            } else {
              updated[existingIndex] = {
                ...existing,
                shares: existing.shares - sellShares,
                lastTxDate: txDate
              };
            }
          } else {
            // ซื้อเพิ่ม/เพิ่มหุ้นใหม่เข้าพอร์ตโดยอัตโนมัติ
            if (existingIndex >= 0) {
              const existing = updated[existingIndex];
              const buyPrice = price != null ? price : existing.avgCost;
              const oldTotalCost = existing.shares * existing.avgCost;
              const newBuyCost = numShares * buyPrice;
              const newTotalShares = existing.shares + numShares;
              const newAvgCost = (oldTotalCost + newBuyCost) / newTotalShares;
              updated[existingIndex] = {
                ...existing,
                shares: newTotalShares,
                avgCost: newAvgCost,
                lastTxDate: txDate
              };
            } else {
              updated.push({
                symbol: s,
                shares: numShares,
                avgCost: price != null ? price : 0,
                targetPct: 0,
                lastTxDate: txDate
              });
            }
          }
        });

        updateActiveItems(updated);
        if (tdKey) toApply.forEach((row) => loadSymbol(row.symbol.toUpperCase().trim(), false));

        if (skippedSells.length > 0) {
          alert(`ข้ามรายการขายของ ${skippedSells.join(", ")} เนื่องจากไม่พบหุ้นนี้ในพอร์ต "${activePort.name}"`);
        }

        closeImportModal();
      };

      const handleCreatePortfolio = (e) => {
        e.preventDefault();
        const name = newPortName.trim();
        if (!name) return;

        const newPort = {
          id: "port-" + Date.now(),
          name,
          items: []
        };
        const updated = [...portfolios, newPort];
        savePortfolios(updated);
        setActivePortId(newPort.id);
        setNewPortName("");
        setShowNewPortInput(false);
      };

      const handleDeletePortfolio = (portId) => {
        if (portfolios.length <= 1) {
          alert("ไม่สามารถลบพอร์ตทั้งหมดได้ ต้องมีอย่างน้อย 1 พอร์ตในระบบ");
          return;
        }
        const target = portfolios.find((p) => p.id === portId);
        if (confirm(`คุณต้องการลบพอร์ต "${target?.name}" ออกใช่หรือไม่?`)) {
          const updated = portfolios.filter((p) => p.id !== portId);
          savePortfolios(updated);
          if (activePortId === portId) {
            setActivePortId(updated[0].id);
          }
          if (portfolioGoals[portId] != null) {
            const nextGoals = { ...portfolioGoals };
            delete nextGoals[portId];
            setPortfolioGoals(nextGoals);
            saveStore("us-dash-portfolio-goals-v1", nextGoals);
          }
        }
      };

      const refreshPortfolioQuotes = useCallback(async () => {
        if (!tdKey) return;
        const allSymbols = [...new Set(portfolios.flatMap((p) => (p.items || []).map((item) => item.symbol)))];
        if (allSymbols.length === 0) return;

        setLoadingQuotes(true);
        await Promise.all(allSymbols.map((s) => loadSymbol(s, false)));
        setLoadingQuotes(false);
      }, [portfolios, tdKey, loadSymbol]);

      useEffect(() => {
        if (portfolios.length > 0 && tdKey) {
          refreshPortfolioQuotes();
        }
      }, [portfolios.length, tdKey]);

      const updateTargetPct = (sym, newPct) => {
        const val = parseFloat(newPct);
        const updated = portfolio.map((item) => {
          if (item.symbol === sym) {
            return { ...item, targetPct: !isNaN(val) && val >= 0 ? val : 0 };
          }
          return item;
        });
        updateActiveItems(updated);
      };

      const deletePosition = (sym) => {
        if (confirm(`คุณต้องการลบหุ้น ${sym} ออกจากพอร์ต "${activePort.name}" ใช่หรือไม่?`)) {
          const updated = portfolio.filter((item) => item.symbol !== sym);
          updateActiveItems(updated);
        }
      };

      const totalPortfolioVal = useMemo(() => {
        return portfolio.reduce((acc, item) => {
          const quote = dataMap[item.symbol]?.quote;
          const currPrice = quote?.close ? parseFloat(quote.close) : null;
          const currVal = currPrice != null ? item.shares * currPrice : item.shares * item.avgCost;
          return acc + currVal;
        }, 0);
      }, [portfolio, dataMap]);

      // มูลค่ารวมทุกพอร์ต (ทุกพอร์ตทั้งหมด ไม่ใช่แค่พอร์ตที่กำลังเปิดดู) — ใช้เป็นฐานสำหรับรวมเงินสด
      const totalAllPortfoliosVal = useMemo(() => {
        return portfolios.reduce((acc, p) => {
          const items = p.items || [];
          const val = items.reduce((iAcc, item) => {
            const quote = dataMap[item.symbol]?.quote;
            const currPrice = quote?.close ? parseFloat(quote.close) : null;
            const currVal = currPrice != null ? item.shares * currPrice : item.shares * item.avgCost;
            return iAcc + currVal;
          }, 0);
          return acc + val;
        }, 0);
      }, [portfolios, dataMap]);

      const grandTotalWithCash = totalAllPortfoliosVal + (cashIncluded ? cashAmount : 0);

      const goalProgressPct = portfolioGoal > 0 ? Math.min(100, (grandTotalWithCash / portfolioGoal) * 100) : 0;

      const processedPortfolio = useMemo(() => {
        return portfolio.map((item) => {
          const quote = dataMap[item.symbol]?.quote;
          const currPrice = quote?.close ? parseFloat(quote.close) : null;
          const totalCost = item.shares * item.avgCost;
          const currVal = currPrice != null ? item.shares * currPrice : totalCost;
          const pl = currPrice != null ? currVal - totalCost : 0;
          const plPct = currPrice != null && totalCost > 0 ? (pl / totalCost) * 100 : 0;

          const targetPct = item.targetPct != null ? parseFloat(item.targetPct) : 0;
          const actualPct = totalPortfolioVal > 0 ? (currVal / totalPortfolioVal) * 100 : 0;
          const maxAllowedVal = totalPortfolioVal * (targetPct / 100);
          const excessVal = maxAllowedVal > 0 ? currVal - maxAllowedVal : 0;
          const excessPct = actualPct - targetPct;
          const isOver = targetPct > 0 && excessVal > 0.01;

          return {
            ...item,
            currPrice,
            totalCost,
            currVal,
            pl,
            plPct,
            targetPct,
            actualPct,
            maxAllowedVal,
            excessVal,
            excessPct,
            isOver
          };
        });
      }, [portfolio, dataMap, totalPortfolioVal]);

      const sortedPortfolio = useMemo(() => {
        return [...processedPortfolio].sort((a, b) => {
          let valA = a[sortField];
          let valB = b[sortField];

          if (typeof valA === "string") {
            return sortAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
          }
          return sortAsc ? (valA ?? 0) - (valB ?? 0) : (valB ?? 0) - (valA ?? 0);
        });
      }, [processedPortfolio, sortField, sortAsc]);

      const handleSort = (field) => {
        if (sortField === field) {
          setSortAsc(!sortAsc);
        } else {
          setSortField(field);
          setSortAsc(false);
        }
      };

      const summary = useMemo(() => {
        let totalCost = 0;
        let totalCurrentVal = 0;
        let totalTargetPctAllocated = 0;
        let totalOverAllocatedCount = 0;

        processedPortfolio.forEach((item) => {
          totalCost += item.totalCost;
          totalCurrentVal += item.currVal;
          totalTargetPctAllocated += item.targetPct;
          if (item.isOver) totalOverAllocatedCount++;
        });

        const totalPL = totalCurrentVal - totalCost;
        const totalPLPct = totalCost > 0 ? (totalPL / totalCost) * 100 : 0;

        return { totalCost, totalCurrentVal, totalPL, totalPLPct, totalTargetPctAllocated, totalOverAllocatedCount };
      }, [processedPortfolio]);

      return (
        <div className="space-y-4">
          <div className="bg-zinc-900 border border-zinc-800 rounded-lg p-3 flex flex-wrap items-center justify-between gap-3">
            <div className="flex items-center gap-2 flex-wrap">
              <span className="text-xs font-semibold text-zinc-300 flex items-center gap-1.5 mr-1">
                <Briefcase className="text-blue-400" size={16} /> เลือกพอร์ตลงทุน:
              </span>
              <div className="flex items-center gap-1.5 flex-wrap">
                {portfolios.map((p) => (
                  <button
                    key={p.id}
                    onClick={() => setActivePortId(p.id)}
                    className={`px-3 py-1.5 rounded-md text-xs font-medium transition flex items-center gap-2 ${
                      p.id === activePort.id
                        ? "bg-blue-600 text-white font-bold shadow-sm"
                        : "bg-zinc-950 text-zinc-400 hover:text-zinc-200 border border-zinc-800"
                    }`}
                  >
                    <span>{p.name}</span>
                    <span className="text-[10px] px-1.5 py-0.2 rounded-full bg-zinc-900/60 text-zinc-300">
                      {p.items?.length || 0}
                    </span>
                  </button>
                ))}
              </div>
            </div>

            <div className="flex items-center gap-2">
              {!showNewPortInput ? (
                <button
                  onClick={() => setShowNewPortInput(true)}
                  className="flex items-center gap-1 px-3 py-1.5 rounded bg-emerald-600/20 text-emerald-400 border border-emerald-500/30 hover:bg-emerald-600/30 text-xs font-medium transition"
                >
                  <Plus size={14} /> สร้างพอร์ตใหม่
                </button>
              ) : (
                <form onSubmit={handleCreatePortfolio} className="flex items-center gap-1.5">
                  <input
                    type="text"
                    placeholder="ชื่อพอร์ต เช่น พอร์ตเกษียณ"
                    value={newPortName}
                    onChange={(e) => setNewPortName(e.target.value)}
                    className="bg-zinc-950 border border-emerald-500/50 rounded px-2.5 py-1 text-xs text-zinc-100 font-mono w-44 focus:outline-none"
                    autoFocus
                  />
                  <button
                    type="submit"
                    className="px-2.5 py-1 rounded bg-emerald-600 text-white text-xs font-medium hover:bg-emerald-500"
                  >
                    สร้าง
                  </button>
                  <button
                    type="button"
                    onClick={() => { setShowNewPortInput(false); setNewPortName(""); }}
                    className="px-2 py-1 rounded bg-zinc-800 text-zinc-400 text-xs hover:text-zinc-200"
                  >
                    ยกเลิก
                  </button>
                </form>
              )}

              {portfolios.length > 1 && (
                <button
                  onClick={() => handleDeletePortfolio(activePort.id)}
                  className="flex items-center gap-1 px-2.5 py-1.5 rounded bg-red-500/10 text-red-400 border border-red-500/30 hover:bg-red-500/20 text-xs transition"
                  title="ลบพอร์ตปัจจุบัน"
                >
                  <Trash2 size={13} /> ลบพอร์ต
                </button>
              )}
            </div>
          </div>

          <div className="bg-zinc-900 border border-emerald-500/20 rounded-lg p-3 flex flex-wrap items-center gap-4">
            <div className="flex items-center gap-2 flex-wrap">
              <span className="text-xs font-semibold text-zinc-300 flex items-center gap-1.5">
                <span>💵</span> เงินสด (รวมทุกพอร์ต):
              </span>
              <input
                type="number"
                step="any"
                value={cashAmountInput}
                onChange={(e) => setCashAmountInput(e.target.value)}
                onBlur={handleCashAmountCommit}
                placeholder="0"
                className="w-32 bg-zinc-950 border border-zinc-800 rounded px-2.5 py-1 text-xs font-mono text-emerald-300"
              />
              <button
                onClick={handleCashAmountCommit}
                className="px-2.5 py-1 rounded bg-zinc-800 hover:bg-zinc-700 text-xs text-zinc-300 transition"
              >
                บันทึก
              </button>
              <span className="text-[10px] text-zinc-500">
                เงินสดเป็นก้อนเดียวรวมกันของทุกพอร์ต ไม่ได้แยกตามพอร์ตใดพอร์ตหนึ่ง
              </span>
            </div>

            <div className="flex items-center gap-2 ml-auto">
              <span className="text-[11px] text-zinc-400">รวมเงินสดกับมูลค่าพอร์ตทั้งหมด:</span>
              <button
                onClick={toggleCashIncluded}
                className={`relative w-11 h-6 rounded-full transition-colors shrink-0 ${cashIncluded ? "bg-emerald-500" : "bg-zinc-700"}`}
                title={cashIncluded ? "ปิดการรวมเงินสด" : "เปิดการรวมเงินสด"}
              >
                <span className={`absolute top-0.5 left-0.5 w-5 h-5 rounded-full bg-white transition-transform ${cashIncluded ? "translate-x-5" : ""}`} />
              </button>
              <span className={`text-xs font-medium ${cashIncluded ? "text-emerald-400" : "text-zinc-500"}`}>
                {cashIncluded ? "เปิด" : "ปิด"}
              </span>
            </div>

            <div className="text-right">
              <div className="text-[11px] text-zinc-500">
                มูลค่ารวมทั้งหมด (ทุกพอร์ต{cashIncluded ? " + เงินสด" : ""})
              </div>
              <div className="text-base font-mono font-bold text-blue-300">
                {fmtMoney(grandTotalWithCash)}
              </div>
            </div>
          </div>

          <div className="bg-zinc-900 border border-indigo-500/20 rounded-lg p-4 space-y-3">
            <div className="flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-semibold text-zinc-300 flex items-center gap-1.5">
                  <span>🎯</span> เป้าหมายมูลค่ารวม <span className="text-indigo-400">ทุกพอร์ต</span>{cashIncluded ? " + เงินสด" : ""}
                </span>
                <input
                  type="number"
                  step="any"
                  min="0"
                  value={goalInput}
                  onChange={(e) => setGoalInput(e.target.value)}
                  onBlur={handleGoalCommit}
                  placeholder={displayCurrency === "THB" ? "เช่น 5000000" : "เช่น 150000"}
                  className="w-36 bg-zinc-950 border border-zinc-800 rounded px-2.5 py-1 text-xs font-mono text-indigo-300"
                />
                <span className="text-[11px] text-zinc-500">{displayCurrency === "THB" ? "บาท" : "USD"}</span>
                <button
                  onClick={handleGoalCommit}
                  className="px-2.5 py-1 rounded bg-zinc-800 hover:bg-zinc-700 text-xs text-zinc-300 transition"
                >
                  บันทึกเป้าหมาย
                </button>
              </div>

              <div className="flex items-center gap-3 flex-wrap">
                <div className="flex items-center gap-1.5">
                  <span className="text-[11px] text-zinc-400">สกุลเงิน:</span>
                  <div className="flex items-center bg-zinc-950 border border-zinc-800 rounded-full p-0.5">
                    <button
                      onClick={() => toggleCurrency("USD")}
                      className={`px-3 py-1 rounded-full text-[11px] font-semibold transition ${displayCurrency === "USD" ? "bg-blue-600 text-white" : "text-zinc-500 hover:text-zinc-300"}`}
                    >
                      USD
                    </button>
                    <button
                      onClick={() => toggleCurrency("THB")}
                      className={`px-3 py-1 rounded-full text-[11px] font-semibold transition ${displayCurrency === "THB" ? "bg-emerald-600 text-white" : "text-zinc-500 hover:text-zinc-300"}`}
                    >
                      THB
                    </button>
                  </div>
                </div>
                <button
                  onClick={refreshExchangeRate}
                  disabled={rateLoading}
                  className="flex items-center gap-1 text-[11px] text-zinc-400 hover:text-zinc-200 disabled:opacity-50"
                  title="รีเฟรชอัตราแลกเปลี่ยน"
                >
                  <RefreshCw size={11} className={rateLoading ? "animate-spin" : ""} />
                  {usdThbRate ? `1 USD ≈ ${usdThbRate.toFixed(2)} THB` : "กำลังโหลดเรต..."}
                </button>
              </div>
            </div>

            {rateError && <div className="text-[10px] text-amber-400">{rateError}</div>}

            {portfolioGoal > 0 ? (
              <div>
                <div className="flex justify-between items-center text-[11px] font-mono mb-1.5">
                  <span className="text-zinc-400">
                    ปัจจุบัน <span className="text-zinc-100 font-bold">{fmtMoney(grandTotalWithCash)}</span>
                  </span>
                  <span className="text-zinc-400">
                    เป้าหมาย <span className="text-indigo-300 font-bold">{fmtMoney(portfolioGoal)}</span>
                  </span>
                </div>
                <div className="h-4 w-full bg-zinc-950 rounded-full overflow-hidden border border-zinc-800">
                  <div
                    style={{ width: `${goalProgressPct}%` }}

                              <td className="py-1.5 pr-2">
                                <input

                                  className={`w-24 bg-zinc-950 border rounded px-1.5 py-1 text-right text-zinc-100 font-mono ${

                      หากภาพไม่มีคอลัมน์จำนวนหุ้น (เช่น ตารางประวัติรายการที่มีแต่ยอดเงินรวม) ระบบจะขึ้นเตือนสีเหลืองให้กรอกจำนวนหุ้นเอง และจะคำนวณราคาต่อหุ้นจากยอดรวมให้อัตโนมัติเมื่อกรอกจำนวนหุ้นแล้ว

    /* ============================================================
       WATCHLIST POSITION & PROFIT CALCULATOR
       ============================================================ */
    function WatchlistCalculator({ currentPrice, support = [], resistance = [] }) {
      const [showCalc, setShowCalc] = useState(false);
      const [capital, setCapital] = useState(1000);
      const [entryPrice, setEntryPrice] = useState("");
      const [stopLoss, setStopLoss] = useState("");

      useEffect(() => {
        const s1 = support.length > 0 ? support[0].price : currentPrice;
        const s2 = support.length > 1 ? support[1].price : (s1 ? s1 * 0.95 : 0);

        if (s1) setEntryPrice(s1.toFixed(2));
        if (s2) setStopLoss(s2.toFixed(2));
      }, [support, currentPrice]);

      const cap = parseFloat(capital) || 0;
      const entry = parseFloat(entryPrice) || 0;
      const sl = parseFloat(stopLoss) || 0;

      const shares = entry > 0 ? cap / entry : 0;
      const maxLoss = entry > 0 && sl > 0 ? cap - (shares * sl) : 0;
      const riskAmount = entry - sl;

      const targets = useMemo(() => {
        const base = entry > 0 ? entry : currentPrice;
        return [0, 1, 2].map((i) => {
          const r = resistance[i];
          const price = r ? r.price : (base ? base * (1 + 0.1 * (i + 1)) : 0);
          const totalVal = shares * price;
          const profit = totalVal - cap;
          const profitPct = entry > 0 ? ((price - entry) / entry) * 100 : 0;
          const rewardAmount = price - entry;
          const rr = riskAmount > 0 && rewardAmount > 0 ? (rewardAmount / riskAmount).toFixed(2) : null;
          return {
            key: `R${i + 1}`,
            price,
            touches: r ? r.touches : null,
            isEstimate: !r,
            totalVal,
            profit,
            profitPct,
            rr,
          };
        });
      }, [resistance, entry, currentPrice, shares, cap, riskAmount]);

      return (
        <div className="mt-3">
          <button
            type="button"
            onClick={() => setShowCalc((v) => !v)}
            className="w-full flex items-center justify-between bg-zinc-950/80 border border-zinc-800 hover:border-zinc-700 hover:bg-zinc-900/60 rounded-lg px-3 py-2 transition-colors"
          >
            <span className="text-xs font-semibold text-zinc-200 flex items-center gap-1.5">
              <span>🧮</span> เครื่องมือคำนวณกำไร & Risk/Reward (Position Sizing)
            </span>
            <span className="flex items-center gap-1.5 text-[10px] text-zinc-500">
              {showCalc ? "ซ่อนเครื่องมือ" : "คลิกเพื่อเปิดเครื่องมือ"}
              {showCalc ? <ChevronDown size={14} /> : <ChevronRight size={14} />}
            </span>
          </button>

          {showCalc && (
            <div className="mt-2 bg-zinc-950/80 border border-zinc-800 rounded-lg p-3">
              <div className="text-[10px] text-zinc-500 font-mono text-right mb-2.5">Auto Technical Support/Resistance</div>

              <div className="grid grid-cols-1 sm:grid-cols-3 gap-2 mb-3">
                <div>
                  <label className="text-[10px] text-zinc-400 block mb-1">เงินทุนที่ลง ($)</label>
                  <input
                    type="number"
                    value={capital}
                    onChange={(e) => setCapital(e.target.value)}
                    className="w-full bg-zinc-900 border border-zinc-800 rounded px-2 py-1 text-xs font-mono text-zinc-100"
                    placeholder="1000"
                  />
                </div>

                <div>
                  <label className="text-[10px] text-zinc-400 block mb-1">จุดซื้อ / แนวรับ ($)</label>
                  <input
                    type="number"
                    value={entryPrice}
                    onChange={(e) => setEntryPrice(e.target.value)}
                    className="w-full bg-zinc-900 border border-zinc-800 rounded px-2 py-1 text-xs font-mono text-emerald-400 font-bold"
                    placeholder="0.00"
                  />
                  <div className="flex gap-1 mt-1 flex-wrap">
                    {support.map((s, idx) => (
                      <button
                        key={idx}
                        type="button"
                        onClick={() => setEntryPrice(s.price.toFixed(2))}
                        className="text-[9px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-1 py-0.5 rounded hover:bg-emerald-500/20"
                      >
                        S{idx+1}: {s.price.toFixed(1)}
                      </button>
                    ))}
                    {currentPrice && (
                      <button
                        type="button"
                        onClick={() => setEntryPrice(currentPrice.toFixed(2))}
                        className="text-[9px] bg-zinc-800 text-zinc-300 border border-zinc-700 px-1 py-0.5 rounded hover:bg-zinc-700"
                      >
                        ปัจจุบัน
                      </button>
                    )}
                  </div>
                </div>

                <div>
                  <label className="text-[10px] text-zinc-400 block mb-1">ตัดขาดทุน Stop Loss ($)</label>
                  <input
                    type="number"
                    value={stopLoss}
                    onChange={(e) => setStopLoss(e.target.value)}
                    className="w-full bg-zinc-900 border border-zinc-800 rounded px-2 py-1 text-xs font-mono text-red-400"
                    placeholder="0.00"
                  />
                </div>
              </div>

              {cap > 0 && entry > 0 ? (
                <>
                  <div className="text-[10px] text-zinc-500 mb-1.5">
                    กำไรคาดการณ์อัตโนมัติ 3 ช่วง ตามแนวต้าน — เงินทุน ${fmtPrice(cap)} → {shares.toFixed(2)} หุ้น @ ${fmtPrice(entry)}
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                    {targets.map((t) => (
                      <div key={t.key} className="bg-zinc-900/90 border border-zinc-800/80 rounded p-2.5 font-mono text-xs">
                        <div className="flex items-center justify-between mb-1.5">
                          <span className="text-[10px] font-semibold text-blue-400">
                            เป้าหมาย {t.key} {t.isEstimate ? "(ประมาณการ)" : `(${t.touches}x)`}
                          </span>
                          <span className="text-zinc-200 font-bold">${fmtPrice(t.price)}</span>
                        </div>
                        <div className={`font-bold ${t.profit >= 0 ? "text-emerald-400" : "text-red-400"}`}>
                          {t.profit >= 0 ? "+" : ""}${fmtPrice(t.profit)} ({fmtPct(t.profitPct)})
                        </div>
                        <div className="text-[10px] text-zinc-500 mt-1">
                          R:R {t.rr ? `1 : ${t.rr}` : "—"}
                        </div>
                      </div>
                    ))}
                  </div>
                  {maxLoss > 0 && (
                    <div className="text-[10px] text-red-400 mt-2">
                      ⚠️ หากชน Stop Loss (${fmtPrice(sl)}) จะขาดทุนประมาณ ${fmtPrice(maxLoss)}
                    </div>
                  )}
                </>
              ) : (
                <div className="text-[11px] text-zinc-500 text-center py-3">
                  กรอก "เงินทุนที่ลง" และ "จุดซื้อ" เพื่อคำนวณกำไรคาดการณ์อัตโนมัติ 3 ช่วงตามแนวต้าน
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    /* ============================================================
       AVERAGE COST CALCULATOR (คำนวณค่าเฉลี่ยต้นทุนล่วงหน้า / DCA)
       ============================================================
       คำนวณต้นทุนเฉลี่ยใหม่ ถ้าจะซื้อหุ้นตัวนี้เพิ่ม โดยอ้างอิงจำนวนหุ้น + ต้นทุนเฉลี่ยเดิม
       ที่มีอยู่จริงในพอร์ตปัจจุบัน (รวมทุกพอร์ตย่อยที่ถือ symbol นี้อยู่) และรองรับการแบ่งซื้อ
       เป็นหลายไม้ (ไม้ละจำนวนเงิน + ราคาต่างกันได้ เช่น จะทยอยซื้อไล่ราคาลงมา) */
    function AverageCostCalculator({ symbol, currentPrice }) {
      const [showCalc, setShowCalc] = useState(false);
      const [holding, setHolding] = useState({ shares: 0, avgCost: 0 });
      const lotIdRef = useRef(1);
      const [lots, setLots] = useState([{ id: 0, amount: "100", price: "" }]);

      // โหลดยอดถือครองปัจจุบันของ symbol นี้จากทุกพอร์ต ทุกครั้งที่เปิดเครื่องมือ
      // (เผื่อผู้ใช้เพิ่ง ซื้อ/แก้ไข พอร์ตในแท็บ "พอร์ตลงทุน" มาก่อนหน้านี้)
      useEffect(() => {
        if (!showCalc) return;
        (async () => {
          const ports = await loadStore("us-dash-portfolios-v3", []);
          let totalShares = 0;
          let totalCost = 0;
          (Array.isArray(ports) ? ports : []).forEach((p) => {
            (p.items || []).forEach((item) => {
              if (item.symbol === symbol) {
                const sh = Number(item.shares) || 0;
                totalShares += sh;
                totalCost += sh * (Number(item.avgCost) || 0);
              }
            });
          });
          setHolding({ shares: totalShares, avgCost: totalShares > 0 ? totalCost / totalShares : 0 });
        })();
      }, [showCalc, symbol]);

      // เติมราคาไม้แรกด้วยราคาปัจจุบันอัตโนมัติตอนเปิดเครื่องมือ (ถ้ายังไม่ได้กรอก)
      useEffect(() => {
        if (showCalc && currentPrice) {
          setLots((prev) =>
            prev.map((l, i) => (i === 0 && !l.price ? { ...l, price: currentPrice.toFixed(2) } : l))
          );
        }
      }, [showCalc, currentPrice]);

      const addLot = () => {
        lotIdRef.current += 1;
        setLots((prev) => [...prev, { id: lotIdRef.current, amount: "100", price: currentPrice ? currentPrice.toFixed(2) : "" }]);
      };
      const removeLot = (id) => {
        setLots((prev) => (prev.length > 1 ? prev.filter((l) => l.id !== id) : prev));
      };
      const updateLot = (id, patch) => {
        setLots((prev) => prev.map((l) => (l.id === id ? { ...l, ...patch } : l)));
      };

      const computedLots = useMemo(() => {
        return lots.map((l) => {
          const amt = parseFloat(l.amount) || 0;
          const price = parseFloat(l.price) || 0;
          return { ...l, amt, price, sh: price > 0 ? amt / price : 0 };
        });
      }, [lots]);

      const totalNewAmount = computedLots.reduce((s, l) => s + l.amt, 0);
      const totalNewShares = computedLots.reduce((s, l) => s + l.sh, 0);

      const oldShares = holding.shares;
      const oldAvgCost = holding.avgCost;
      const hasHolding = oldShares > 0;

      const combinedShares = oldShares + totalNewShares;
      const combinedCost = oldShares * oldAvgCost + totalNewAmount;
      const newAvgCost = combinedShares > 0 ? combinedCost / combinedShares : 0;
      const avgChangePct = hasHolding && oldAvgCost > 0 ? ((newAvgCost - oldAvgCost) / oldAvgCost) * 100 : null;

      return (
        <div className="mt-2">
          <button
            type="button"
            onClick={() => setShowCalc((v) => !v)}
            className="w-full flex items-center justify-between bg-zinc-950/80 border border-zinc-800 hover:border-zinc-700 hover:bg-zinc-900/60 rounded-lg px-3 py-2 transition-colors"
          >
            <span className="text-xs font-semibold text-zinc-200 flex items-center gap-1.5">
              <span>➗</span> เครื่องมือคำนวณค่าเฉลี่ยต้นทุนล่วงหน้า (DCA)
            </span>
            <span className="flex items-center gap-1.5 text-[10px] text-zinc-500">
              {showCalc ? "ซ่อนเครื่องมือ" : "คลิกเพื่อเปิดเครื่องมือ"}
              {showCalc ? <ChevronDown size={14} /> : <ChevronRight size={14} />}
            </span>
          </button>

          {showCalc && (
            <div className="mt-2 bg-zinc-950/80 border border-zinc-800 rounded-lg p-3">
              <div className="text-[11px] text-zinc-400 mb-3">
                ถืออยู่ในพอร์ตปัจจุบัน (รวมทุกพอร์ต):{" "}
                {hasHolding ? (
                  <span className="text-zinc-200 font-mono">
                    {oldShares.toFixed(4)} หุ้น @ ${fmtPrice(oldAvgCost)} (ต้นทุนรวม ${fmtPrice(oldShares * oldAvgCost)})
                  </span>
                ) : (
                  <span className="text-zinc-500">ยังไม่มีหุ้น {symbol} ในพอร์ต — จะคำนวณต้นทุนเฉลี่ยจากไม้ที่กรอกด้านล่างเท่านั้น</span>
                )}
              </div>

              <div className="space-y-2">
                <div className="grid grid-cols-[2.5rem_1fr_1fr_5rem_1.5rem] items-center gap-2 text-[10px] text-zinc-500 px-0.5">
                  <span>ไม้</span>
                  <span>เงินลงทุน ($)</span>
                  <span>ราคาซื้อ ($)</span>
                  <span className="text-right">ได้หุ้น</span>
                  <span></span>
                </div>
                {computedLots.map((l, idx) => (
                  <div key={l.id} className="grid grid-cols-[2.5rem_1fr_1fr_5rem_1.5rem] items-center gap-2">
                    <span className="text-[11px] text-zinc-500 font-mono">#{idx + 1}</span>
                    <input
                      type="number"
                      value={l.amount}
                      onChange={(e) => updateLot(l.id, { amount: e.target.value })}
                      className="w-full bg-zinc-900 border border-zinc-800 rounded px-2 py-1 text-xs font-mono text-zinc-100"
                      placeholder="100"
                    />
                    <input
                      type="number"
                      value={l.price}
                      onChange={(e) => updateLot(l.id, { price: e.target.value })}
                      className="w-full bg-zinc-900 border border-zinc-800 rounded px-2 py-1 text-xs font-mono text-blue-300"
                      placeholder="0.00"
                    />
                    <span className="text-[11px] text-zinc-400 font-mono text-right">{l.sh > 0 ? l.sh.toFixed(4) : "—"}</span>
                    <button
                      type="button"
                      onClick={() => removeLot(l.id)}
                      disabled={lots.length <= 1}
                      className="p-1 rounded hover:bg-zinc-800 text-zinc-500 hover:text-red-400 disabled:opacity-30 justify-self-center"
                      title="ลบไม้นี้"
                    >
                      <Trash2 size={13} />
                    </button>
                  </div>
                ))}
              </div>

              <button
                type="button"
                onClick={addLot}
                className="mt-2.5 text-[11px] text-blue-300 hover:text-blue-200 border border-blue-500/30 hover:border-blue-500/50 bg-blue-500/10 px-2.5 py-1 rounded-md transition-colors"
              >
                + เพิ่มไม้ซื้อ
              </button>

              <div className="mt-3 pt-3 border-t border-zinc-800 grid grid-cols-2 sm:grid-cols-4 gap-2 font-mono text-xs">

                    แนวต้านหลัก (R1–R3): {analysis.sr.resistance.length ? analysis.sr.resistance.map((r) => `${r.price.toFixed(2)} (${r.touches}x)`).join(" · ") : "ยังไม่พบ"}

    /* ============================================================
       SECTOR ROTATION VIEW
       ============================================================ */
    function SectorRotationView({ tdKey }) {
      const [sectorData, setSectorData] = useState([]);
      const [loading, setLoading] = useState(false);
      const [progress, setProgress] = useState(0);
      const [error, setError] = useState(null);
      const [scannedAt, setScannedAt] = useState(null);
      const [autoRefresh, setAutoRefresh] = useState(false);
      // ใช้ tick นี้แค่บังคับ re-render ทุก 30 วิ เพื่อให้ข้อความ "x นาทีที่แล้ว" ขยับตามเวลาจริง
      const [, setTick] = useState(0);

      const [sortField, setSortField] = useState("score");
      const [sortAsc, setSortAsc] = useState(false);

      // สแกนเร็วขึ้น: เดิมยิง SPY + 11 sector ETF แบบ "ทีละตัวตามลำดับ" (await ทีละคำขอ) ทำให้
      // เวลารวมของการสแกน = (จำนวนคำขอ) x (ช่วงเวลาขั้นต่ำต่อคำขอ + เวลาปิ๊งปั๊งเครือข่ายของคำขอนั้น)
      // ตอนนี้ยิงคำขอทั้งหมดเข้าคิว (tdQueue) พร้อมกันทีเดียวด้วย Promise.allSettled แทน — คิวยังคง
      // จำกัดอัตราการยิงจริงตาม tdRatePerMin ของผู้ใช้เหมือนเดิมทุกประการ (ไม่มีทางยิงเกินโควตา)
      // แต่ตัดเวลาปิ๊งปั๊งเครือข่ายที่ต้องรอซ้อนทับกันไปทีละคำขอออก ทำให้สแกนเสร็จเร็วขึ้นชัดเจน
      // โดยเฉพาะผู้ใช้แพ็กเกจ Twelve Data ที่มีโควตาสูง (rate limit ต่อนาทีมาก ๆ)
      const scanSectors = useCallback(async () => {
        if (!tdKey || !tdKey.trim()) {
          setError("โปรดใส่ Twelve Data API key ในเมนู ⚙ เพื่อเริ่มการสแกนอัตโนมัติ");
          return;
        }
        setLoading(true);
        setError(null);
        setProgress(0);

        const totalRequests = SECTOR_ETFS.length + 1; // +1 สำหรับ SPY (benchmark)
        let doneRequests = 0;
        const bumpProgress = () => {
          doneRequests += 1;
          setProgress(Math.round((doneRequests / totalRequests) * 100));
        };

        try {
          const spyPromise = fetchSeries("SPY", tdKey, "1week", 70)
            .then((series) => { bumpProgress(); return series; })
            .catch((e) => {
              console.warn("Couldn't fetch SPY, using absolute sector metrics.", e);
              bumpProgress();
              return null;
            });

          const sectorPromises = SECTOR_ETFS.map((sec) =>
            fetchSeries(sec.symbol, tdKey, "1week", 70)
              .then((series) => { bumpProgress(); return { sec, series }; })
              .catch((err) => {
                console.error(`Failed to fetch ${sec.symbol}`, err);
                bumpProgress();
                return { sec, series: null };
              })
          );

          // ทุกคำขอถูก "ส่งเข้าคิว" พร้อมกันตั้งแต่ต้น (ไม่รอผลลัพธ์ของตัวก่อนหน้าก่อนส่งตัวถัดไป)
          // ระบบคิวจะทยอยไล่ยิงตามอัตราที่ตั้งไว้เองโดยอัตโนมัติ
          const [spySeries, sectorResults] = await Promise.all([spyPromise, Promise.all(sectorPromises)]);

          const spyReturns = spySeries && spySeries.length >= 20 ? {
            r1w: ((spySeries[spySeries.length - 1].close - spySeries[spySeries.length - 2].close) / spySeries[spySeries.length - 2].close) * 100,
            r1m: ((spySeries[spySeries.length - 1].close - spySeries[Math.max(0, spySeries.length - 5)].close) / spySeries[Math.max(0, spySeries.length - 5)].close) * 100,
            r3m: ((spySeries[spySeries.length - 1].close - spySeries[0].close) / spySeries[0].close) * 100,
          } : { r1w: 0, r1m: 0, r3m: 0 };

          const results = [];
          for (const { sec, series } of sectorResults) {
            if (series && series.length >= 12) {
              const len = series.length;
              const pNow = series[len - 1].close;
              const p1w = series[Math.max(0, len - 2)].close;
              const p1m = series[Math.max(0, len - 5)].close;
              const p3m = series[0].close;

              const r1w = ((pNow - p1w) / p1w) * 100;
              const r1m = ((pNow - p1m) / p1m) * 100;
              const r3m = ((pNow - p3m) / p3m) * 100;

              const rel1w = r1w - spyReturns.r1w;
              const rel1m = r1m - spyReturns.r1m;
              const rel3m = r3m - spyReturns.r3m;

              let quadrant = "Lagging";
              if (rel1m >= 0 && rel1w >= 0) quadrant = "Leading";
              else if (rel1m >= 0 && rel1w < 0) quadrant = "Weakening";
              else if (rel1m < 0 && rel1w >= 0) quadrant = "Improving";
              else quadrant = "Lagging";

              const score = (rel1w * 0.4) + (rel1m * 0.4) + (rel3m * 0.2);

              results.push({
                ...sec,
                price: pNow,
                r1w, r1m, r3m,
                rel1w, rel1m, rel3m,
                quadrant,
                score
              });
            }
          }

          results.sort((a, b) => b.score - a.score);
          const now = Date.now();
          setSectorData(results);
          setScannedAt(now);
          saveStore("us-dash-sector-data", { items: results, scannedAt: now });
        } catch (e) {
          setError(e.message || "เกิดข้อผิดพลาดในการโหลดข้อมูล Sector");
        } finally {
          setLoading(false);
        }
      }, [tdKey]);

      // โหลดแคชที่มีอยู่ก่อน แล้วสแกนใหม่อัตโนมัติเฉพาะตอนที่ข้อมูล "เก่าเกินไปแล้วจริง ๆ"
      // (เดิมใช้ตัวแปร sectorAutoScanned สแกนอัตโนมัติแค่ครั้งเดียวต่อการโหลดหน้าเว็บ ไม่สนอายุ
      // ข้อมูลเลย — พอรีเฟรชหน้าถี่ ๆ ก็ยิง API ซ้ำทั้งที่ข้อมูลยังสดอยู่ หรือถ้าเปิดแท็บค้างไว้นาน
      // ข้อมูลก็เก่ามากโดยไม่มีการเตือนหรือรีเฟรชให้เลย)
      useEffect(() => {
        let cancelled = false;
        loadStore("us-dash-sector-data", null).then((cached) => {
          if (cancelled || !cached) return;
          // รองรับข้อมูลแคชแบบเก่า (เป็น array ล้วน ไม่มี timestamp) เพื่อไม่ให้ผู้ใช้เดิมเสียข้อมูล
          const items = Array.isArray(cached) ? cached : cached.items;
          const ts = Array.isArray(cached) ? null : cached.scannedAt;
          if (items && items.length) {
            setSectorData(items);
            setScannedAt(ts || null);
          }

          const age = ts ? Date.now() - ts : Infinity;
          if (tdKey && tdKey.trim() && !sectorAutoScanned && age >= SECTOR_CACHE_TTL_MS) {
            sectorAutoScanned = true;
            scanSectors();
          }
        });
        return () => { cancelled = true; };
      }, [tdKey, scanSectors]);

      // แสดงเวลาแบบสัมพัทธ์ให้ขยับเองทุก 30 วิ โดยไม่ต้องยิง API ใหม่ (แค่ re-render ข้อความ)
      useEffect(() => {
        const id = setInterval(() => setTick((t) => t + 1), 30000);
        return () => clearInterval(id);
      }, []);

      // โหมด Auto-refresh: สแกนซ้ำอัตโนมัติทุก SECTOR_AUTO_REFRESH_MS ตราบเท่าที่ยังเปิดหน้านี้ค้างไว้
      // และมี API key แล้ว ช่วยให้ข้อมูล Sector Rotation ทันสมัยต่อเนื่องโดยไม่ต้องกดสแกนเอง
      useEffect(() => {
        if (!autoRefresh || !tdKey || !tdKey.trim()) return undefined;
        const id = setInterval(() => scanSectors(), SECTOR_AUTO_REFRESH_MS);
        return () => clearInterval(id);
      }, [autoRefresh, tdKey, scanSectors]);

      const dataAgeMs = scannedAt ? Date.now() - scannedAt : null;
      const isStale = dataAgeMs != null && dataAgeMs >= SECTOR_STALE_WARN_MS;

      const sortedSectorData = useMemo(() => {
        return [...sectorData].sort((a, b) => {
          const valA = a[sortField] ?? 0;
          const valB = b[sortField] ?? 0;
          return sortAsc ? valA - valB : valB - valA;
        });
      }, [sectorData, sortField, sortAsc]);

      const handleSort = (field) => {
        if (sortField === field) {
          setSortAsc(!sortAsc);
        } else {
          setSortField(field);
          setSortAsc(false);
        }
      };

      const quadrants = useMemo(() => {
        const groups = { Leading: [], Weakening: [], Improving: [], Lagging: [] };
        sectorData.forEach((s) => {
          if (groups[s.quadrant]) groups[s.quadrant].push(s);
        });
        return groups;
      }, [sectorData]);

      const QUAD_STYLE = {
        Leading: "text-emerald-400 bg-emerald-500/10 border-emerald-500/30",
        Weakening: "text-amber-400 bg-amber-500/10 border-amber-500/30",
        Improving: "text-blue-400 bg-blue-500/10 border-blue-500/30",
        Lagging: "text-red-400 bg-red-500/10 border-red-500/30",
      };

      return (
        <div className="space-y-4">
          <div className="bg-zinc-900 border border-zinc-800 rounded-lg p-4 flex flex-wrap items-center justify-between gap-3">
            <div>
              <div className="font-semibold text-base flex items-center gap-2">
                <PieChart className="text-emerald-400" size={18} />
                Sector Rotation Radar (Twelve Data Realtime)
              </div>
              <div className="text-xs text-zinc-400 mt-1">
                เปรียบเทียบความแข็งแกร่งสัมพัทธ์ (Relative Strength) ของ 11 Sectors เทียบกับ S&P 500 (SPY)
              </div>
              {scannedAt && (
                <div className={`text-[11px] mt-1.5 flex items-center gap-1.5 ${isStale ? "text-amber-400" : "text-zinc-500"}`}>
                  {isStale && <AlertTriangle size={11} className="shrink-0" />}
                  <span>
                    อัปเดตล่าสุด {formatRelativeTime(scannedAt)}
                    {isStale ? " • ข้อมูลอาจไม่ทันสมัย กดสแกนใหม่อีกครั้ง" : ""}
                  </span>
                </div>
              )}
            </div>

            <div className="flex items-center gap-3">
              <label className="flex items-center gap-1.5 text-[11px] text-zinc-400 cursor-pointer select-none">
                <input
                  type="checkbox"
                  checked={autoRefresh}
                  onChange={(e) => setAutoRefresh(e.target.checked)}
                  className="accent-blue-500"
                />
                Auto-refresh ทุก 20 นาที
              </label>
              <button
                onClick={scanSectors}
                disabled={loading}
                className="flex items-center gap-2 px-4 py-2 rounded bg-blue-600 text-white font-medium text-xs hover:bg-blue-500 disabled:opacity-50 transition"
              >
                <RefreshCw size={14} className={loading ? "animate-spin" : ""} />
                {loading ? `กำลังสแกนเรียลไทม์... (${progress}%)` : "สแกน Sector อัปเดตใหม่"}
              </button>
            </div>
          </div>

          {error && (
            <div className="flex items-center gap-2 text-red-400 text-xs bg-red-500/10 border border-red-500/30 rounded px-3 py-2">
              <AlertTriangle size={14} className="shrink-0" /> {error}
            </div>
          )}

          <div className="bg-zinc-900 border border-zinc-800 rounded-lg p-4">
            <div className="text-sm font-semibold text-zinc-200 mb-3 flex items-center justify-between">
              <span>🎯 Sector Rotation Matrix</span>
              <span className="text-xs font-normal text-zinc-500">แกน X: โมเมนตัม 1W | แกน Y: แนวโน้ม 1M</span>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
              <div className="bg-zinc-950/80 border border-blue-500/30 rounded p-3 relative min-h-[120px]">
                <div className="flex items-center justify-between border-b border-zinc-800 pb-1.5 mb-2">
                  <span className="text-xs font-semibold text-blue-400 flex items-center gap-1.5">
                    <span className="w-2 h-2 rounded-full bg-blue-400"></span> IMPROVING (กำลังฟื้นตัว)
                  </span>
                </div>
                <div className="flex flex-wrap gap-1.5">
                  {quadrants.Improving.map((s) => (
