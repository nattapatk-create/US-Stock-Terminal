    function App() {
      const [symbols, setSymbols] = useState([]);
      const [dataMap, setDataMap] = useState({});
      const dataMapRef = useRef({});
      useEffect(() => {
        dataMapRef.current = dataMap;
      }, [dataMap]);
      const [tdKey, setTdKey] = useState("");
      const [fhKey, setFhKey] = useState("");
      const [tdKeyDraft, setTdKeyDraft] = useState("");
      const [fhKeyDraft, setFhKeyDraft] = useState("");
      const [tdRatePerMin, setTdRatePerMin] = useState(8);
      const [tdRateDraft, setTdRateDraft] = useState("8");
      const [showSettings, setShowSettings] = useState(false);
      const [tab, setTab] = useState("watchlist");
      const [input, setInput] = useState("");
      const [booted, setBooted] = useState(false);
      const [refreshCooldown, setRefreshCooldown] = useState(0);
      const [tdCallsToday, setTdCallsToday] = useState(0);
      const cooldownRef = useRef(null);

      const [screenerFilter, setScreenerFilter] = useState("ALL");
      const [screenerSort, setScreenerSort] = useState("SCORE");

      const [watchlistTrendFilter, setWatchlistTrendFilter] = useState("ALL");
      const [watchlistSearch, setWatchlistSearch] = useState("");
      const deferredWatchlistSearch = useDeferredValue(watchlistSearch);

      useEffect(() => {
        (async () => {
          const [keys, wl] = await Promise.all([
            loadStore("us-dash-keys", { td: "", fh: "", tdRate: 8 }),
            loadStore("us-dash-watchlist", DEFAULT_WATCHLIST),
          ]);
          setTdKey(keys.td || "");
          setFhKey(keys.fh || "");
          setTdKeyDraft(keys.td || "");
          setFhKeyDraft(keys.fh || "");
          const rate = keys.tdRate || 8;
          setTdRatePerMin(rate);
          setTdRateDraft(String(rate));
          setTdRateLimit(rate);
          setSymbols(wl);

          const cachedMap = {};
          wl.forEach((s) => {
            const cached = loadCachedEntry(s);
            if (cached) cachedMap[s] = { ...cached, loading: true, stale: true };
          });
          if (Object.keys(cachedMap).length > 0) {
            setDataMap((prev) => ({ ...cachedMap, ...prev }));
          }

          setBooted(true);
        })();
      }, []);

      useEffect(() => {
        const tick = () => setTdCallsToday(getTdCallsToday());
        tick();
        const id = setInterval(tick, 3000);
        return () => clearInterval(id);
      }, []);

      const setEntry = useCallback((symbol, patch) => {
        setDataMap((prev) => ({ ...prev, [symbol]: { ...(prev[symbol] || {}), ...patch } }));
      }, []);

      const loadSymbol = useCallback(async (symbol, full = true, timeframe = DEFAULT_TIMEFRAME) => {
        setEntry(symbol, { loading: true, error: null });
        try {
          const key = tdKey.trim();
          const fh = fhKey.trim();
          if (!key) throw new Error("ยังไม่ได้ใส่ Twelve Data API key (ตั้งค่า ⚙)");

          const fhPromise = (full && fh)
            ? Promise.all([fetchFundamentals(symbol, fh), fetchProfile(symbol, fh)]).catch((fhErr) => {
                console.warn(`Finnhub error for ${symbol}:`, fhErr);
                return null;
              })
            : null;

          const quote = await fetchQuote(symbol, key);
          setEntry(symbol, { quote, loading: full, error: null, stale: false });

          if (full) {
            const series = await fetchSeries(symbol, key, timeframe);
            setEntry(symbol, { series, timeframe, loading: false, stale: false });
            saveCachedEntry(symbol, { quote, series, timeframe });

            if (fhPromise) {
              const fhResult = await fhPromise;
              if (fhResult) {
                const [fundamentals, profile] = fhResult;
                setEntry(symbol, { fundamentals, profile });
                saveCachedEntry(symbol, { quote, series, timeframe, fundamentals, profile });
              }
            }
          } else {
            setEntry(symbol, { loading: false });
          }
        } catch (e) {
          setEntry(symbol, { loading: false, error: e.message || "โหลดข้อมูลไม่สำเร็จ" });
        }
      }, [tdKey, fhKey, setEntry]);

      const loadSeries = useCallback(async (symbol, timeframe) => {
        setEntry(symbol, { loading: true, error: null });
        try {
          const key = tdKey.trim();
          if (!key) throw new Error("ยังไม่ได้ใส่ Twelve Data API key (ตั้งค่า ⚙)");
          const series = await fetchSeries(symbol, key, timeframe);
          setEntry(symbol, { series, timeframe, loading: false, error: null, stale: false });
          const existing = dataMapRef.current[symbol] || {};
          saveCachedEntry(symbol, {
            quote: existing.quote,
            series,
            timeframe,
            fundamentals: existing.fundamentals,
            profile: existing.profile,
          });
        } catch (e) {
          setEntry(symbol, { loading: false, error: e.message || "โหลดข้อมูลไม่สำเร็จ" });
        }
      }, [tdKey, setEntry]);

      useEffect(() => {
        if (!booted || !tdKey.trim()) return;
        symbols.forEach((s) => loadSymbol(s, true, dataMapRef.current[s]?.timeframe || DEFAULT_TIMEFRAME));
      }, [booted, tdKey, fhKey]);

      const handleSymbolTimeframeChange = useCallback((symbol, tf) => {
        if (dataMapRef.current[symbol]?.quote) loadSeries(symbol, tf);
        else loadSymbol(symbol, true, tf);
      }, [loadSeries, loadSymbol]);

      const handleRefreshSymbol = useCallback((s) => {
        loadSymbol(s, true, dataMapRef.current[s]?.timeframe || DEFAULT_TIMEFRAME);
      }, [loadSymbol]);

      const addSymbol = useCallback((raw) => {
        const s = raw.trim().toUpperCase();
        if (!s || symbols.includes(s) || symbols.length >= MAX_SYMBOLS) return;
        const next = [...symbols, s];
        setSymbols(next);
        saveStore("us-dash-watchlist", next);
        setInput("");
        if (tdKey.trim()) loadSymbol(s, true, DEFAULT_TIMEFRAME);
      }, [symbols, tdKey, loadSymbol]);

      const removeSymbol = useCallback((s) => {
        setSymbols((prev) => {
          const next = prev.filter((x) => x !== s);
          saveStore("us-dash-watchlist", next);
          return next;
        });
      }, []);

      const refreshAll = useCallback(() => {
        if (refreshCooldown > 0) return;
        symbols.forEach((s) => loadSymbol(s, true, dataMapRef.current[s]?.timeframe || DEFAULT_TIMEFRAME));
        setRefreshCooldown(20);
        cooldownRef.current = setInterval(() => {
          setRefreshCooldown((c) => {
            if (c <= 1) { clearInterval(cooldownRef.current); return 0; }
            return c - 1;
          });
        }, 1000);
      }, [refreshCooldown, symbols, loadSymbol]);

      const commitKeys = () => {
        const td = tdKeyDraft.trim();
        const fh = fhKeyDraft.trim();
        const rate = Math.max(1, parseInt(tdRateDraft, 10) || 8);
        if (td !== tdKey) setTdKey(td);
        if (fh !== fhKey) setFhKey(fh);
        setTdRatePerMin(rate);
        setTdRateDraft(String(rate));
        setTdRateLimit(rate);
        saveStore("us-dash-keys", { td, fh, tdRate: rate });
      };

      const exportBackup = () => {
        const data = {
          portfolios: JSON.parse(localStorage.getItem("us-dash-portfolios-v3") || "[]"),
          watchlist: JSON.parse(localStorage.getItem("us-dash-watchlist") || "[]"),
          keys: JSON.parse(localStorage.getItem("us-dash-keys") || "{}"),
          version: "3.0.0",
          exportDate: new Date().toISOString()
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `us-stock-terminal-backup-${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
      };

      const importBackup = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            if (parsed.portfolios) saveStore("us-dash-portfolios-v3", parsed.portfolios);
            if (parsed.watchlist) {
              saveStore("us-dash-watchlist", parsed.watchlist);
              setSymbols(parsed.watchlist);
            }
            if (parsed.keys) {
              saveStore("us-dash-keys", parsed.keys);
              setTdKey(parsed.keys.td || "");
              setFhKey(parsed.keys.fh || "");
              setTdKeyDraft(parsed.keys.td || "");
              setFhKeyDraft(parsed.keys.fh || "");
              const rate = parsed.keys.tdRate || 8;
              setTdRatePerMin(rate);
              setTdRateDraft(String(rate));
              setTdRateLimit(rate);
            }
            alert("นำเข้าข้อมูลสำรองสำเร็จเรียบร้อย!");
            window.location.reload();
          } catch (err) {
            alert("ไฟล์สำรองไม่ถูกต้อง: " + err.message);
          }
        };
        reader.readAsText(file);
      };

      const sortedScreenerSymbols = useMemo(() => {
        let list = symbols.map((sym) => {
          const entry = dataMap[sym];
          const evalData = calculateAutoSCurve(entry);
          return { symbol: sym, entry, evalData, totalScore: evalData ? evalData.total : 0 };
        });

        if (screenerFilter === "CANDIDATES") {
          list = list.filter((item) => item.totalScore >= 16);
        } else if (screenerFilter === "WATCH") {
          list = list.filter((item) => item.totalScore >= 11 && item.totalScore < 16);
        } else if (screenerFilter === "UNQUALIFIED") {
          list = list.filter((item) => item.totalScore < 11);
        }

        list.sort((a, b) => {
          if (screenerSort === "REV") {
            return (b.evalData?.revGrowthPct ?? -999) - (a.evalData?.revGrowthPct ?? -999);
          }
          if (screenerSort === "MARGIN") {
            return (b.evalData?.grossMarginPct ?? -999) - (a.evalData?.grossMarginPct ?? -999);
          }
          return b.totalScore - a.totalScore;
        });

        return list;
      }, [symbols, dataMap, screenerFilter, screenerSort]);

      const filteredWatchlistSymbols = useMemo(() => {
        return symbols.filter((sym) => {
          const entry = dataMap[sym];
          const fullName = getStockName(sym, entry?.profile?.name).toUpperCase();
          const query = deferredWatchlistSearch.toUpperCase();
          const searchMatch = !query || sym.includes(query) || fullName.includes(query);
          if (!searchMatch) return false;

          if (watchlistTrendFilter === "ALL") return true;

          if (entry && entry.series && entry.series.length > 20) {
            const cls = classify(entry.series);
            return cls.trend === watchlistTrendFilter;
          }
          return true;
        });
      }, [symbols, dataMap, deferredWatchlistSearch, watchlistTrendFilter]);

      return (
        <div className="min-h-full bg-zinc-950 text-zinc-100 pb-10">
          <div className="border-b border-zinc-800 px-4 py-3 flex items-center gap-3 flex-wrap bg-zinc-900/40">
            <Radar size={20} className="text-blue-400" />
            <div>
              <div className="font-semibold text-sm flex items-center gap-2">
                US Stock Terminal <span className="text-[10px] bg-blue-500/20 text-blue-300 border border-blue-500/40 px-1.5 py-0.5 rounded font-mono">v3.0 Pro</span>
              </div>
              <div className="text-[11px] text-zinc-500 font-sans">Twelve Data (ราคา & กราฟ) | Finnhub (งบการเงิน & โลโก้)</div>
            </div>
            <div className="ml-auto flex items-center gap-2">
              <span className="text-xs font-mono text-zinc-400 border border-zinc-800 bg-zinc-900 px-2 py-1 rounded">
                TD Calls Today: <strong className="text-blue-400">{tdCallsToday}</strong>
                <span className="text-zinc-600 mx-1.5">|</span>
                {tdRatePerMin}/นาที
              </span>
              <button
                onClick={exportBackup}
                className="flex items-center gap-1 text-xs bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 px-2.5 py-1 rounded text-zinc-300"
                title="ส่งออกข้อมูลสำรอง"
              >
                <Download size={13} /> สำรองข้อมูล
              </button>
              <label className="flex items-center gap-1 text-xs bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 px-2.5 py-1 rounded text-zinc-300 cursor-pointer">
                <Upload size={13} /> นำเข้าข้อมูล
                <input type="file" accept=".json" onChange={importBackup} className="hidden" />
              </label>
              <button
                onClick={() => setShowSettings((s) => !s)}
                className="p-1.5 rounded hover:bg-zinc-800 text-zinc-400 hover:text-zinc-200 border border-zinc-800 bg-zinc-900"
              >
                <Settings size={16} />
              </button>
            </div>
          </div>

          {showSettings && (
            <div className="p-4 bg-zinc-900 border-b border-zinc-800 space-y-3">
              <div className="text-xs font-semibold text-zinc-200">⚙️ การตั้งค่า API Key</div>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                <div>
                  <label className="text-zinc-400 block mb-1">Twelve Data API Key (หลัก สำหรับราคา & กราฟ)</label>
                  <input
                    type="password"
                    value={tdKeyDraft}
                    onChange={(e) => setTdKeyDraft(e.target.value)}
                    className="w-full bg-zinc-950 border border-zinc-800 rounded px-3 py-1.5 font-mono text-zinc-100"
                    placeholder="ใส่ Key Twelve Data"
                  />
                </div>
                <div>
                  <label className="text-zinc-400 block mb-1">Finnhub API Key (เสริม สำหรับงบการเงิน & โลโก้)</label>
                  <input
                    type="password"
                    value={fhKeyDraft}
                    onChange={(e) => setFhKeyDraft(e.target.value)}
                    className="w-full bg-zinc-950 border border-zinc-800 rounded px-3 py-1.5 font-mono text-zinc-100"
                    placeholder="ใส่ Key Finnhub"
                  />
                </div>
              </div>
              <div className="text-xs max-w-sm">
                <label className="text-zinc-400 block mb-1">
                  Twelve Data: จำนวนคำขอสูงสุดต่อนาที (ตาม Plan ของคุณ)
                </label>
                <input
                  type="number"
                  min="1"
                  value={tdRateDraft}
                  onChange={(e) => setTdRateDraft(e.target.value)}
                  className="w-28 bg-zinc-950 border border-zinc-800 rounded px-3 py-1.5 font-mono text-zinc-100"
                  placeholder="8"
                />
              </div>
              <button
                onClick={() => { commitKeys(); setShowSettings(false); }}
                className="px-4 py-1.5 bg-blue-600 hover:bg-blue-500 rounded text-xs text-white font-medium"
              >
                บันทึก API Keys
              </button>
            </div>
          )}

          <div className="px-4 border-b border-zinc-800 flex items-center justify-between gap-2 overflow-x-auto bg-zinc-950">
            <div className="flex gap-1 py-2">
              <button
                onClick={() => setTab("portfolio")}
                className={`flex items-center gap-2 px-3.5 py-1.5 rounded-md text-xs font-medium transition ${tab === "portfolio" ? "bg-blue-600 text-white font-bold" : "text-zinc-400 hover:text-zinc-200 hover:bg-zinc-900"}`}
              >
                <Briefcase size={14} /> พอร์ตลงทุน (Multi-Portfolio)
              </button>
              <button
                onClick={() => setTab("watchlist")}
                className={`flex items-center gap-2 px-3.5 py-1.5 rounded-md text-xs font-medium transition ${tab === "watchlist" ? "bg-blue-600 text-white font-bold" : "text-zinc-400 hover:text-zinc-200 hover:bg-zinc-900"}`}
              >
                <Radar size={14} /> Watchlist & Technical
              </button>
              <button
                onClick={() => setTab("screener")}
                className={`flex items-center gap-2 px-3.5 py-1.5 rounded-md text-xs font-medium transition ${tab === "screener" ? "bg-blue-600 text-white font-bold" : "text-zinc-400 hover:text-zinc-200 hover:bg-zinc-900"}`}
              >
                <Zap size={14} /> 10x S-Curve Screener
              </button>
              <button
                onClick={() => setTab("sector")}
                className={`flex items-center gap-2 px-3.5 py-1.5 rounded-md text-xs font-medium transition ${tab === "sector" ? "bg-blue-600 text-white font-bold" : "text-zinc-400 hover:text-zinc-200 hover:bg-zinc-900"}`}
              >
                <PieChart size={14} /> Sector Rotation
              </button>
            </div>
          </div>

          <div className="max-w-7xl mx-auto p-4 space-y-4">
            {tab === "portfolio" && (
              <PortfolioView tdKey={tdKey} dataMap={dataMap} loadSymbol={loadSymbol} />
            )}

            {tab === "watchlist" && (
              <div className="space-y-4">
                <WeeklyRecommendedPanel
                  tdKey={tdKey}
                  fhKey={fhKey}
                  dataMap={dataMap}
                  loadSymbol={loadSymbol}
                  symbols={symbols}
                  onAdd={addSymbol}
                />

                <div className="bg-zinc-900 border border-zinc-800 rounded-lg p-3 flex flex-wrap items-center justify-between gap-3">
                  <form
                    onSubmit={(e) => { e.preventDefault(); addSymbol(input); }}
                    className="flex items-center gap-2 flex-1 min-w-[240px]"
                  >
                    <input
                      type="text"
                      placeholder="เพิ่มหุ้นเข้า Watchlist เช่น TSLA, AAPL..."
                      value={input}
                      onChange={(e) => setInput(e.target.value)}
                      className="bg-zinc-950 border border-zinc-800 rounded px-3 py-1.5 text-xs text-zinc-100 font-mono flex-1 uppercase"
                    />
                    <button type="submit" className="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 rounded text-xs font-medium text-white shrink-0">
                      + เพิ่ม
                    </button>
                  </form>

                  <div className="flex items-center gap-2">
                    <div className="relative">
                      <Search size={14} className="absolute left-2.5 top-2 text-zinc-500" />
                      <input
                        type="text"
                        placeholder="ค้นหา Symbol หรือชื่อ..."
                        value={watchlistSearch}
                        onChange={(e) => setWatchlistSearch(e.target.value)}
                        className="bg-zinc-950 border border-zinc-800 rounded pl-8 pr-2 py-1 text-xs text-zinc-100 w-36 focus:w-48 transition-all"
                      />
                    </div>
                    <select
                      value={watchlistTrendFilter}
                      onChange={(e) => setWatchlistTrendFilter(e.target.value)}
                      className="bg-zinc-950 border border-zinc-800 rounded px-2 py-1 text-xs text-zinc-300 font-mono"
                    >
                      <option value="ALL">ทุกเทรนด์</option>
                      <option value="Uptrend">ขาขึ้น (Uptrend)</option>
                      <option value="Downtrend">ขาลง (Downtrend)</option>
                      <option value="Sideways">แกว่งตัว (Sideways)</option>
                    </select>

                    <button
                      onClick={refreshAll}
                      disabled={refreshCooldown > 0}
                      className="px-3 py-1 bg-zinc-800 hover:bg-zinc-700 disabled:opacity-50 rounded text-xs text-zinc-300 flex items-center gap-1.5 shrink-0"
                    >
                      <RefreshCw size={13} className={refreshCooldown > 0 ? "animate-spin" : ""} />
                      {refreshCooldown > 0 ? `${refreshCooldown}s` : "อัปเดตทั้งหมด"}
                    </button>
                  </div>
                </div>

                <div className="space-y-3">
                  {filteredWatchlistSymbols.map((sym) => (
                    <TickerCard
                      key={sym}
                      symbol={sym}
                      entry={dataMap[sym]}
                      onRemove={removeSymbol}
                      onRefresh={handleRefreshSymbol}
                      onTimeframeChange={handleSymbolTimeframeChange}
                    />
                  ))}
                  {filteredWatchlistSymbols.length === 0 && (
                    <div className="text-center text-zinc-500 py-12 bg-zinc-900 border border-zinc-800 rounded-lg text-xs">
                      ไม่พบรายการหุ้นตรงตามเงื่อนไขค้นหา
                    </div>
                  )}
                </div>
              </div>
            )}

            {tab === "screener" && (
              <div className="space-y-4">
                {!fhKey.trim() && (
                  <div className="bg-amber-500/10 border border-amber-500/30 rounded-lg p-3 text-xs text-amber-300 flex items-start gap-2">
                    <span>⚠️</span>
                    <span>
                      ยังไม่ได้ใส่ <strong>Finnhub API Key</strong> — ข้อมูลรายได้เติบโต (Revenue Growth), Gross Margin,
                      Market Cap และคะแนน S-Curve บางส่วนจะแสดงเป็น "—" จนกว่าจะตั้งค่า Finnhub Key ในเมนู ⚙ ที่มุมขวาบน
                    </span>
                  </div>
                )}

                <div className="bg-zinc-900 border border-zinc-800 rounded-lg p-4 flex flex-wrap items-center justify-between gap-3">
                  <div>
                    <div className="font-semibold text-base flex items-center gap-2">
                      <Zap className="text-amber-400" size={18} />
                      Automated 10x-100x S-Curve Screener
                    </div>
                    <div className="text-xs text-zinc-400 mt-1">
                      อัลกอริทึมสแกนปัจจัยพื้นฐาน (Finnhub) + เทคนิคัล (Twelve Data) คะแนนเต็ม 20 คะแนน
                    </div>
                  </div>

                  <div className="flex items-center gap-3 text-xs flex-wrap">
                    <div className="flex items-center gap-1.5">
                      <span className="text-zinc-400">ตัวกรอง:</span>
                      <select
                        value={screenerFilter}
                        onChange={(e) => setScreenerFilter(e.target.value)}
                        className="bg-zinc-950 border border-zinc-800 rounded px-2.5 py-1 text-zinc-200 font-mono"
                      >
                        <option value="ALL">ทั้งหมด ({symbols.length})</option>
                        <option value="CANDIDATES">🔥 ตัวเต็ง S-Curve (16+ คะแนน)</option>
                        <option value="WATCH">👀 น่าจับตา (11-15 คะแนน)</option>
                        <option value="UNQUALIFIED">⚠️ ยังไม่เข้าเกณฑ์ (&lt;11 คะแนน)</option>
                      </select>
                    </div>

                    <div className="flex items-center gap-1.5">
                      <span className="text-zinc-400">เรียงตาม:</span>
                      <select
                        value={screenerSort}
                        onChange={(e) => setScreenerSort(e.target.value)}
                        className="bg-zinc-950 border border-zinc-800 rounded px-2.5 py-1 text-zinc-200 font-mono"
                      >
                        <option value="SCORE">คะแนน S-Curve รวม</option>
                        <option value="REV">อัตราการเติบโตรายได้ YoY</option>
                        <option value="MARGIN">อัตรากำไรขั้นต้น (Gross Margin)</option>
                      </select>
                    </div>
                  </div>
                </div>

                <div className="bg-zinc-900 border border-zinc-800 rounded-lg overflow-hidden divide-y divide-zinc-800">
                  {sortedScreenerSymbols.map(({ symbol, entry }) => (
                    <ScreenerRow key={symbol} symbol={symbol} entry={entry} />
                  ))}
                  {sortedScreenerSymbols.length === 0 && (
                    <div className="text-center text-zinc-500 py-12 text-xs">
                      ไม่พบรายการหุ้นที่ตรงกับเงื่อนไขตัวกรอง S-Curve
                    </div>
                  )}
                </div>
              </div>
            )}

            {tab === "sector" && (
              <SectorRotationView tdKey={tdKey} />
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
